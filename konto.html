<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konto — Printerlase3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 20% 10%,rgba(0,170,255,.2),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(120,60,255,.2),transparent 35%),
        #020611;
}

.card{
    width:100%;
    max-width:460px;
    padding:35px;
    border-radius:25px;
    background:rgba(7,17,32,.9);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 100px rgba(0,0,0,.5);
    backdrop-filter:blur(20px);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-icon{
    width:60px;
    height:60px;
    margin:auto;
    display:grid;
    place-items:center;
    border-radius:18px;
    font-size:28px;
    font-weight:1000;
    background:linear-gradient(135deg,#00dfff,#087dff,#803cff);
    box-shadow:0 0 40px rgba(0,150,255,.3);
}

.logo h1{
    margin-top:15px;
    font-size:25px;
}

.logo p{
    color:#758398;
    font-size:12px;
    margin-top:7px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:25px;
}

.tab{
    padding:12px;
    border:1px solid #ffffff10;
    border-radius:10px;
    background:#ffffff06;
    color:#8290a5;
    cursor:pointer;
    font-weight:bold;
}

.tab.active{
    color:white;
    background:#008cff20;
    border-color:#00cfff55;
}

.field{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#aeb9c9;
    font-size:11px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #ffffff12;
    outline:none;
    background:#030a14;
    color:white;
}

input:focus{
    border-color:#00cfff66;
}

.button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    color:white;
    cursor:pointer;
    font-weight:1000;
    background:linear-gradient(100deg,#008cff,#783cff);
    transition:.25s;
}

.button:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px #008cff30;
}

.message{
    min-height:20px;
    margin-top:15px;
    text-align:center;
    color:#ff8290;
    font-size:12px;
}

.back{
    display:block;
    margin-top:20px;
    text-align:center;
    color:#718096;
    text-decoration:none;
    font-size:12px;
}

.back:hover{
    color:white;
}

.admin-info{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#00cfff0d;
    border:1px solid #00cfff25;
    color:#63ddff;
    font-size:12px;
    text-align:center;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">

        <div class="logo-icon">
            P
        </div>

        <h1>Printerlase3D</h1>

        <p>
            Twoje konto
        </p>

    </div>


    <div class="tabs">

        <button
            class="tab active"
            id="loginTab"
            onclick="showLogin()"
        >
            Logowanie
        </button>

        <button
            class="tab"
            id="registerTab"
            onclick="showRegister()"
        >
            Rejestracja
        </button>

    </div>


    <!-- LOGOWANIE -->

    <div id="loginForm">

        <div class="field">

            <label>
                E-MAIL
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="twoj@email.pl"
            >

        </div>


        <div class="field">

            <label>
                HASŁO
            </label>

            <input
                id="loginPassword"
                type="password"
                placeholder="Twoje hasło"
            >

        </div>


        <button
            class="button"
            onclick="login()"
        >
            Zaloguj się
        </button>

    </div>


    <!-- REJESTRACJA -->

    <div
        id="registerForm"
        style="display:none;"
    >

        <div class="field">

            <label>
                IMIĘ
            </label>

            <input
                id="registerName"
                type="text"
                placeholder="Jan"
            >

        </div>


        <div class="field">

            <label>
                E-MAIL
            </label>

            <input
                id="registerEmail"
                type="email"
                placeholder="twoj@email.pl"
            >

        </div>


        <div class="field">

            <label>
                HASŁO
            </label>

            <input
                id="registerPassword"
                type="password"
                placeholder="Minimum 6 znaków"
            >

        </div>


        <button
            class="button"
            onclick="register()"
        >
            Utwórz konto
        </button>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="adminInfo"
        class="admin-info"
    >
        🔐 Konto administratora wykryte.
        <br><br>

        <a
            href="admin.html"
            style="color:#35d8ff;"
        >
            Otwórz panel administratora →
        </a>
    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Wróć do sklepu
    </a>

</div>


<script>

const ADMIN_EMAIL =
    "rembolek341@gmail.com";


function getUsers(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "printerlase_users"
            )
        ) || [];

    }catch(e){

        return [];

    }

}


function saveUsers(users){

    localStorage.setItem(
        "printerlase_users",
        JSON.stringify(users)
    );

}


/* ===== ZAKŁADKI ===== */

function showLogin(){

    document.getElementById(
        "loginForm"
    ).style.display = "block";

    document.getElementById(
        "registerForm"
    ).style.display = "none";

    document.getElementById(
        "loginTab"
    ).classList.add("active");

    document.getElementById(
        "registerTab"
    ).classList.remove("active");

    clearMessage();
}


function showRegister(){

    document.getElementById(
        "loginForm"
    ).style.display = "none";

    document.getElementById(
        "registerForm"
    ).style.display = "block";

    document.getElementById(
        "loginTab"
    ).classList.remove("active");

    document.getElementById(
        "registerTab"
    ).classList.add("active");

    clearMessage();
}


/* ===== REJESTRACJA ===== */

function register(){

    const name =
        document.getElementById(
            "registerName"
        ).value.trim();

    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim().toLowerCase();

    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    if(!name || !email || !password){

        showMessage(
            "Uzupełnij wszystkie pola."
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Hasło musi mieć minimum 6 znaków."
        );

        return;
    }


    const users =
        getUsers();


    if(
        users.some(
            user =>
                user.email === email
        )
    ){

        showMessage(
            "Konto z tym e-mailem już istnieje."
        );

        return;
    }


    users.push({

        name:name,

        email:email,

        password:password,

        createdAt:new Date().toISOString()

    });


    saveUsers(users);


    localStorage.setItem(
        "printerlase_current_user",
        JSON.stringify({
            name:name,
            email:email
        })
    );


    localStorage.setItem(
        "printerlase_admin_email",
        email === ADMIN_EMAIL
        ? ADMIN_EMAIL
        : ""
    );


    showSuccess(
        "Konto zostało utworzone."
    );

}


/* ===== LOGOWANIE ===== */

function login(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim().toLowerCase();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if(!email || !password){

        showMessage(
            "Wpisz e-mail i hasło."
        );

        return;
    }


    const users =
        getUsers();


    const user =
        users.find(
            u =>
                u.email === email &&
                u.password === password
        );


    /*
       Specjalne konto admina.
       Przy pierwszym użyciu możesz zalogować
       się po utworzeniu konta z tym e-mailem.
    */

    if(!user){

        showMessage(
            "Nieprawidłowy e-mail lub hasło."
        );

        return;
    }


    localStorage.setItem(
        "printerlase_current_user",
        JSON.stringify({
            name:user.name,
            email:user.email
        })
    );


    if(
        user.email === ADMIN_EMAIL
    ){

        localStorage.setItem(
            "printerlase_admin_email",
            ADMIN_EMAIL
        );

        showSuccess(
            "Zalogowano jako administrator."
        );

        document.getElementById(
            "adminInfo"
        ).style.display = "block";

    }else{

        localStorage.removeItem(
            "printerlase_admin_email"
        );

        showSuccess(
            "Zalogowano pomyślnie."
        );

    }

}


/* ===== KOMUNIKATY ===== */

function showMessage(text){

    const element =
        document.getElementById(
            "message"
        );

    element.style.color =
        "#ff8290";

    element.textContent =
        text;

}


function showSuccess(text){

    const element =
        document.getElementById(
            "message"
        );

    element.style.color =
        "#42e6a4";

    element.textContent =
        text;

}


function clearMessage(){

    document.getElementById(
        "message"
    ).textContent = "";

}


/* ===== SPRAWDZENIE AKTUALNEGO KONTA ===== */

function checkCurrentUser(){

    try{

        const current =
            JSON.parse(
                localStorage.getItem(
                    "printerlase_current_user"
                )
            );


        if(
            current &&
            current.email === ADMIN_EMAIL
        ){

            document.getElementById(
                "adminInfo"
            ).style.display = "block";

        }

    }catch(e){}

}


checkCurrentUser();

</script>

</body>
</html>
