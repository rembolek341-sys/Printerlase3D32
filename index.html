<style>
/* =========================
   ANIMOWANE PRODUKTY
========================= */

.product-card {
    opacity: 0;
    transform: translateX(-100px) scale(.96);
    transition:
        opacity .8s cubic-bezier(.22,1,.36,1),
        transform .8s cubic-bezier(.22,1,.36,1);
    will-change: transform, opacity;
}

/* Produkty parzyste lecą z prawej */
.product-card:nth-child(even) {
    transform: translateX(100px) scale(.96);
}

/* Po wejściu na ekran */
.product-card.show {
    opacity: 1;
    transform: translateX(0) scale(1);
}

/* Hover */
.product-card:hover {
    transform: translateY(-12px) scale(1.025);
}

/* Zdjęcie produktu */
.product-card img {
    transition:
        transform .6s cubic-bezier(.22,1,.36,1),
        filter .6s ease;
}

/* Powiększenie zdjęcia */
.product-card:hover img {
    transform: scale(1.07) rotate(-1deg);
}

/* =========================
   ANIMOWANE PRZYCISKI
========================= */

.product-card button {
    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.product-card button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 150, 255, .25);
}

.product-card button:active {
    transform: scale(.94);
}


/* =========================
   SEKCJE
========================= */

.scroll-animation {
    opacity: 0;
    transform: translateY(70px);
    transition:
        opacity .9s ease,
        transform .9s cubic-bezier(.22,1,.36,1);
}

.scroll-animation.show {
    opacity: 1;
    transform: translateY(0);
}


/* =========================
   HERO
========================= */

.hero-animation {
    animation:
        heroEnter 1.1s cubic-bezier(.22,1,.36,1);
}

@keyframes heroEnter {

    from {
        opacity: 0;
        transform:
            translateY(40px)
            scale(.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================
   DELIKATNE ŚWIATŁO TŁA
========================= */

.animated-bg {
    position: relative;
    overflow: hidden;
}

.animated-bg::before {
    content: "";
    position: absolute;

    width: 500px;
    height: 500px;

    left: -200px;
    top: -200px;

    background:
        radial-gradient(
            circle,
            rgba(0, 174, 255, .18),
            transparent 70%
        );

    filter: blur(20px);

    animation:
        backgroundMove 8s ease-in-out infinite alternate;

    pointer-events: none;
}

.animated-bg::after {
    content: "";
    position: absolute;

    width: 500px;
    height: 500px;

    right: -200px;
    bottom: -200px;

    background:
        radial-gradient(
            circle,
            rgba(100, 50, 255, .15),
            transparent 70%
        );

    filter: blur(20px);

    animation:
        backgroundMove2 10s ease-in-out infinite alternate;

    pointer-events: none;
}

@keyframes backgroundMove {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(180px,100px);
    }

}

@keyframes backgroundMove2 {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(-150px,-100px);
    }

}


/* =========================
   KOSZYK WYSUWANY Z PRAWEJ
========================= */

.cart-panel {
    position: fixed;

    top: 0;
    right: 0;

    width: min(420px, 95vw);
    height: 100vh;

    background: rgba(5,12,25,.96);

    backdrop-filter: blur(20px);

    border-left:
        1px solid rgba(255,255,255,.1);

    transform: translateX(100%);

    transition:
        transform .45s cubic-bezier(.22,1,.36,1);

    z-index: 9999;
}

.cart-panel.open {
    transform: translateX(0);
}


/* =========================
   MODAL PRODUKTU
========================= */

.product-modal {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.75);

    backdrop-filter: blur(10px);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .3s ease,
        visibility .3s ease;

    z-index: 9998;
}

.product-modal.open {
    opacity: 1;
    visibility: visible;
}

.product-modal-content {
    width: min(900px, 95vw);
    max-height: 90vh;

    overflow: auto;

    background: #071120;

    border:
        1px solid #20324c;

    border-radius: 25px;

    transform:
        translateY(40px)
        scale(.94);

    transition:
        transform .45s
        cubic-bezier(.22,1,.36,1);
}

.product-modal.open
.product-modal-content {

    transform:
        translateY(0)
        scale(1);

}


/* =========================
   3D MODEL
========================= */

.model-3d {
    transition:
        transform .7s cubic-bezier(.22,1,.36,1);
}

.model-3d:hover {
    transform:
        rotateY(8deg)
        rotateX(-4deg)
        scale(1.03);
}


/* =========================
   REDUKCJA ANIMACJI
   DLA OSÓB, KTÓRE JĄ WYŁĄCZYŁY
========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;

        scroll-behavior: auto !important;
    }

}
</style>


<script>

/* =========================
   SCROLL ANIMATIONS
========================= */

const animationObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach(entry => {

                if (
                    entry.isIntersecting
                ) {

                    entry.target
                        .classList
                        .add("show");

                    /*
                     * Animacja odpala się tylko raz.
                     * Dzięki temu strona nie będzie
                     * cały czas animowała elementów.
                     */

                    animationObserver
                        .unobserve(entry.target);

                }

            });

        },

        {
            threshold: 0.12,

            rootMargin:
                "0px 0px -50px 0px"
        }

    );


/* =========================
   PRODUKTY
========================= */

function initProductAnimations() {

    document
        .querySelectorAll(".product-card")
        .forEach((card, index) => {

            /*
             * Delikatne opóźnienie każdego produktu.
             */

            card.style.transitionDelay =
                Math.min(index * 0.07, 0.5)
                + "s";

            animationObserver.observe(card);

        });

}


/* =========================
   SEKCJE
========================= */

function initScrollAnimations() {

    document
        .querySelectorAll(".scroll-animation")
        .forEach(element => {

            animationObserver
                .observe(element);

        });

}


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        initProductAnimations();

        initScrollAnimations();

    }
);


/* =========================
   DODAWANIE PRODUKTÓW
   JEŚLI PRODUKTY ŁADUJESZ
   DYNAMICZNIE Z API
========================= */

const productContainer =
    document.querySelector(
        "#products"
    );

if (productContainer) {

    const productObserver =
        new MutationObserver(() => {

            document
                .querySelectorAll(
                    ".product-card:not([data-animation-ready])"
                )
                .forEach((card,index) => {

                    card.dataset
                        .animationReady = "1";

                    card.style.transitionDelay =
                        Math.min(index * .07,.5)
                        + "s";

                    animationObserver
                        .observe(card);

                });

        });

    productObserver.observe(
        productContainer,
        {
            childList: true,
            subtree: true
        }
    );

}


/* =========================
   ESC → ZAMKNIJ MODALE
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key !== "Escape")
            return;

        document
            .querySelectorAll(
                ".cart-panel.open"
            )
            .forEach(el => {

                el.classList
                    .remove("open");

            });

        document
            .querySelectorAll(
                ".product-modal.open"
            )
            .forEach(el => {

                el.classList
                    .remove("open");

            });

    }
);

</script>
