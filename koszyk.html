<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koszyk — Printerlase3D</title>

<meta name="description" content="Koszyk Printerlase3D — sprawdź swoje zamówienie.">

<style>
:root{
    --bg:#030712;
    --bg2:#07111f;
    --card:rgba(10,20,36,.78);
    --card2:rgba(255,255,255,.045);
    --border:rgba(255,255,255,.09);
    --text:#fff;
    --muted:#8290a5;
    --blue:#18d8ff;
    --blue2:#008cff;
    --purple:#7554ff;
    --green:#31e6a0;
    --red:#ff5573;
    --shadow:0 25px 80px rgba(0,0,0,.38);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--text);
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 5%,rgba(0,210,255,.13),transparent 30%),
        radial-gradient(circle at 90% 25%,rgba(117,84,255,.15),transparent 32%),
        radial-gradient(circle at 50% 100%,rgba(0,140,255,.08),transparent 35%),
        var(--bg);
    overflow-x:hidden;
}

/* ================= NAVBAR ================= */

.navbar{
    height:76px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;

    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(3,7,18,.72);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    text-decoration:none;
    color:white;
    font-weight:900;
    font-size:19px;
}

.logo-mark{
    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:linear-gradient(
        135deg,
        #00d9ff,
        #008cff 45%,
        #7650ff
    );

    box-shadow:
        0 0 25px rgba(0,190,255,.28),
        inset 0 1px rgba(255,255,255,.35);

    font-size:12px;
    font-weight:1000;
}

.logo-name span{
    color:var(--blue);
}

.nav{
    display:flex;
    align-items:center;
    gap:25px;
}

.nav a{
    color:#8290a5;
    text-decoration:none;
    font-size:12px;
    font-weight:800;
    transition:.2s;
}

.nav a:hover{
    color:white;
}

.nav-right{
    display:flex;
    gap:9px;
}

.nav-button{
    position:relative;

    border:1px solid var(--border);
    background:rgba(255,255,255,.045);

    color:white;

    min-width:43px;
    height:43px;

    padding:0 13px;
    border-radius:12px;

    cursor:pointer;
    transition:.2s;
}

.nav-button:hover{
    border-color:rgba(0,210,255,.35);
    background:rgba(0,210,255,.08);
    transform:translateY(-2px);
}

.cart-number{
    position:absolute;
    top:-7px;
    right:-7px;

    min-width:20px;
    height:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 5px;

    background:linear-gradient(135deg,#00cfff,#7650ff);
    border-radius:50%;

    font-size:10px;
    font-weight:1000;

    border:2px solid var(--bg);

    box-shadow:0 5px 15px rgba(0,160,255,.3);
}

/* ================= CONTAINER ================= */

.container{
    width:min(1240px,92%);
    margin:auto;
}

/* ================= HEADER ================= */

.cart-header{
    padding:70px 0 38px;
}

.cart-header small{
    color:var(--blue);
    font-size:10px;
    font-weight:1000;
    letter-spacing:4px;
}

.cart-header h1{
    margin-top:13px;
    font-size:clamp(40px,6vw,64px);
    letter-spacing:-3px;
    line-height:1;
}

.cart-header h1 span{
    background:linear-gradient(
        90deg,
        #fff,
        #3bdbff,
        #8064ff
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.cart-header p{
    margin-top:15px;
    color:var(--muted);
    font-size:14px;
}

/* ================= GRID ================= */

.cart-grid{
    display:grid;
    grid-template-columns:minmax(0,1.55fr) minmax(330px,.75fr);
    gap:25px;
    padding-bottom:90px;
}

/* ================= ITEMS ================= */

.cart-items{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.cart-item{
    display:grid;
    grid-template-columns:105px 1fr auto;

    align-items:center;
    gap:20px;

    padding:17px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(10,24,43,.9),
            rgba(6,14,27,.86)
        );

    border:1px solid var(--border);

    box-shadow:0 15px 50px rgba(0,0,0,.17);

    transition:.25s;

    animation:itemIn .4s ease both;
}

@keyframes itemIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.cart-item:hover{
    transform:translateY(-2px);
    border-color:rgba(0,210,255,.28);
    box-shadow:
        0 20px 55px rgba(0,0,0,.28),
        0 0 35px rgba(0,180,255,.04);
}

/* ================= IMAGE ================= */

.item-image{
    width:105px;
    height:105px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    border-radius:16px;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(0,213,255,.2),
            transparent 65%
        ),
        #071322;

    border:1px solid rgba(255,255,255,.07);

    color:#39ddff;
    font-size:25px;
    font-weight:1000;

    box-shadow:
        inset 0 0 30px rgba(0,180,255,.05);
}

.item-image::after{
    content:"";
    position:absolute;
    width:120%;
    height:1px;
    left:-10%;
    top:50%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,220,255,.5),
        transparent
    );

    opacity:.5;
}

/* ================= INFO ================= */

.item-info h3{
    font-size:16px;
    margin-bottom:8px;
}

.item-info p{
    color:#718097;
    font-size:12px;
    line-height:1.7;
}

.item-color{
    display:inline-flex;
    align-items:center;
    gap:6px;

    margin-top:9px;
    padding:6px 9px;

    border-radius:8px;

    background:rgba(255,255,255,.045);
    color:#a9b5c5;

    font-size:10px;
}

.item-color::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 8px var(--blue);
}

/* ================= CONTROLS ================= */

.item-controls{
    display:flex;
    align-items:center;
    gap:14px;
}

.quantity{
    display:flex;
    align-items:center;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;

    background:rgba(255,255,255,.025);
}

.quantity button{
    width:32px;
    height:35px;

    border:0;
    background:transparent;

    color:white;
    cursor:pointer;

    font-size:17px;

    transition:.2s;
}

.quantity button:hover{
    background:rgba(0,210,255,.13);
    color:var(--blue);
}

.quantity span{
    width:34px;
    text-align:center;
    font-size:12px;
    font-weight:1000;
}

.item-price{
    min-width:80px;
    text-align:right;

    font-size:16px;
    font-weight:1000;
}

.remove{
    width:34px;
    height:34px;

    border:1px solid transparent;
    background:transparent;

    color:#637188;

    border-radius:9px;

    cursor:pointer;

    transition:.2s;
}

.remove:hover{
    color:var(--red);
    background:rgba(255,70,100,.08);
    border-color:rgba(255,70,100,.15);
}

/* ================= SUMMARY ================= */

.summary{
    position:sticky;
    top:98px;

    padding:25px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(10,23,40,.95),
            rgba(5,11,23,.94)
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:var(--shadow);

    overflow:hidden;
}

.summary::before{
    content:"";
    position:absolute;

    width:180px;
    height:180px;

    right:-100px;
    top:-100px;

    border-radius:50%;

    background:rgba(0,210,255,.09);
    filter:blur(20px);

    pointer-events:none;
}

.summary h2{
    position:relative;
    font-size:21px;
    margin-bottom:25px;
}

.summary-line{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:16px;

    color:#8491a5;
    font-size:13px;
}

.summary-line strong{
    color:white;
}

.divider{
    height:1px;
    background:rgba(255,255,255,.07);
    margin:21px 0;
}

.total{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.total span{
    color:#8d9aac;
    font-size:14px;
}

.total strong{
    font-size:28px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #36ddff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

/* ================= DELIVERY ================= */

.delivery{
    margin:21px 0;
}

.delivery-title{
    color:#8a97aa;
    font-size:12px;
    margin-bottom:10px;
}

.delivery-option{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px;

    margin-bottom:8px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.025);

    cursor:pointer;

    transition:.2s;
}

.delivery-option:hover{
    border-color:rgba(0,210,255,.28);
}

.delivery-option.active{
    border-color:#00cfff;
    background:rgba(0,200,255,.075);
    box-shadow:0 0 20px rgba(0,200,255,.05);
}

.delivery-left{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:11px;
}

.delivery-left input{
    accent-color:#00cfff;
}

.delivery-price{
    font-weight:1000;
    font-size:11px;
}

/* ================= COUPON ================= */

.coupon-label{
    display:block;

    margin-bottom:8px;

    color:#8b98aa;
    font-size:11px;
    font-weight:700;
}

.coupon{
    display:flex;
    gap:8px;
}

.coupon input{
    min-width:0;
    width:100%;

    padding:12px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.09);

    background:rgba(255,255,255,.045);

    color:white;

    outline:none;

    text-transform:uppercase;

    transition:.2s;
}

.coupon input::placeholder{
    color:#566478;
    text-transform:none;
}

.coupon input:focus{
    border-color:#00cfff;
    box-shadow:0 0 0 3px rgba(0,200,255,.07);
}

.coupon button{
    border:1px solid rgba(0,200,255,.28);

    background:rgba(0,180,255,.1);

    color:#42dcff;

    border-radius:10px;

    padding:0 15px;

    cursor:pointer;

    font-weight:1000;

    transition:.2s;
}

.coupon button:hover{
    background:#00bfff;
    color:#03101a;
}

/* ================= DISCOUNT ================= */

.discount-line{
    display:none;

    align-items:center;
    justify-content:space-between;

    margin-top:12px;

    color:#32e5a0;

    font-size:12px;
    font-weight:800;
}

.discount-line.show{
    display:flex;
}

/* ================= CHECKOUT ================= */

.checkout{
    width:100%;

    padding:16px;

    margin-top:22px;

    border:0;
    border-radius:13px;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #6d4cff
        );

    color:white;

    font-size:14px;
    font-weight:1000;

    cursor:pointer;

    box-shadow:
        0 15px 35px rgba(0,130,255,.2);

    transition:.25s;
}

.checkout:hover{
    transform:translateY(-3px);

    box-shadow:
        0 20px 50px rgba(0,130,255,.35);
}

.checkout:active{
    transform:translateY(0);
}

.security{
    margin-top:12px;

    text-align:center;

    color:#566378;

    font-size:9px;
}

/* ================= EMPTY ================= */

.empty{
    padding:85px 30px;

    text-align:center;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(9,21,37,.92),
            rgba(5,13,24,.9)
        );

    border:1px solid rgba(255,255,255,.07);
}

.empty-icon{
    width:85px;
    height:85px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:0 auto 22px;

    border-radius:25px;

    background:rgba(0,190,255,.07);

    border:1px solid rgba(0,190,255,.12);

    font-size:40px;

    box-shadow:0 0 40px rgba(0,190,255,.07);
}

.empty h2{
    font-size:26px;
    margin-bottom:10px;
}

.empty p{
    color:#718095;
    margin-bottom:25px;
    font-size:13px;
}

.shop-button{
    display:inline-flex;

    padding:13px 22px;

    border-radius:11px;

    text-decoration:none;

    color:white;

    font-size:12px;
    font-weight:1000;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #704cff
        );

    transition:.2s;
}

.shop-button:hover{
    transform:translateY(-2px);
}

/* ================= TOAST ================= */

.toast{
    position:fixed;

    right:25px;
    bottom:25px;

    max-width:350px;

    padding:14px 18px;

    border-radius:13px;

    background:#0c1828;

    border:1px solid rgba(0,210,255,.3);

    box-shadow:0 20px 60px rgba(0,0,0,.5);

    transform:translateY(120px);
    opacity:0;

    transition:.3s;

    z-index:3000;

    font-size:12px;
    font-weight:700;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

.toast.success{
    border-color:rgba(49,230,160,.4);
}

.toast.error{
    border-color:rgba(255,80,110,.4);
}

/* ================= MOBILE ================= */

@media(max-width:950px){

    .nav{
        display:none;
    }

    .cart-grid{
        grid-template-columns:1fr;
    }

    .summary{
        position:static;
    }
}

@media(max-width:650px){

    .navbar{
        padding:0 17px;
    }

    .logo-name{
        font-size:16px;
    }

    .cart-header{
        padding-top:45px;
    }

    .cart-header h1{
        letter-spacing:-2px;
    }

    .cart-item{
        grid-template-columns:78px 1fr;
        gap:14px;
    }

    .item-image{
        width:78px;
        height:78px;
    }

    .item-controls{
        grid-column:1/-1;
        justify-content:space-between;
        padding-top:4px;
    }

    .item-price{
        text-align:left;
    }

    .summary{
        padding:20px;
    }

    .toast{
        left:15px;
        right:15px;
        bottom:15px;
        max-width:none;
    }
}

@media(max-width:420px){

    .nav-button:first-child{
        display:none;
    }

    .cart-item{
        padding:13px;
    }

    .item-info h3{
        font-size:14px;
    }

    .item-info p{
        font-size:11px;
    }

    .coupon{
        flex-direction:column;
    }

    .coupon button{
        padding:12px;
    }
}
</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="index.html" class="logo">

        <div class="logo-mark">
            P3D
        </div>

        <div class="logo-name">
            Printerlase<span>3D</span>
        </div>

    </a>

    <nav class="nav">

        <a href="index.html">
            Strona główna
        </a>

        <a href="index.html#breloki">

        </a>

        <a href="index.html#dodatki">

<!-- ================= CONTENT ================= -->

<main>

<section class="cart-header">

    <div class="container">

        <small>
            PRINTERLASE3D • KOSZYK
        </small>

        <h1>
            Twój <span>koszyk.</span>
        </h1>

<div class="cart-grid" id="cartGrid">

    <!-- ================= SUMMARY ================= -->

                Produkty
            </span>

            </strong>

        </div>


        <div class="summary-line">

            <span>
                Dostawa
            </span>

            <strong id="deliveryTotal">
                10,00 zł
            </strong>

        </div>


        <!-- DELIVERY -->

        <div class="delivery">

            <div class="delivery-title">

            </div>


            <label
                class="delivery-option active"
                onclick="setDelivery(this,10)"
            >

                <div class="delivery-left">

                    <input
                        type="radio"
                        name="delivery"
                        checked
                    >

                    <span>
                        📦 Paczkomat
                    </span>

                </div>

                <span class="delivery-price">
                    10,00 zł
                </span>

            </label>


            <label
                class="delivery-option"
                onclick="setDelivery(this,15)"
            >

                <div class="delivery-left">

                    <input
                        type="radio"
                        name="delivery"
                    >

                    <span>
                        🚚 Kurier
                    </span>

                </div>

                <span class="delivery-price">
                    15,00 zł
                </span>

            </label>


            <label
                class="delivery-option"
                onclick="setDelivery(this,0)"
            >

                <div class="delivery-left">

                    <input
                        type="radio"
                        name="delivery"
                    >

                    <span>
                        🏠 Odbiór osobisty
                    </span>

                </div>

                <span class="delivery-price">
                    0,00 zł
                </span>

            </label>

        </div>


        <div class="divider"></div>


        <!-- COUPON -->

        <label class="coupon-label">
            Masz kod rabatowy?
        </label>

            <input
                id="couponInput"
                type="text"
                autocomplete="off"

            </button>

        <div
            class="discount-line"
            id="discountLine"
        >

            </span>

                -0,00 zł
            </span>

        </div>


        <div class="divider"></div>


        <!-- TOTAL -->

        <div class="total">

            <span>
                Razem
            </span>

            <strong id="grandTotal">
                0,00 zł
            </strong>

        </div>


        <button
            class="checkout"
            onclick="goToCheckout()"
        >
            Przejdź do płatności →
        </button>


        <div class="security">
            🔒 Bezpieczne składanie zamówienia
        </div>

    </aside>

</div>

</div>

</main>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =====================================================
   PRINTERLASE3D — CART SYSTEM
===================================================== */

let deliveryPrice = 10;

/*
    Rabat przechowujemy jako procent.
    WIGILIA26 = 15%
*/

let discountPercent = 0;

let activeCoupon = "";


/* =====================================================
   CART
===================================================== */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem("printerlase_cart")
        ) || [];

    }catch{

        return [];

    }

}


function saveCart(cart){

    localStorage.setItem(
        "printerlase_cart",
        JSON.stringify(cart)
    );

}


/* =====================================================
   PRICE
===================================================== */

function price(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".",",") + " zł";

}


/* =====================================================
   SUBTOTAL
===================================================== */

function getSubtotal(){

    const cart = getCart();

    return cart.reduce(
        (sum,item)=>{

            const itemPrice =
                Number(item.price) || 0;

            const quantity =
                Math.max(
                    1,
                    Number(item.quantity) || 1
                );

            return sum + itemPrice * quantity;

        },
        0
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderCart(){

    const cart = getCart();

    const items =
        document.getElementById("cartItems");

    const summary =
        document.getElementById("summary");

    items.innerHTML = "";


    if(cart.length === 0){

        items.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Koszyk jest pusty
                </h2>

                <p>
                    Nie masz jeszcze żadnych produktów.
                    Wskakuj do sklepu i coś wybierz.
                </p>

                <a
                    href="index.html"
                    class="shop-button"
                >
                    ← Wróć do sklepu
                </a>

            </div>

        `;

        summary.style.display = "none";

        updateCartNumber();

        return;

    }


    summary.style.display = "block";


    cart.forEach((item,index)=>{

        const quantity =
            Math.max(
                1,
                Number(item.quantity) || 1
            );

        const itemPrice =
            Number(item.price) || 0;

        const total =
            itemPrice * quantity;


        const element =
            document.createElement("div");

        element.className = "cart-item";

        element.innerHTML = `

            <div class="item-image">
                P3D
            </div>


            <div class="item-info">

                <h3>
                    ${escapeHTML(item.name || "Produkt Printerlase3D")}
                </h3>

                <p>

                    Materiał:
                    ${escapeHTML(item.material || "PLA")}

                    <br>

                    Czas druku:
                    ${escapeHTML(item.printTime || "—")}

                </p>

                <span class="item-color">

                    Kolor:
                    ${escapeHTML(item.color || "Czarny")}

                </span>

            </div>


            <div class="item-controls">

                <div class="quantity">

                    <button
                        onclick="changeItemQuantity(${index},-1)"
                        aria-label="Zmniejsz ilość"
                    >
                        −
                    </button>

                    <span>
                        ${quantity}
                    </span>

                    <button
                        onclick="changeItemQuantity(${index},1)"
                        aria-label="Zwiększ ilość"
                    >
                        +
                    </button>

                </div>


                <div class="item-price">
                    ${price(total)}
                </div>


                <button
                    class="remove"
                    onclick="removeItem(${index})"
                    title="Usuń produkt"
                >
                    🗑
                </button>

            </div>

        `;


        items.appendChild(element);

    });


    updateSummary();

    updateCartNumber();

}


/* =====================================================
   QUANTITY
===================================================== */

function changeItemQuantity(index,amount){

    const cart = getCart();

    if(!cart[index]) return;


    let quantity =
        Number(cart[index].quantity) || 1;

    quantity += amount;


    if(quantity <= 0){

        cart.splice(index,1);

        showToast(
            "Produkt usunięty z koszyka.",
            "success"
        );

    }else{

        cart[index].quantity = quantity;

    }


    saveCart(cart);

    renderCart();

}


/* =====================================================
   REMOVE
===================================================== */

function removeItem(index){

    const cart = getCart();

    if(!cart[index]) return;


    const name =
        cart[index].name || "Produkt";


    cart.splice(index,1);

    saveCart(cart);

    renderCart();


    showToast(
        `${name} usunięty z koszyka.`,
        "success"
    );

}


/* =====================================================
   DELIVERY
===================================================== */

function setDelivery(element,value){

    deliveryPrice = Number(value) || 0;


    document
        .querySelectorAll(".delivery-option")
        .forEach(option=>{

            option.classList.remove("active");

        });


    element.classList.add("active");


    const radio =
        element.querySelector("input");

    if(radio){
        radio.checked = true;
    }


    updateSummary();

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    const subtotal =
        getSubtotal();


    const discount =
        Math.round(
            subtotal *
            (discountPercent / 100) *
            100
        ) / 100;


    const afterDiscount =
        Math.max(
            0,
            subtotal - discount
        );


    const total =
        afterDiscount +
        deliveryPrice;


    document.getElementById(
        "productsTotal"
    ).textContent =
        price(subtotal);


    document.getElementById(
        "deliveryTotal"
    ).textContent =
        price(deliveryPrice);


    document.getElementById(
        "grandTotal"
    ).textContent =
        price(total);


    const discountLine =
        document.getElementById(
            "discountLine"
        );


    const discountAmount =
        document.getElementById(
            "discountAmount"
        );


    if(discountPercent > 0){

        discountLine.classList.add("show");

        discountAmount.textContent =
            "-" + price(discount);

    }else{

        discountLine.classList.remove("show");

    }

}


/* =====================================================
   COUPON
===================================================== */

function applyCoupon(){

    const input =
        document.getElementById(
            "couponInput"
        );


    const code =
        input.value
            .trim()
            .toUpperCase();


    if(!code){

        showToast(
            "Wpisz kod rabatowy.",
            "error"
        );

        return;

    }


    /*
        🎄 WIGILIA26
        -15%
    */

    if(code === "WIGILIA26"){

        discountPercent = 15;

        activeCoupon = code;


        showToast(
            "🎄 WIGILIA26 aktywny! Masz -15% rabatu.",
            "success"
        );


        input.value = code;

        updateSummary();

        return;

    }


    /*
        Stary kod PRINTER10
        zostawiony dla kompatybilności.
    */

    if(code === "PRINTER10"){

        discountPercent = 10;

        activeCoupon = code;


        showToast(
            "Kod PRINTER10 aktywny — 10% rabatu.",
            "success"
        );


        updateSummary();

        return;

    }


    discountPercent = 0;

    activeCoupon = "";


    showToast(
        "❌ Nieprawidłowy kod rabatowy.",
        "error"
    );


    updateSummary();

}


/* =====================================================
   ENTER = APPLY COUPON
===================================================== */

document
    .getElementById("couponInput")
    .addEventListener(
        "keydown",
        event=>{

            if(event.key === "Enter"){

                applyCoupon();

            }

        }
    );


/* =====================================================
   CART NUMBER
===================================================== */

function updateCartNumber(){

    const cart = getCart();


    const count =
        cart.reduce(
            (sum,item)=>{

                return sum +
                    Math.max(
                        1,
                        Number(item.quantity) || 1
                    );

            },
            0
        );


    document.getElementById(
        "cartNumber"
    ).textContent = count;

}


/* =====================================================
   CHECKOUT
===================================================== */

function goToCheckout(){

    const cart = getCart();


    if(cart.length === 0){

        showToast(
            "🛒 Koszyk jest pusty.",
            "error"
        );

        return;

    }


    const subtotal =
        getSubtotal();


    const discount =
        Math.round(
            subtotal *
            (discountPercent / 100) *
            100
        ) / 100;


    const finalTotal =
        Math.max(
            0,
            subtotal - discount
        ) + deliveryPrice;


    /*
        Dane dla checkout.html
    */

    localStorage.setItem(
        "printerlase_discount",
        discount
    );


    localStorage.setItem(
        "printerlase_discount_percent",
        discountPercent
    );


    localStorage.setItem(
        "printerlase_coupon",
        activeCoupon
    );


    localStorage.setItem(
        "printerlase_delivery",
        deliveryPrice
    );


    localStorage.setItem(
        "printerlase_total",
        finalTotal
    );


    window.location.href =
        "checkout.html";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(text,type="success"){

    const toast =
        document.getElementById("toast");


    clearTimeout(toastTimer);


    toast.textContent = text;

    toast.className =
        `toast show ${type}`;


    toastTimer =
        setTimeout(()=>{

            toast.classList.remove("show");

        },3000);

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   START
===================================================== */

renderCart();

</script>
