```html
<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Printerlase3D — Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(
            circle at 20% 0%,
            #004d6e,
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 0%,
            #32105b,
            transparent 30%
        ),
        #020611;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login {
    width: 100%;
    max-width: 390px;
    padding: 32px;
    border: 1px solid #1b3c55;
    border-radius: 24px;
    background: #061020ee;
    box-shadow:
        0 30px 100px #0008,
        0 0 70px #00c8ff15;
    animation: appear .5s ease;
}

.logo {
    font-size: 31px;
    font-weight: 1000;
}

.logo span {
    color: #00c8ff;
}

.subtitle {
    margin-top: 7px;
    margin-bottom: 25px;
    color: #71859a;
    font-size: 12px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #8396aa;
    font-size: 10px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #203c55;
    border-radius: 11px;
    outline: none;
    color: white;
    background: #030914;
}

input:focus,
select:focus {
    border-color: #00c8ff;
}

.group {
    margin-bottom: 15px;
}

.loginButton {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    color: #001018;
    background: #00c8ff;
    font-weight: 1000;
}

.error {
    min-height: 20px;
    margin-top: 12px;
    color: #ff6679;
    text-align: center;
    font-size: 11px;
}

/* APP */

#app {
    display: none;
}

#app.active {
    display: block;
}

header {
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid #19344a;
    background: #020611ee;
    backdrop-filter: blur(20px);
}

.headerInner {
    max-width: 1400px;
    margin: auto;
    padding: 15px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.brand {
    font-size: 20px;
    font-weight: 1000;
}

.brand span {
    color: #00c8ff;
}

.actions {
    display: flex;
    gap: 8px;
}

.btn {
    padding: 10px 13px;
    border: 1px solid #25465f;
    border-radius: 9px;
    color: white;
    background: #071222;
    font-size: 10px;
    font-weight: bold;
}

.btn:hover {
    border-color: #00c8ff;
}

.logout {
    color: #ff7180;
}

/* CONTENT */

.container {
    max-width: 1400px;
    margin: auto;
    padding: 30px 22px 70px;
}

h1 {
    margin: 0;
    font-size: 34px;
}

.description {
    margin-top: 7px;
    color: #71859a;
    font-size: 12px;
}

/* STATS */

.stats {
    margin-top: 25px;
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 12px;
}

.stat {
    padding: 20px;
    border: 1px solid #19354b;
    border-radius: 17px;
    background: #061020dd;
}

.statTitle {
    color: #71859a;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
}

.statValue {
    margin-top: 8px;
    font-size: 28px;
    font-weight: 1000;
}

.blue {
    color: #00c8ff;
}

.green {
    color: #45e49d;
}

.purple {
    color: #bf8cff;
}

.orange {
    color: #ffbd5d;
}

/* SECTION */

.section {
    margin-top: 22px;
    overflow: hidden;
    border: 1px solid #19354b;
    border-radius: 18px;
    background: #061020dd;
}

.sectionHeader {
    padding: 17px 19px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #173047;
}

.sectionTitle {
    font-size: 17px;
    font-weight: 1000;
}

.count {
    padding: 5px 10px;
    border-radius: 99px;
    color: #001018;
    background: #00c8ff;
    font-size: 9px;
    font-weight: 1000;
}

/* ORDERS */

.order {
    padding: 18px;
    border-bottom: 1px solid #142d40;
    animation: appear .35s ease;
}

.order:hover {
    background: #081525;
}

.orderTop {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.id {
    color: #00c8ff;
    font-size: 11px;
    font-weight: 1000;
}

.date {
    margin-top: 4px;
    color: #65788c;
    font-size: 9px;
}

.customer {
    margin-top: 14px;
    font-size: 14px;
    font-weight: bold;
}

.contact {
    margin-top: 5px;
    color: #8092a4;
    font-size: 10px;
    line-height: 1.7;
}

.items {
    margin-top: 13px;
    display: grid;
    gap: 6px;
}

.item {
    padding: 9px 11px;
    border: 1px solid #173249;
    border-radius: 9px;
    color: #9eafbf;
    background: #030914;
    font-size: 10px;
}

.bottom {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.price {
    font-size: 23px;
    font-weight: 1000;
}

.meta {
    margin-top: 4px;
    color: #71859a;
    font-size: 9px;
}

.statusArea {
    display: flex;
    gap: 7px;
    align-items: center;
}

.status {
    padding: 7px 9px;
    border: 1px solid #24445c;
    border-radius: 8px;
    font-size: 9px;
    font-weight: bold;
}

.statusSelect {
    width: auto;
    padding: 8px;
    font-size: 9px;
}

.delete {
    padding: 8px 10px;
    border: 1px solid #5a2530;
    border-radius: 8px;
    color: #ff7585;
    background: #230b10;
    font-size: 9px;
    font-weight: bold;
}

/* MODELS */

.models {
    padding: 15px;
    display: grid;
    grid-template-columns:
        repeat(2, 1fr);
    gap: 12px;
}

.model {
    padding: 16px;
    border: 1px solid #19364e;
    border-radius: 15px;
    background: #040b16;
    animation: appear .35s ease;
}

.modelName {
    font-weight: 1000;
}

.modelId {
    margin-top: 4px;
    color: #00c8ff;
    font-size: 9px;
}

.modelInfo {
    margin-top: 14px;
    display: grid;
    gap: 7px;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: #71859a;
    font-size: 10px;
}

.row strong {
    color: white;
    text-align: right;
}

.modelDescription {
    margin-top: 13px;
    padding: 10px;
    border-radius: 9px;
    color: #9badbd;
    background: #08111e;
    font-size: 10px;
    line-height: 1.5;
}

.modelActions {
    margin-top: 14px;
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.empty {
    padding: 45px 20px;
    color: #617489;
    text-align: center;
    font-size: 12px;
}

.emptyIcon {
    margin-bottom: 10px;
    font-size: 30px;
}

/* TOAST */

#toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 999;
    padding: 13px 16px;
    border: 1px solid #254963;
    border-radius: 11px;
    opacity: 0;
    transform: translateY(20px);
    background: #071424;
    transition: .25s;
    pointer-events: none;
    font-size: 11px;
    font-weight: bold;
}

#toast.show {
    opacity: 1;
    transform: translateY(0);
}

@keyframes appear {
    from {
        opacity: 0;
        transform:
            translateY(15px)
            scale(.98);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

@media (max-width: 900px) {
    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .models {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    .headerInner {
        flex-direction: column;
        align-items: flex-start;
    }

    .actions {
        width: 100%;
    }

    .actions .btn {
        flex: 1;
    }

    .container {
        padding:
            22px 12px 50px;
    }

    .stats {
        gap: 8px;
    }

    .stat {
        padding: 14px;
    }

    .statValue {
        font-size: 21px;
    }

    .orderTop {
        flex-direction: column;
    }
}

</style>

</head>

<body>

<div id="loginScreen">

    <div class="login">

        <div class="logo">
            Printerlase<span>3D</span>
        </div>

        <div class="subtitle">
            Panel administratora sklepu
        </div>

        <div class="group">

            <label>LOGIN</label>

            <input
                id="login"
                type="text"
                placeholder="admin"
            >

        </div>

        <div class="group">

            <label>HASŁO</label>

            <input
                id="password"
                type="password"
                placeholder="Hasło"
            >

        </div>

        <button
            class="loginButton"
            onclick="login()"
        >
            ZALOGUJ
        </button>

        <div
            id="loginError"
            class="error"
        ></div>

    </div>

</div>

<div id="app">

<header>

    <div class="headerInner">

        <div class="brand">
            Printerlase<span>3D</span>
            — ADMIN
        </div>

        <div class="actions">

            <button
                class="btn"
                onclick="loadData()"
            >
                ↻ ODŚWIEŻ
            </button>

            <button
                class="btn logout"
                onclick="logout()"
            >
                WYLOGUJ
            </button>

        </div>

    </div>

</header>

<main class="container">

    <h1>
        Panel administratora
    </h1>

    <div class="description">
        Zamówienia, własne modele 3D,
        statusy i przychody.
    </div>

    <div class="stats">

        <div class="stat">
            <div class="statTitle">
                Zamówienia
            </div>

            <div
                id="ordersStat"
                class="statValue blue"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="statTitle">
                Modele 3D
            </div>

            <div
                id="modelsStat"
                class="statValue purple"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="statTitle">
                Przychód
            </div>

            <div
                id="revenueStat"
                class="statValue green"
            >
                0,00 zł
            </div>
        </div>

        <div class="stat">
            <div class="statTitle">
                Nowe
            </div>

            <div
                id="newStat"
                class="statValue orange"
            >
                0
            </div>
        </div>

    </div>

    <section class="section">

        <div class="sectionHeader">

            <div class="sectionTitle">
                🛒 Zamówienia
            </div>

            <div
                id="ordersCount"
                class="count"
            >
                0
            </div>

        </div>

        <div id="orders"></div>

    </section>

    <section class="section">

        <div class="sectionHeader">

            <div class="sectionTitle">
                🧩 Własne modele 3D
            </div>

            <div
                id="modelsCount"
                class="count"
            >
                0
            </div>

        </div>

        <div
            id="models"
            class="models"
        ></div>

    </section>

</main>

</div>

<div id="toast"></div>

<script>

let token =
    localStorage.getItem(
        "printerlase_token"
    );

function login() {

    const login =
        document.getElementById(
            "login"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    fetch(
        "/api/admin/login",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                login: login,
                password: password
            })
        }
    )
    .then(function (response) {
        return response.json()
            .then(function (data) {
                return {
                    ok: response.ok,
                    data: data
                };
            });
    })
    .then(function (result) {

        if (!result.ok) {
            throw new Error(
                result.data.error ||
                "Błąd logowania."
            );
        }

        token =
            result.data.token;

        localStorage.setItem(
            "printerlase_token",
            token
        );

        showPanel();
    })
    .catch(function (error) {

        document.getElementById(
            "loginError"
        ).textContent =
            error.message;
    });
}

document.getElementById(
    "password"
).addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {
            login();
        }
    }
);

function showPanel() {

    document.getElementById(
        "loginScreen"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).classList.add("active");

    loadData();
}

function api(url, options) {

    options =
        options || {};

    options.headers =
        options.headers || {};

    options.headers.Authorization =
        "Bearer " + token;

    return fetch(
        url,
        options
    )
    .then(function (response) {

        if (
            response.status === 401
        ) {

            logout();

            throw new Error(
                "Sesja wygasła."
            );
        }

        return response.json()
            .then(function (data) {

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        "Błąd API."
                    );
                }

                return data;
            });
    });
}

function loadData() {

    if (!token) {
        return;
    }

    api("/api/admin/data")
        .then(function (data) {

            renderStats(data);
            renderOrders(
                data.orders || []
            );
            renderModels(
                data.customOrders || []
            );

        })
        .catch(function (error) {

            toast(
                error.message
            );
        });
}

function renderStats(data) {

    const orders =
        data.orders || [];

    const models =
        data.customOrders || [];

    let revenue = 0;
    let newOrders = 0;

    orders.forEach(
        function (order) {

            revenue += Number(
                order.total || 0
            );

            if (
                order.status === "NEW"
            ) {
                newOrders++;
            }
        }
    );

    document.getElementById(
        "ordersStat"
    ).textContent =
        orders.length;

    document.getElementById(
        "modelsStat"
    ).textContent =
        models.length;

    document.getElementById(
        "revenueStat"
    ).textContent =
        money(revenue);

    document.getElementById(
        "newStat"
    ).textContent =
        newOrders;
}

function renderOrders(orders) {

    document.getElementById(
        "ordersCount"
    ).textContent =
        orders.length;

    const box =
        document.getElementById(
            "orders"
        );

    if (!orders.length) {

        box.innerHTML =
            '<div class="empty">' +
            '<div class="emptyIcon">🛒</div>' +
            'Brak zamówień.' +
            '</div>';

        return;
    }

    box.innerHTML =
        orders.map(
            orderHTML
        ).join("");
}

function orderHTML(order) {

    let itemsHTML = "";

    if (
        Array.isArray(
            order.items
        ) &&
        order.items.length
    ) {

        itemsHTML =
            order.items.map(
                function (item) {

                    return (
                        '<div class="item">' +
                        '<strong>' +
                        escapeHTML(
                            item.name
                        ) +
                        '</strong> × ' +
                        Number(
                            item.quantity ||
                            1
                        ) +
                        ' — ' +
                        money(
                            item.total ||
                            0
                        ) +
                        '</div>'
                    );
                }
            ).join("");

    } else {

        itemsHTML =
            '<div class="item">' +
            'Brak produktów' +
            '</div>';
    }

    return (
        '<article class="order">' +

        '<div class="orderTop">' +

        '<div>' +

        '<div class="id">' +
        escapeHTML(order.id) +
        '</div>' +

        '<div class="date">' +
        formatDate(
            order.createdAt
        ) +
        '</div>' +

        '</div>' +

        '<div class="statusArea">' +

        '<select class="statusSelect" ' +
        'onchange="changeOrderStatus(\'' +
        escapeJS(order.id) +
        '\', this.value)">' +

        statusOptions(
            order.status
        ) +

        '</select>' +

        '</div>' +

        '</div>' +

        '<div class="customer">' +
        '👤 ' +
        escapeHTML(
            order.name ||
            "Brak danych"
        ) +
        '</div>' +

        '<div class="contact">' +
        '📧 ' +
        escapeHTML(
            order.email || "-"
        ) +
        '<br>' +
        '📞 ' +
        escapeHTML(
            order.phone || "-"
        ) +
        '<br>' +
        '📍 ' +
        escapeHTML(
            order.address || "-"
        ) +
        '</div>' +

        '<div class="items">' +
        itemsHTML +
        '</div>' +

        '<div class="bottom">' +

        '<div>' +

        '<div class="price">' +
        money(order.total) +
        '</div>' +

        '<div class="meta">' +
        (
            order.discount
                ? "Rabat: -" +
                  money(
                      order.discount
                  )
                : "Bez rabatu"
        ) +
        ' · ' +
        escapeHTML(
            order.delivery ||
            "Dostawa"
        ) +
        '</div>' +

        '</div>' +

        '<button class="delete" ' +
        'onclick="deleteOrder(\'' +
        escapeJS(order.id) +
        '\')">' +
        '🗑 Usuń' +
        '</button>' +

        '</div>' +

        '</article>'
    );
}

function renderModels(models) {

    document.getElementById(
        "modelsCount"
    ).textContent =
        models.length;

    const box =
        document.getElementById(
            "models"
        );

    if (!models.length) {

        box.innerHTML =
            '<div class="empty">' +
            '<div class="emptyIcon">🧩</div>' +
            'Brak własnych modeli 3D.' +
            '</div>';

        return;
    }

    box.innerHTML =
        models.map(
            modelHTML
        ).join("");
}

function modelHTML(model) {

    let fileButton = "";

    if (model.fileUrl) {

        fileButton =
            '<button class="btn" ' +
            'onclick="window.open(\'' +
            escapeJS(
                model.fileUrl
            ) +
            '\', \'_blank\')">' +
            '👁 Otwórz plik' +
            '</button>';
    }

    return (
        '<article class="model">' +

        '<div class="modelName">' +
        '🧩 ' +
        escapeHTML(
            model.fileName ||
            "Własny model 3D"
        ) +
        '</div>' +

        '<div class="modelId">' +
        escapeHTML(
            model.id
        ) +
        '</div>' +

        '<div class="modelInfo">' +

        row(
            "Klient",
            model.name
        ) +

        row(
            "E-mail",
            model.email
        ) +

        row(
            "Telefon",
            model.phone
        ) +

        row(
            "Materiał",
            model.material
        ) +

        row(
            "Kolor",
            model.color
        ) +

        row(
            "Ilość",
            model.quantity
        ) +

        row(
            "Wymiary",
            model.dimensions
        ) +

        row(
            "Cena",
            money(
                model.estimatedPrice
            )
        ) +

        '</div>' +

        (
            model.description
                ? '<div class="modelDescription">' +
                  escapeHTML(
                      model.description
                  ) +
                  '</div>'
                : ""
        ) +

        '<div class="modelActions">' +

        '<select class="statusSelect" ' +
        'onchange="changeModelStatus(\'' +
        escapeJS(model.id) +
        '\', this.value)">' +

        statusOptions(
            model.status
        ) +

        '</select>' +

        fileButton +

        '<button class="delete" ' +
        'onclick="deleteModel(\'' +
        escapeJS(model.id) +
        '\')">' +
        '🗑 Usuń' +
        '</button>' +

        '</div>' +

        '</article>'
    );
}

function row(label, value) {

    return (
        '<div class="row">' +
        '<span>' +
        escapeHTML(label) +
        '</span>' +
        '<strong>' +
        escapeHTML(
            value === undefined ||
            value === null ||
            value === ""
                ? "-"
                : value
        ) +
        '</strong>' +
        '</div>'
    );
}

function statusOptions(current) {

    const options = [
        ["NEW", "NOWE"],
        ["IN_PROGRESS", "W REALIZACJI"],
        ["READY", "GOTOWE"],
        ["COMPLETED", "ZAKOŃCZONE"],
        ["CANCELLED", "ANULOWANE"]
    ];

    return options.map(
        function (option) {

            return (
                '<option value="' +
                option[0] +
                '"' +
                (
                    option[0] === current
                        ? " selected"
                        : ""
                ) +
                '>' +
                option[1] +
                '</option>'
            );
        }
    ).join("");
}

function changeOrderStatus(
    id,
    status
) {

    api(
        "/api/admin/orders/" +
        encodeURIComponent(id) +
        "/status",
        {
            method: "PATCH",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                status: status
            })
        }
    )
    .then(function () {

        toast(
            "Status zamówienia zmieniony."
        );

        loadData();
    })
    .catch(function (error) {

        toast(
            error.message
        );
    });
}

function changeModelStatus(

function money(value) {

    return Number(
        value || 0
    ).toLocaleString(
        "pl-PL",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    ) + " zł";
}

function formatDate(value) {

    if (!value) {
        return "-";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "-";
    }

    return date.toLocaleString(
        "pl-PL"
    );
}

function escapeHTML(value) {

    return String(
        value === undefined ||
        value === null
            ? ""
            : value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

function escapeJS(value) {

    return String(
        value === undefined ||
        value === null
            ? ""
            : value
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );
}

let toastTimeout;

function toast(message) {

    const box =
        document.getElementById(
            "toast"
        );

    box.textContent =
        message;

    box.classList.add(
        "show"
    );

    clearTimeout(
        toastTimeout
    );

    toastTimeout =
        setTimeout(
            function () {
                box.classList.remove(
                    "show"
                );
            },
            2500
        );
}
