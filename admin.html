```html
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printerlase3D — Panel Admina</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 10% 0%,#003d5c 0,transparent 30%),
        radial-gradient(circle at 100% 0%,#371052 0,transparent 28%),
        #020611;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* ==============================
   LOGIN
============================== */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:390px;
    padding:32px;
    border:1px solid #1d3d56;
    border-radius:22px;
    background:#061020e8;
    box-shadow:
        0 30px 100px #0008,
        0 0 60px #00c8ff0d;
    backdrop-filter:blur(20px);
    animation:show .5s ease;
}

.logo{
    margin-bottom:8px;
    font-size:30px;
    font-weight:1000;
}

.logo span{
    color:#00c8ff;
}

.loginSubtitle{
    margin-bottom:25px;
    color:#71859a;
    font-size:12px;
}

.inputGroup{
    margin-bottom:15px;
}

.inputGroup label{
    display:block;
    margin-bottom:7px;
    color:#91a3b7;
    font-size:11px;
    font-weight:800;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #203c55;
    border-radius:11px;
    outline:none;
    color:#fff;
    background:#030a15;
    padding:13px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#00c8ff;
    box-shadow:0 0 20px #00c8ff12;
}

.loginButton{
    width:100%;
    margin-top:8px;
    padding:14px;
    border:0;
    border-radius:11px;
    color:#001018;
    background:#00c8ff;
    font-weight:1000;
}

.loginButton:hover{
    box-shadow:0 10px 35px #00c8ff25;
    transform:translateY(-2px);
}

.loginError{
    min-height:18px;
    margin-top:12px;
    color:#ff6577;
    font-size:11px;
    text-align:center;
}


/* ==============================
   APP
============================== */

#adminApp{
    display:none;
    min-height:100vh;
}

#adminApp.active{
    display:block;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid #18334a;
    background:#020611dd;
    backdrop-filter:blur(20px);
}

.topbarInner{
    max-width:1400px;
    margin:auto;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    font-size:20px;
    font-weight:1000;
}

.brand span{
    color:#00c8ff;
}

.topActions{
    display:flex;
    gap:8px;
}

.topButton{
    padding:10px 13px;
    border:1px solid #24445d;
    border-radius:9px;
    color:#fff;
    background:#071222;
    font-size:11px;
    font-weight:900;
}

.topButton:hover{
    border-color:#00c8ff;
}

.logout{
    color:#ff7d8b;
}


/* ==============================
   CONTENT
============================== */

.container{
    max-width:1400px;
    margin:auto;
    padding:30px 22px 70px;
}

.pageTitle{
    margin-bottom:6px;
    font-size:34px;
    font-weight:1000;
}

.pageDescription{
    margin-bottom:25px;
    color:#72859a;
    font-size:12px;
}


/* ==============================
   STATS
============================== */

.stats{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:12px;
    margin-bottom:25px;
}

.stat{
    padding:20px;
    border:1px solid #18344b;
    border-radius:17px;
    background:#061020d9;
    transition:.2s;
}

.stat:hover{
    transform:translateY(-3px);
    border-color:#00c8ff55;
}

.statTitle{
    margin-bottom:9px;
    color:#71859a;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
}

.statValue{
    font-size:29px;
    font-weight:1000;
}

.blue{
    color:#00c8ff;
}

.green{
    color:#43e49b;
}

.purple{
    color:#bd8cff;
}

.orange{
    color:#ffb85c;
}


/* ==============================
   SECTIONS
============================== */

.section{
    margin-top:22px;
    overflow:hidden;
    border:1px solid #18344b;
    border-radius:18px;
    background:#061020d9;
}

.sectionHeader{
    padding:17px 19px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid #173047;
}

.sectionTitle{
    font-size:17px;
    font-weight:1000;
}

.sectionCount{
    padding:5px 9px;
    border-radius:999px;
    color:#001018;
    background:#00c8ff;
    font-size:9px;
    font-weight:1000;
}


/* ==============================
   ORDERS
============================== */

.orders{
    display:flex;
    flex-direction:column;
}

.order{
    padding:18px;
    border-bottom:1px solid #132a3c;
    transition:.2s;
}

.order:last-child{
    border-bottom:0;
}

.order:hover{
    background:#081525;
}

.orderTop{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:15px;
}

.orderId{
    margin-bottom:5px;
    color:#00c8ff;
    font-size:12px;
    font-weight:1000;
}

.orderDate{
    color:#627589;
    font-size:9px;
}

.orderCustomer{
    margin-top:14px;
    font-size:14px;
    font-weight:900;
}

.orderContact{
    margin-top:5px;
    color:#7e91a5;
    font-size:10px;
    line-height:1.6;
}

.orderItems{
    margin-top:14px;
    display:grid;
    gap:6px;
}

.item{
    padding:9px 11px;
    border:1px solid #173149;
    border-radius:9px;
    color:#a9b8c7;
    background:#030914;
    font-size:10px;
}

.item strong{
    color:#fff;
}

.orderBottom{
    margin-top:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
}

.orderPrice{
    font-size:23px;
    font-weight:1000;
}

.orderMeta{
    color:#73869a;
    font-size:9px;
}

.statusArea{
    display:flex;
    align-items:center;
    gap:7px;
}

.status{
    padding:7px 9px;
    border-radius:8px;
    border:1px solid #24445c;
    font-size:9px;
    font-weight:1000;
}

.status.NEW{
    color:#00c8ff;
}

.status.IN_PROGRESS{
    color:#ffbd5c;
}

.status.READY{
    color:#bd8cff;
}

.status.COMPLETED{
    color:#43e49b;
}

.status.CANCELLED{
    color:#ff6679;
}

.statusSelect{
    width:auto;
    padding:8px;
    font-size:9px;
}

.deleteButton{
    padding:8px 10px;
    border:1px solid #5b2530;
    border-radius:8px;
    color:#ff7585;
    background:#230b10;
    font-size:9px;
    font-weight:900;
}

.deleteButton:hover{
    background:#3a0d15;
}


/* ==============================
   CUSTOM MODELS
============================== */

.customGrid{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);
    gap:12px;
    padding:15px;
}

.customCard{
    padding:16px;
    border:1px solid #19364e;
    border-radius:15px;
    background:#040b16;
    transition:.25s;
}

.customCard:hover{
    transform:translateY(-3px);
    border-color:#00c8ff55;
}

.modelName{
    font-size:15px;
    font-weight:1000;
}

.modelId{
    margin-top:4px;
    color:#00c8ff;
    font-size:9px;
    font-weight:900;
}

.modelInfo{
    margin-top:14px;
    display:grid;
    gap:7px;
}

.infoRow{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:#71859a;
    font-size:10px;
}

.infoRow strong{
    color:#d7e1ea;
    text-align:right;
}

.description{
    margin-top:13px;
    padding:10px;
    border-radius:9px;
    color:#9cadbd;
    background:#08111e;
    font-size:10px;
    line-height:1.5;
}

.modelActions{
    margin-top:14px;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}


/* ==============================
   EMPTY
============================== */

.empty{
    padding:45px 20px;
    color:#617489;
    text-align:center;
    font-size:12px;
}

.emptyIcon{
    margin-bottom:10px;
    font-size:30px;
}


/* ==============================
   TOAST
============================== */

#toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:9999;
    max-width:320px;
    padding:13px 16px;
    border:1px solid #254963;
    border-radius:11px;
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    background:#071424;
    box-shadow:0 15px 50px #0007;
    transition:.25s;
    font-size:11px;
    font-weight:800;
}

#toast.show{
    opacity:1;
    transform:none;
}


/* ==============================
   ANIMATION
============================== */

@keyframes show{
    from{
        opacity:0;
        transform:translateY(20px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.fade{
    animation:show .4s ease;
}


/* ==============================
   RESPONSIVE
============================== */

@media(max-width:900px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .customGrid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .topbarInner{
        align-items:flex-start;
        flex-direction:column;
    }

    .topActions{
        width:100%;
    }

    .topButton{
        flex:1;
    }

    .container{
        padding:
            22px 12px 50px;
    }

    .pageTitle{
        font-size:27px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .stat{
        padding:14px;
    }

    .statValue{
        font-size:21px;
    }

    .orderTop{
        flex-direction:column;
    }

    .orderBottom{
        align-items:flex-start;
        flex-direction:column;
    }

}
</style>
</head>

<body>


<!-- ==================================================
     LOGIN
================================================== -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            Printerlase<span>3D</span>
        </div>

        <div class="loginSubtitle">
            Panel administratora sklepu
        </div>


        <div class="inputGroup">

            <label>
                LOGIN
            </label>

            <input
                id="login"
                type="text"
                autocomplete="username"
                placeholder="admin"
            >

        </div>


        <div class="inputGroup">

            <label>
                HASŁO
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Hasło administratora"
            >

        </div>


        <button
            class="loginButton"
            onclick="login()"
        >
            ZALOGUJ DO PANELU
        </button>


        <div
            id="loginError"
            class="loginError"
        ></div>

    </div>

</div>


<!-- ==================================================
     PANEL
================================================== -->

<div id="adminApp">

    <header class="topbar">

        <div class="topbarInner">

            <div class="brand">
                Printerlase<span>3D</span>
                <small>ADMIN PANEL</small>
            </div>


            <div class="topActions">

                <button
                    class="topButton"
                    onclick="loadData()"
                >
                    ↻ ODŚWIEŻ
                </button>

                <button
                    class="topButton logout"
                    onclick="logout()"
                >
                    WYLOGUJ
                </button>

            </div>

        </div>

    </header>


    <main class="container">

        <h1 class="pageTitle">
            Panel administratora
        </h1>

        <p class="pageDescription">
            Zarządzaj zamówieniami i własnymi modelami 3D.
        </p>


        <!-- =========================
             STATS
        ========================== -->

        <div class="stats">

            <div class="stat">

                <div class="statTitle">
                    Zamówienia
                </div>

                <div
                    id="statOrders"
                    class="statValue blue"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="statTitle">
                    Własne modele
                </div>

                <div
                    id="statModels"
                    class="statValue purple"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="statTitle">
                    Przychód
                </div>

                <div
                    id="statRevenue"
                    class="statValue green"
                >
                    0,00 zł
                </div>

            </div>


            <div class="stat">

                <div class="statTitle">
                    Nowe
                </div>

                <div
                    id="statNew"
                    class="statValue orange"
                >
                    0
                </div>

            </div>

        </div>


        <!-- =========================
             ORDERS
        ========================== -->

        <section class="section">

            <div class="sectionHeader">

                <div class="sectionTitle">
                    🛒 Zamówienia
                </div>

                <div
                    id="ordersCount"
                    class="sectionCount"
                >
                    0
                </div>

            </div>


            <div
                id="orders"
                class="orders"
            ></div>

        </section>


        <!-- =========================
             CUSTOM MODELS
        ========================== -->

        <section class="section">

            <div class="sectionHeader">

                <div class="sectionTitle">
                    🧩 Własne modele 3D
                </div>

                <div
                    id="modelsCount"
                    class="sectionCount"
                >
                    0
                </div>

            </div>


            <div
                id="customModels"
                class="customGrid"
            ></div>

        </section>

    </main>

</div>


<div id="toast"></div>


<script>

let token =
    localStorage.getItem(
        "printerlase_admin_token"
    );


/* ==================================================
   LOGIN
================================================== */

async function login(){

    const loginValue =
        document
            .getElementById("login")
            .value
            .trim();

    const passwordValue =
        document
            .getElementById("password")
            .value;


    const error =
        document.getElementById(
            "loginError"
        );


    error.textContent =
        "Logowanie...";


    try{

        const response =
            await fetch(
                "/api/admin/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        login:
                            loginValue,

                        password:
                            passwordValue

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd logowania."
            );

        }


        token =
            data.token;


        localStorage.setItem(
            "printerlase_admin_token",
            token
        );


        showAdmin();

    }
    catch(error){

        errorElement(
            error.message
        );

    }

}


function errorElement(
    message
){

    document
        .getElementById(
            "loginError"
        )
        .textContent =
        message;

}


/* Enter = login */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){

                login();

            }

        }
    );


/* ==================================================
   SHOW ADMIN
================================================== */

async function showAdmin(){

    document
        .getElementById(
            "loginScreen"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "adminApp"
        )
        .classList.add(
            "active"
        );


    await loadData();

}


/* ==================================================
   API
================================================== */

async function api(
    url,
    options={}
){

    options.headers =
        options.headers || {};


    options.headers.Authorization =
        "Bearer " +
        token;


    if(
        options.body &&
        typeof options.body !==
        "string"
    ){

        options.headers[
            "Content-Type"
        ] =
            "application/json";


        options.body =
            JSON.stringify(
                options.body
            );

    }


    const response =
        await fetch(
            url,
            options
        );


    if(
        response.status === 401
    ){

        logout();

        throw new Error(
            "Sesja wygasła."
        );

    }


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data.error ||
            "Błąd serwera."
        );

    }


    return data;

}


/* ==================================================
   LOAD
================================================== */

async function loadData(){

    if(!token){

        return;

    }


    try{

        const data =
            await api(
                "/api/admin/data"
            );


        renderStats(
            data
        );

        renderOrders(
            data.orders || []
        );

        renderCustomModels(
            data.customOrders || []
        );

    }
    catch(error){

        toast(
            error.message
        );

    }

}


/* ==================================================
   STATS
================================================== */

function renderStats(
    data
){

    const orders =
        data.orders || [];

    const models =
        data.customOrders || [];


    const newOrders =
        orders.filter(
            order =>
                order.status ===
                "NEW"
        ).length;


    const revenue =
        orders.reduce(
            (
                sum,
                order
            ) =>
                sum +
                Number(
                    order.total || 0
                ),
            0
        );


    document
        .getElementById(
            "statOrders"
        )
        .textContent =
        orders.length;


    document
        .getElementById(
            "statModels"
        )
        .textContent =
        models.length;


    document
        .getElementById(
            "statRevenue"
        )
        .textContent =
        money(
            revenue
        );


    document
        .getElementById(
            "statNew"
        )
        .textContent =
        newOrders;

}


/* ==================================================
   ORDERS
================================================== */

function renderOrders(
    orders
){

    const container =
        document.getElementById(
            "orders"
        );


    document
        .getElementById(
            "ordersCount"
        )
        .textContent =
        orders.length;


    if(!orders.length){

        container.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    🛒
                </div>

                Brak zamówień.

            </div>

        `;

        return;

    }


    container.innerHTML =
        orders
            .map(
                order =>
                    orderHTML(
                        order
                    )
            )
            .join("");

}


function orderHTML(
    order
){

    const items =
        Array.isArray(
            order.items
        )
            ? order.items
            : [];


    const itemsHTML =
        items.length
            ? items
                .map(
                    item => `

                        <div class="item">

                            <strong>
                                ${escapeHTML(
                                    item.name
                                )}
                            </strong>

                            ×
                            ${Number(
                                item.quantity ||
                                item.qty ||
                                1
                            )}

                            —
                            ${money(
                                item.total ||
                                (
                                    Number(
                                        item.price ||
                                        0
                                    ) *
                                    Number(
                                        item.quantity ||
                                        item.qty ||
                                        1
                                    )
                                )
                            )}

                        </div>

                    `
                )
                .join("")
            : `
                <div class="item">
                    Brak produktów
                </div>
            `;


    return `

        <article class="order fade">

            <div class="orderTop">

                <div>

                    <div class="orderId">
                        ${escapeHTML(
                            order.id
                        )}
                    </div>

                    <div class="orderDate">
                        ${formatDate(
                            order.createdAt
                        )}
                    </div>

                </div>


                <div class="statusArea">

                    <span
                        class="status ${escapeHTML(
                            order.status ||
                            "NEW"
                        )}"
                    >
                        ${statusName(
                            order.status
                        )}
                    </span>


                    <select
                        class="statusSelect"
                        onchange="changeOrderStatus(
                            '${escapeJS(order.id)}',
                            this.value
                        )"
                    >

                        ${statusOptions(
                            order.status
                        )}

                    </select>

                </div>

            </div>


            <div class="orderCustomer">

                👤
                ${escapeHTML(
                    order.name ||
                    "Brak nazwy"
                )}

            </div>


            <div class="orderContact">

                📧
                ${escapeHTML(
                    order.email ||
                    "-"
                )}

                <br>

                📞
                ${escapeHTML(
                    order.phone ||
                    "-"
                )}

                <br>

                📍
                ${escapeHTML(
                    order.address ||
                    "-"
                )}

            </div>


            <div class="orderItems">

                ${itemsHTML}

            </div>


            <div class="orderBottom">

                <div>

                    <div class="orderPrice">

                        ${money(
                            order.total
                        )}

                    </div>

                    <div class="orderMeta">

                        ${order.discount
                            ? `Rabat: -${money(
                                order.discount
                            )}`
                            : "Bez rabatu"
                        }

                        ·

                        ${escapeHTML(
                            order.delivery ||
                            "Dostawa"
                        )}

                    </div>

                </div>


                <button
                    class="deleteButton"
                    onclick="deleteOrder(
                        '${escapeJS(order.id)}'
                    )"
                >
                    🗑 Usuń
                </button>

            </div>

        </article>

    `;

}


/* ==================================================
   CUSTOM MODELS
================================================== */

function renderCustomModels(
    models
){

    const container =
        document.getElementById(
            "customModels"
        );


    document
        .getElementById(
            "modelsCount"
        )
        .textContent =
        models.length;


    if(!models.length){

        container.innerHTML = `

            <div
                class="empty"
                style="grid-column:1/-1"
            >

                <div class="emptyIcon">
                    🧩
                </div>

                Nikt jeszcze nie wysłał
                własnego modelu 3D.

            </div>

        `;

        return;

    }


    container.innerHTML =
        models
            .map(
                model =>
                    customModelHTML(
                        model
                    )
            )
            .join("");

}

/* ==================================================

function statusOptions(
    current
){

    const options = [

        ["NEW","NOWE"],

        ["IN_PROGRESS","W REALIZACJI"],

        ["READY","GOTOWE"],

        ["COMPLETED","ZAKOŃCZONE"],

        ["CANCELLED","ANULOWANE"]

    ];


    return options
        .map(
            option => `

                <option
                    value="${option[0]}"
                    ${
                        option[0] ===
                        current
                            ? "selected"
                            : ""
                    }
                >
                    ${option[1]}
                </option>

            `
        )
        .join("");

}


function statusName(
    status
){

    const names = {

        NEW:
            "NOWE",

        IN_PROGRESS:
            "W REALIZACJI",

        READY:
            "GOTOWE",

        COMPLETED:
            "ZAKOŃCZONE",

        CANCELLED:
            "ANULOWANE"

    };


    return (
        names[status] ||
        "NOWE"
    );

}

/* ==================================================

let toastTimer;


function toast(
    message
){

    const element =
        document.getElementById(
            "toast"
        );


    element.textContent =
        message;


    element.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* ==================================================
   HELPERS
================================================== */

function money(
    value
){

    return Number(
        value || 0
    )
    .toLocaleString(
        "pl-PL",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " zł";

}


function formatDate(
    value
){

    if(!value){
        return "-";
    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "-";

    }


    return date.toLocaleString(
        "pl-PL",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );

}


function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJS(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}
