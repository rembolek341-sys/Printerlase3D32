```html
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printerlase3D — Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#050914;
    color:#fff;
}
button,input,select{font:inherit}
button{cursor:pointer}

header{
    height:70px;
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#080f1d;
    border-bottom:1px solid #17243a;
}
.logo{font-size:22px;font-weight:900}
.logo span{color:#00c8ff}

.container{
    width:min(1250px,94%);
    margin:30px auto;
}

.login{
    width:min(400px,94%);
    margin:100px auto;
    padding:30px;
    background:#091222;
    border:1px solid #17243a;
    border-radius:20px;
}
.login h1{margin-bottom:10px}
input,select{
    width:100%;
    padding:13px;
    margin-top:8px;
    background:#030812;
    color:white;
    border:1px solid #20304a;
    border-radius:10px;
    outline:none;
}
label{
    display:block;
    margin-top:18px;
    font-size:11px;
    font-weight:bold;
    color:#91a1b8;
}
.btn{
    border:0;
    border-radius:10px;
    padding:12px 17px;
    color:white;
    background:linear-gradient(100deg,#008cff,#713cff);
    font-weight:900;
}
.login .btn{
    width:100%;
    margin-top:18px;
}
.error{color:#ff5473;margin-top:12px;font-size:12px}

#dashboard{display:none}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}
.topbar h1{font-size:32px}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}
.card{
    padding:22px;
    background:#091222;
    border:1px solid #17243a;
    border-radius:17px;
}
.card small{
    color:#8291a8;
    font-weight:bold;
    font-size:10px;
}
.card strong{
    display:block;
    margin-top:10px;
    font-size:25px;
}
.green{color:#42e6a4}
.blue{color:#00c8ff}
.red{color:#ff5877}

.panel{
    margin-top:25px;
    background:#091222;
    border:1px solid #17243a;
    border-radius:18px;
    overflow:hidden;
}
.panelHead{
    padding:20px;
    border-bottom:1px solid #17243a;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.orders{padding:0}

.order{
    padding:20px;
    border-bottom:1px solid #17243a;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 2fr;
    gap:15px;
    align-items:center;
}
.order:last-child{border-bottom:0}

.orderId{
    font-weight:900;
    color:#00c8ff;
}
.info{
    color:#8291a8;
    font-size:11px;
    margin-top:5px;
}
.status{
    display:inline-block;
    padding:7px 10px;
    border-radius:8px;
    background:#17243a;
    font-size:10px;
    font-weight:bold;
}
.PAID{
    color:#42e6a4;
    background:#0c2b25;
}
.NEW{
    color:#00c8ff;
    background:#082535;
}
.CANCELLED{
    color:#ff5877;
    background:#30121b;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}
.small{
    padding:8px 10px;
    background:#101d31;
    color:white;
    border:1px solid #20304a;
    border-radius:8px;
    font-size:10px;
    font-weight:bold;
}
.small:hover{background:#182a43}

.empty{
    padding:50px;
    text-align:center;
    color:#718098;
}

.search{
    width:250px;
    margin:0;
}

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translate(-50%,30px);
    opacity:0;
    padding:14px 20px;
    background:#102038;
    border:1px solid #263b59;
    border-radius:10px;
    transition:.2s;
    z-index:99;
}
.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:900px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .order{grid-template-columns:1fr}
}
@media(max-width:550px){
    .cards{grid-template-columns:1fr}
    .search{width:100%}
    .topbar{align-items:flex-start;gap:15px;flex-direction:column}
}

/* ETYKIETA */
#printLabel{
    display:none;
}

.label{
    width:100mm;
    min-height:150mm;
    padding:8mm;
    background:white;
    color:black;
    font-family:Arial,sans-serif;
}
.label h1{
    font-size:25px;
    margin-bottom:8mm;
}
.label .line{
    border-bottom:2px solid #000;
    padding:4mm 0;
}
.label .big{
    font-size:22px;
    font-weight:bold;
}
.label .smallText{
    font-size:12px;
    margin-top:2mm;
}
.label .barcode{
    margin-top:10mm;
    border:3px solid #000;
    padding:8px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    letter-spacing:3px;
}

@media print{
    body>*{display:none!important}
    #printLabel{
        display:block!important;
    }
    @page{
        size:100mm 150mm;
        margin:0;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Printerlase<span>3D</span> ADMIN</div>
    <a href="/" style="color:white;text-decoration:none">← SKLEP</a>
</header>

<div id="loginScreen" class="login">
    <h1>🔐 Panel Admin</h1>
    <p style="color:#8291a8;font-size:12px">
        Zaloguj się do panelu.
    </p>

    <label>HASŁO</label>
    <input id="password" type="password" placeholder="Hasło administratora">

    <button class="btn" onclick="login()">ZALOGUJ</button>

    <div id="error" class="error"></div>
</div>

<main id="dashboard">
<div class="container">

    <div class="topbar">
        <div>
            <h1>📊 Dashboard</h1>
            <p style="color:#8291a8;font-size:12px">
                Printerlase3D — panel administracyjny
            </p>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap">
            <input
                id="search"
                class="search"
                placeholder="🔎 Szukaj zamówienia..."
                oninput="renderOrders()"
            >
            <button class="btn" onclick="loadDashboard()">↻ ODŚWIEŻ</button>
        </div>
    </div>

    <section class="cards">

        <div class="card">
            <small>💰 SALDO</small>
            <strong id="balance" class="green">0,00 zł</strong>
        </div>

        <div class="card">
            <small>📦 ZAMÓWIENIA</small>
            <strong id="count">0</strong>
        </div>

        <div class="card">
            <small>💵 ZAROBIONE</small>
            <strong id="earned" class="blue">0,00 zł</strong>
        </div>

        <div class="card">
            <small>💸 WYPŁACONO</small>
            <strong id="withdrawn" class="red">0,00 zł</strong>
        </div>

    </section>

    <section class="panel">
        <div class="panelHead">
            <h2>📦 Zamówienia</h2>
            <span id="update" style="color:#718098;font-size:11px"></span>
        </div>

        <div id="orders" class="orders"></div>
    </section>

</div>
</main>

<div id="toast" class="toast"></div>

<div id="printLabel"></div>

<script>

let password = "";
let orders = [];

function money(n){
    return Number(n || 0).toFixed(2).replace(".",",")+" zł";
}

function esc(v){
    return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function login(){

    const p=document.getElementById("password").value.trim();

    if(!p){
        document.getElementById("error").textContent="Podaj hasło.";
        return;
    }

    password=p;

    try{

        const r=await fetch("/api/admin/dashboard",{
            headers:{
                "x-admin-password":password
            }
        });

        if(!r.ok) throw new Error();

        const data=await r.json();

        document.getElementById("loginScreen").style.display="none";
        document.getElementById("dashboard").style.display="block";

        update(data);

    }catch{

        password="";
        document.getElementById("error").textContent=
            "❌ Błędne hasło administratora.";

    }
}

async function loadDashboard(){

    try{

        const r=await fetch("/api/admin/dashboard",{
            headers:{
                "x-admin-password":password
            }
        });

        if(r.status===401){
            location.reload();
            return;
        }

        if(!r.ok) throw new Error();

        update(await r.json());

    }catch{
        toast("❌ Nie udało się pobrać danych.");
    }
}

function update(data){

    orders=Array.isArray(data.orders)?data.orders:[];

    document.getElementById("balance").textContent=money(data.balance);
    document.getElementById("count").textContent=orders.length;
    document.getElementById("earned").textContent=money(data.earned);
    document.getElementById("withdrawn").textContent=money(data.withdrawn);

    document.getElementById("update").textContent=
        "Aktualizacja: "+new Date().toLocaleTimeString("pl-PL");

    renderOrders();
}

function renderOrders(){

    const box=document.getElementById("orders");

    const query=
        document.getElementById("search").value.toLowerCase();

    const filtered=orders.filter(o=>
        JSON.stringify(o).toLowerCase().includes(query)
    );

    if(!filtered.length){
        box.innerHTML='<div class="empty">Brak zamówień.</div>';
        return;
    }

    box.innerHTML=filtered.slice().reverse().map(o=>{

        const status=o.status||"NEW";

        return `
        <div class="order">

            <div>
                <div class="orderId">${esc(o.id)}</div>
                <div class="info">👤 ${esc(o.name)}</div>
                <div class="info">✉️ ${esc(o.email)}</div>
            </div>

            <div>
                <b>${money(o.total)}</b>
                <div class="info">
                    ${o.createdAt
                    ?new Date(o.createdAt).toLocaleString("pl-PL")
                    :"—"}
                </div>
            </div>

            <div>
                <span class="status ${esc(status)}">
                    ${esc(status)}
                </span>
            </div>

            <div class="actions">

                <button class="small"
                    onclick="changeStatus('${esc(o.id)}','PAID')">
                    ✓ OPŁACONE
                </button>

                <button class="small"
                    onclick="changeStatus('${esc(o.id)}','CANCELLED')">
                    ✕ ANULUJ
                </button>

                <button class="small"
                    onclick='generateLabel(${JSON.stringify(o)})'>
                    🏷️ GENERUJ ETYKIETĘ
                </button>

            </div>

        </div>
        `;

    }).join("");
}

async function changeStatus(id,status){

    try{

        const r=await fetch("/api/admin/order-status",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "x-admin-password":password
            },
            body:JSON.stringify({id,status})
        });

        if(!r.ok) throw new Error();

        toast(
            status==="PAID"
            ?"✓ Zamówienie opłacone."
            :"✓ Zamówienie anulowane."
        );

        loadDashboard();

    }catch{
        toast("❌ Nie udało się zmienić statusu.");
    }
}

function generateLabel(order){

    const recipient =
        order.name ||
        order.customerName ||
        "Brak danych";

    const email =
        order.email ||
        "Brak danych";

    const address =
        order.address ||
        order.shippingAddress ||
        order.deliveryAddress ||
        "";

    const city =
        order.city ||
        "";

    const postal =
        order.postalCode ||
        order.zip ||
        "";

    document.getElementById("printLabel").innerHTML=`

        <div class="label">

            <h1>PRINTERLASE3D</h1>

            <div class="line">
                <b>ODBIORCA</b>
                <div class="big">${esc(recipient)}</div>
            </div>

            <div class="line">
                <b>ADRES</b>
                <div class="big">${esc(address)}</div>
                <div class="big">
                    ${esc(postal)} ${esc(city)}
                </div>
            </div>

            <div class="line">
                <b>E-MAIL</b>
                <div class="smallText">${esc(email)}</div>
            </div>

            <div class="line">
                <b>ZAMÓWIENIE</b>
                <div class="big">${esc(order.id)}</div>
            </div>

            <div class="line">
                <b>KWOTA</b>
                <div class="big">${money(order.total)}</div>
            </div>

            <div class="barcode">
                ${esc(order.id)}
            </div>

        </div>
    `;

    window.print();
}

function toast(text){

    const t=document.getElementById("toast");

    t.textContent=text;
    t.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{
        t.classList.remove("show");
    },3000);
}

document.getElementById("password").addEventListener("keydown",e=>{
    if(e.key==="Enter") login();
});

</script>

</body>
</html>
