<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>
    Printerlase3D — Admin
</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(0,200,255,.15),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 10%,
            rgba(113,60,255,.18),
            transparent 30%
        ),

        #030712;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.top{
    height:70px;

    padding:
        0 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(3,7,18,.9);

    backdrop-filter:
        blur(20px);
}

.logo{
    font-size:21px;
    font-weight:1000;
}

.logo span{
    color:#00c8ff;
}

.back{
    color:white;
    text-decoration:none;

    padding:
        10px 15px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:10px;

    background:#091527;

    font-size:11px;
    font-weight:900;
}

.login{
    width:
        min(420px,92%);

    margin:
        110px auto;

    padding:32px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:24px;

    background:#071120;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.45);
}

.login h1{
    margin-bottom:8px;
}

.muted{
    color:#8190a5;
    font-size:11px;
    line-height:1.6;
}

.field{
    margin-top:18px;
}

label{
    display:block;

    margin-bottom:7px;

    color:#9aa8ba;

    font-size:10px;
    font-weight:900;
}

input,
select{
    width:100%;

    padding:13px;

    color:white;

    background:#030a14;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:10px;

    outline:none;
}

.btn{
    border:0;

    border-radius:10px;

    padding:
        13px 18px;

    color:white;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #713cff
        );

    font-size:10px;
    font-weight:1000;
}

.login .btn{
    width:100%;
    margin-top:18px;
}

.error{
    margin-top:12px;
    color:#ff5577;
    font-size:10px;
}

.dashboard{
    display:none;
}

.container{
    width:
        min(1200px,92%);

    margin:
        40px auto 80px;
}

.heading{
    display:flex;

    justify-content:space-between;

    align-items:end;

    gap:20px;

    margin-bottom:25px;
}

.heading h1{
    font-size:34px;
}

.cards{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.card{
    padding:22px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #081426,
            #050c18
        );
}

.card small{
    color:#8190a5;

    font-size:9px;
    font-weight:900;
}

.card strong{
    display:block;

    margin-top:10px;

    font-size:25px;
}

.green{
    color:#42e6a4;
}

.blue{
    color:#00c8ff;
}

.red{
    color:#ff5577;
}

.withdraw{
    margin-top:25px;

    padding:25px;

    border:
        1px solid
        rgba(66,230,164,.15);

    border-radius:20px;

    background:#071120;
}

.withdrawGrid{
    margin-top:18px;

    display:grid;

    grid-template-columns:
        1fr 1fr auto;

    gap:12px;

    align-items:end;
}

.withdrawGrid .field{
    margin:0;
}

.orders{
    margin-top:25px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:18px;

    background:#071120;
}

.ordersHeader{
    padding:20px;

    display:flex;

    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.order{
    padding:
        18px 20px;

    display:grid;

    grid-template-columns:
        1fr 150px 130px 180px;

    gap:15px;

    align-items:center;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.order strong{
    font-size:11px;
}

.order span{
    display:block;

    margin-top:5px;

    color:#8190a5;

    font-size:9px;
}

.status{
    display:inline-block;

    padding:
        7px 9px;

    border-radius:8px;

    background:#132238;

    font-size:8px;

    font-weight:1000;
}

.PAID{
    color:#42e6a4;
}

.NEW{
    color:#00c8ff;
}

.CANCELLED{
    color:#ff5577;
}

.actions{
    display:flex;

    gap:6px;

    flex-wrap:wrap;
}

.smallBtn{
    padding:
        7px 9px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:7px;

    color:white;

    background:#0b182a;

    font-size:8px;

    font-weight:900;
}

.empty{
    padding:50px;

    text-align:center;

    color:#8190a5;
}

.toast{
    position:fixed;

    left:50%;

    bottom:25px;

    padding:
        13px 18px;

    border-radius:12px;

    background:#102038;

    opacity:0;

    transform:
        translate(-50%,30px);

    transition:.25s;

    font-size:10px;

    font-weight:900;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

@media(max-width:850px){

    .cards{
        grid-template-columns:
            repeat(2,1fr);
    }

    .withdrawGrid{
        grid-template-columns:1fr;
    }

    .order{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){

    .cards{
        grid-template-columns:1fr;
    }

    .heading{
        flex-direction:column;
        align-items:start;
    }
}

</style>

</head>

<body>

<header class="top">

    <div class="logo">
        Printerlase<span>3D</span> ADMIN
    </div>

    <a
        href="/"
        class="back"
    >
        ← SKLEP
    </a>

</header>


<section
    id="loginScreen"
    class="login"
>

    <h1>
        🔐 Panel Admin
    </h1>

    <p class="muted">
        Zaloguj się do panelu Printerlase3D.
    </p>

    <div class="field">

        <label>
            HASŁO ADMINA
        </label>

        <input
            id="password"
            type="password"
            placeholder="Hasło..."
            autocomplete="current-password"
        >

    </div>

    <button
        class="btn"
        onclick="login()"
    >
        ZALOGUJ
    </button>

    <div
        id="error"
        class="error"
    ></div>

</section>


<main
    id="dashboard"
    class="dashboard"
>

<div class="container">

    <div class="heading">

        <div>

            <h1>
                📊 Dashboard
            </h1>

            <p class="muted">
                Zarządzaj sklepem Printerlase3D.
            </p>

        </div>

        <div>

            <button
                class="btn"
                onclick="loadDashboard()"
            >
                ↻ ODŚWIEŻ
            </button>

            <button
                class="smallBtn"
                onclick="logout()"
            >
                WYLOGUJ
            </button>

        </div>

    </div>


    <section class="cards">

        <div class="card">

            <small>
                💰 SALDO
            </small>

            <strong
                id="balance"
                class="green"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                📦 ZAMÓWIENIA
            </small>

            <strong id="ordersCount">
                0
            </strong>

        </div>


        <div class="card">

            <small>
                💵 ZAROBIONE
            </small>

            <strong
                id="earned"
                class="blue"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                💸 WYPŁACONO
            </small>

            <strong
                id="withdrawn"
                class="red"
            >
                0,00 zł
            </strong>

        </div>

    </section>


    <section class="withdraw">

        <h2>
            💸 Wypłata
        </h2>

        <p class="muted">
            Utwórz żądanie wypłaty.
        </p>

        <div class="withdrawGrid">

            <div class="field">

                <label>
                    KWOTA
                </label>

                <input
                    id="amount"
                    type="number"
                    min="1"
                    step="0.01"
                    placeholder="25.00"
                >

            </div>


            <div class="field">

                <label>
                    METODA
                </label>

                <select id="method">

                    <option value="bank">
                        🏦 Konto bankowe
                    </option>

                    <option value="blik">
                        📱 BLIK
                    </option>

                </select>

            </div>


            <button
                class="btn"
                onclick="withdraw()"
            >
                💸 WYPŁAĆ
            </button>

        </div>

    </section>


    <section class="orders">

        <div class="ordersHeader">

            <h2>
                📦 Zamówienia
            </h2>

            <span
                id="update"
                class="muted"
            ></span>

        </div>

        <div id="ordersList"></div>

    </section>

</div>

</main>


<div
    id="toast"
    class="toast"
></div>


<script>

// ========================================
// FORMAT PIENIĘDZY
// ========================================

function money(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".",",")
        + " zł";
}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


// ========================================
// SPRAWDZENIE SESJI
// ========================================

async function checkSession(){

    try{

        const response =
            await fetch(
                "/api/admin/session"
            );

        const data =
            await response.json();

        if(
            data.authenticated
        ){

            showDashboard();
        }

    }catch(error){

        console.error(error);
    }
}


// ========================================
// LOGIN
// ========================================

async function login(){

    const password =
        document
            .getElementById("password")
            .value;

    if(!password){

        document
            .getElementById("error")
            .textContent =
            "Podaj hasło.";

        return;
    }

    try{

        const response =
            await fetch(
                "/api/admin/login",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            password
                        })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błędne hasło."
            );
        }

        document
            .getElementById("password")
            .value = "";

        showDashboard();

    }catch(error){

        document
            .getElementById("error")
            .textContent =
            "❌ " +
            error.message;
    }
}


// ========================================
// PANEL
// ========================================

function showDashboard(){

    document
        .getElementById("loginScreen")
        .style.display = "none";

    document
        .getElementById("dashboard")
        .style.display = "block";

    loadDashboard();
}


// ========================================
// DANE
// ========================================

async function loadDashboard(){

    try{

        const response =
            await fetch(
                "/api/admin/dashboard"
            );

        if(
            response.status === 401
        ){

            location.reload();

            return;
        }

        const data =
            await response.json();

        document
            .getElementById("balance")
            .textContent =
            money(data.balance);

        document
            .getElementById("ordersCount")
            .textContent =
            data.orders.length;

        document
            .getElementById("earned")
            .textContent =
            money(data.earned);

        document
            .getElementById("withdrawn")
            .textContent =
            money(data.withdrawn);

        document
            .getElementById("update")
            .textContent =
            "Aktualizacja: " +
            new Date()
                .toLocaleTimeString(
                    "pl-PL"
                );

        renderOrders(
            data.orders
        );

    }catch(error){

        showToast(
            "❌ Nie udało się pobrać danych."
        );
    }
}


// ========================================
// ZAMÓWIENIA
// ========================================

function renderOrders(orders){

    const box =
        document
            .getElementById(
                "ordersList"
            );

    if(!orders.length){

        box.innerHTML = `
            <div class="empty">
                Brak zamówień.
            </div>
        `;

        return;
    }

    box.innerHTML =
        orders
            .slice()
            .reverse()
            .map(order => {

                const status =
                    order.status ||
                    "NEW";

                return `

<div class="order">

    <div>

        <strong>
            ${escapeHTML(order.id)}
        </strong>

        <span>
            👤
            ${escapeHTML(order.name)}
        </span>

        <span>
            ✉️
            ${escapeHTML(order.email)}
        </span>

    </div>


    <div>

        <strong>
            ${money(order.total)}
        </strong>

        <span>
            ${new Date(
                order.createdAt
            ).toLocaleString("pl-PL")}
        </span>

    </div>


    <div>

        <span
            class="status ${escapeHTML(status)}"
        >
            ${escapeHTML(status)}
        </span>

    </div>


    <div class="actions">

        ${
            status !== "PAID"
            ?
            `
            <button
                class="smallBtn"
                onclick="setStatus(
                    '${escapeHTML(order.id)}',
                    'PAID'
                )"
            >
                ✓ OPŁACONE
            </button>
            `
            :
            ""
        }


        ${
            status !== "CANCELLED"
            ?
            `
            <button
                class="smallBtn"
                onclick="setStatus(
                    '${escapeHTML(order.id)}',
                    'CANCELLED'
                )"
            >
                ✕ ANULUJ
            </button>
            `
            :
            ""
        }

    </div>

</div>

`;

            })
            .join("");
}


// ========================================
// STATUS
// ========================================

async function setStatus(
    id,
    status
){

    try{

        const response =
            await fetch(
                "/api/admin/order-status",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id,
                            status
                        })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd."
            );
        }

        showToast(
            "✓ Status zmieniony."
        );

        loadDashboard();

    }catch(error){

        showToast(
            "❌ " +
            error.message
        );
    }
}


// ========================================
// WYPŁATA
// ========================================

async function withdraw(){

    const amount =
        Number(
            document
                .getElementById("amount")
                .value
        );

    const method =
        document
            .getElementById("method")
            .value;

    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showToast(
            "❌ Podaj prawidłową kwotę."
        );

        return;
    }

    try{

        const response =
            await fetch(
                "/api/admin/withdraw",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            amount,
                            method
                        })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd wypłaty."
            );
        }

        document
            .getElementById("amount")
            .value = "";

        showToast(
            "✓ Żądanie wypłaty utworzone."
        );

        loadDashboard();

    }catch(error){

        showToast(
            "❌ " +
            error.message
        );
    }
}


// ========================================
// WYLOGOWANIE
// ========================================

async function logout(){

    await fetch(
        "/api/admin/logout",
        {
            method:"POST"
        }
    );

    location.reload();
}


// ========================================
// TOAST
// ========================================

function showToast(text){

    const toast =
        document
            .getElementById(
                "toast"
            );

    toast.textContent = text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );
}


// ========================================
// ENTER
// ========================================

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){
                login();
            }

        }
    );


// ========================================
// START
// ========================================

checkSession();

</script>

</body>
</html>
