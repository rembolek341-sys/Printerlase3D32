<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Printerlase3D — Panel Admina</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 10% 0%,#063c5d,transparent 30%),
        radial-gradient(circle at 90% 0%,#36105d,transparent 30%),
        #020611;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginBox{
    width:min(430px,100%);
    padding:40px;
    border:1px solid #23445f;
    border-radius:25px;
    background:#071222eF;
    box-shadow:
        0 30px 100px #000,
        0 0 50px #00c8ff12;
    text-align:center;
    animation:loginIn .6s ease;
}

@keyframes loginIn{
    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.logo{
    margin-bottom:10px;
    font-size:31px;
    font-weight:1000;
}

.logo span{
    color:#00c8ff;
}

.loginSubtitle{
    margin-bottom:28px;
    color:#71839a;
    font-size:10px;
}

.loginInput{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    outline:none;
    border:1px solid #24415b;
    border-radius:11px;
    color:white;
    background:#030914;
}

.loginInput:focus{
    border-color:#00c8ff;
    box-shadow:0 0 20px #00c8ff12;
}

.loginButton{
    width:100%;
    padding:15px;
    border:0;
    border-radius:11px;
    color:white;
    background:linear-gradient(100deg,#008cff,#713cff);
    font-weight:1000;
}

.loginError{
    min-height:18px;
    margin-top:12px;
    color:#ff5475;
    font-size:9px;
    font-weight:1000;
}

/* APP */

#adminApp{
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:76px;
    padding:0 4%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #173049;
    background:#030712eF;
    backdrop-filter:blur(20px);
}

.topRight{
    display:flex;
    align-items:center;
    gap:10px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 11px;
    border:1px solid #1b573b;
    border-radius:9px;
    color:#65e7a3;
    background:#0a2419;
    font-size:8px;
    font-weight:1000;
}

.statusDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#39df8b;
    box-shadow:0 0 12px #39df8b;
}

.logout{
    padding:9px 12px;
    border:1px solid #573044;
    border-radius:9px;
    color:#ff6a88;
    background:#240d17;
    font-size:8px;
    font-weight:1000;
}

.container{
    width:min(1400px,92%);
    margin:auto;
    padding:35px 0 70px;
}

/* HEADER */

.pageHeader{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:25px;
}

.pageHeader h1{
    font-size:38px;
    letter-spacing:-2px;
}

.pageHeader p{
    margin-top:7px;
    color:#71839a;
    font-size:10px;
}

.refresh{
    padding:12px 15px;
    border:1px solid #25445e;
    border-radius:10px;
    color:white;
    background:#09192c;
    font-size:8px;
    font-weight:1000;
}

.refresh:hover{
    border-color:#00c8ff;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    position:relative;
    overflow:hidden;
    padding:22px;
    border:1px solid #193650;
    border-radius:18px;
    background:#071222;
    transition:.25s;
}

.stat:hover{
    transform:translateY(-5px);
    border-color:#286486;
}

.stat::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    right:-50px;
    bottom:-60px;
    border-radius:50%;
    background:#00c8ff14;
    filter:blur(20px);
}

.statIcon{
    font-size:25px;
    margin-bottom:12px;
}

.statLabel{
    color:#71839a;
    font-size:8px;
    font-weight:1000;
}

.statValue{
    margin-top:6px;
    font-size:26px;
    font-weight:1000;
}

/* BALANCE */

.balance{
    margin-bottom:20px;
    padding:28px;
    border:1px solid #315476;
    border-radius:22px;
    background:
        radial-gradient(circle at 100% 0,#713cff24,transparent 40%),
        radial-gradient(circle at 0% 100%,#00c8ff18,transparent 40%),
        #071222;
}

.balanceTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.balanceTitle{
    color:#8192a8;
    font-size:9px;
    font-weight:1000;
}

.balanceValue{
    margin-top:5px;
    font-size:42px;
    font-weight:1000;
}

.balanceMax{
    color:#65778e;
    font-size:9px;
}

.progress{
    height:9px;
    margin-top:18px;
    overflow:hidden;
    border-radius:20px;
    background:#14243a;
}

.progressBar{
    width:0%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#00c8ff,#713cff);
    transition:width .6s ease;
}

/* GRID */

.mainGrid{
    display:grid;
    grid-template-columns:1.5fr .8fr;
    gap:20px;
}

/* CARD */

.card{
    border:1px solid #193650;
    border-radius:20px;
    background:#071222;
    overflow:hidden;
}

.cardHeader{
    padding:20px;
    border-bottom:1px solid #172e44;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.cardHeader h2{
    font-size:17px;
}

.cardHeader span{
    color:#687b92;
    font-size:8px;
}

/* ORDERS */

.orders{
    max-height:700px;
    overflow:auto;
}

.order{
    padding:20px;
    border-bottom:1px solid #142b41;
    transition:.2s;
}

.order:hover{
    background:#0a1829;
}

.order:last-child{
    border-bottom:0;
}

.orderTop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.orderId{
    color:#00c8ff;
    font-size:9px;
    font-weight:1000;
}

.orderDate{
    margin-top:5px;
    color:#63758c;
    font-size:8px;
}

.orderPrice{
    color:#65e7a3;
    font-size:20px;
    font-weight:1000;
}

.orderCustomer{
    margin-top:15px;
    font-size:11px;
    font-weight:1000;
}

.orderEmail{
    margin-top:4px;
    color:#71839a;
    font-size:9px;
}

.orderAddress{
    margin-top:3px;
    color:#71839a;
    font-size:9px;
}

.orderItems{
    margin-top:15px;
    display:grid;
    gap:6px;
}

.orderItem{
    padding:9px;
    border-radius:8px;
    color:#8a9aaf;
    background:#0b1a2d;
    font-size:9px;
}

.orderBottom{
    margin-top:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.orderStatus{
    padding:6px 9px;
    border-radius:7px;
    color:#ffd45c;
    background:#382d0b;
    font-size:7px;
    font-weight:1000;
}

.orderStatus.done{
    color:#65e7a3;
    background:#0b2c1c;
}

.orderStatus.cancel{
    color:#ff6b86;
    background:#35101b;
}

.orderButtons{
    display:flex;
    gap:6px;
}

.smallBtn{
    padding:8px 10px;
    border:1px solid #25445d;
    border-radius:8px;
    color:white;
    background:#0b1b2d;
    font-size:7px;
    font-weight:1000;
}

.smallBtn:hover{
    border-color:#00c8ff;
}

/* CUSTOM */

.customList{
    max-height:700px;
    overflow:auto;
}

.customOrder{
    padding:18px;
    border-bottom:1px solid #142b41;
}

.customOrder:last-child{
    border-bottom:0;
}

.customTitle{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.customTitle strong{
    font-size:11px;
}

.customTitle span{
    color:#00c8ff;
    font-size:8px;
    font-weight:1000;
}

.customInfo{
    margin-top:10px;
    display:grid;
    gap:5px;
    color:#7c8da3;
    font-size:8px;
}

.customDescription{
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    color:#a0afc1;
    background:#0a192b;
    font-size:9px;
    line-height:1.6;
}

.customFile{
    display:block;
    margin-top:12px;
    padding:10px;
    border-radius:8px;
    color:#71dfff;
    background:#061d2b;
    font-size:8px;
}

.customActions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.approve{
    padding:9px 12px;
    border:0;
    border-radius:8px;
    color:white;
    background:#087a4b;
    font-size:7px;
    font-weight:1000;
}

.delete{
    padding:9px 12px;
    border:0;
    border-radius:8px;
    color:white;
    background:#8b1633;
    font-size:7px;
    font-weight:1000;
}

/* EMPTY */

.empty{
    padding:50px 20px;
    text-align:center;
    color:#64758b;
    font-size:10px;
}

.emptyIcon{
    margin-bottom:10px;
    font-size:35px;
}

/* TOAST */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:9999;
    padding:14px 20px;
    border:1px solid #31506d;
    border-radius:12px;
    color:white;
    background:#0b1b2e;
    opacity:0;
    transform:translate(-50%,30px);
    pointer-events:none;
    transition:.3s;
    font-size:9px;
    font-weight:1000;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .mainGrid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .topbar{
        padding:0 4%;
    }

    .status{
        display:none;
    }

    .container{
        width:94%;
        padding-top:25px;
    }

    .pageHeader{
        align-items:flex-start;
        flex-direction:column;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .balanceTop{
        align-items:flex-start;
        flex-direction:column;
    }

    .pageHeader h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            Printerlase<span>3D</span>
        </div>

        <div class="loginSubtitle">
            PANEL ADMINISTRATORA
        </div>

        <input
            id="adminPassword"
            class="loginInput"
            type="password"
            placeholder="Hasło administratora"
            autocomplete="current-password"
        >

        <button
            class="loginButton"
            onclick="login()"
        >
            🔐 ZALOGUJ DO PANELU
        </button>

        <div
            id="loginError"
            class="loginError"
        ></div>

    </div>

</section>


<!-- ADMIN APP -->

<section
    id="adminApp"
    class="hidden"
>

    <header class="topbar">

        <div class="logo">
            Printerlase<span>3D</span>
        </div>

        <div class="topRight">

            <div class="status">
                <span class="statusDot"></span>
                ONLINE
            </div>

            <button
                class="logout"
                onclick="logout()"
            >
                WYLOGUJ
            </button>

        </div>

    </header>


    <main class="container">

        <div class="pageHeader">

            <div>

                <h1>
                    Panel Admina ⚡
                </h1>

                <p>
                    Zarządzaj zamówieniami Printerlase3D.
                </p>

            </div>

            <button
                class="refresh"
                onclick="loadData()"
            >
                🔄 ODŚWIEŻ
            </button>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <div class="statIcon">
                    💰
                </div>

                <div class="statLabel">
                    SALDO
                </div>

                <div
                    class="statValue"
                    id="statBalance"
                >
                    0,00 zł
                </div>

            </div>


            <div class="stat">

                <div class="statIcon">
                    🛒
                </div>

                <div class="statLabel">
                    ZAMÓWIENIA
                </div>

                <div
                    class="statValue"
                    id="statOrders"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="statIcon">
                    📈
                </div>

                <div class="statLabel">
                    SPRZEDAŻ
                </div>

                <div
                    class="statValue"
                    id="statSales"
                >
                    0,00 zł
                </div>

            </div>


            <div class="stat">

                <div class="statIcon">
                    🧩
                </div>

                <div class="statLabel">
                    WŁASNE MODELE
                </div>

                <div
                    class="statValue"
                    id="statCustom"
                >
                    0
                </div>

            </div>

        </div>


        <!-- BALANCE -->

        <section class="balance">

            <div class="balanceTop">

                <div>

                    <div class="balanceTitle">
                        💳 AKTUALNE SALDO
                    </div>

                    <div
                        class="balanceValue"
                        id="balanceValue"
                    >
                        0,00 zł
                    </div>

                </div>

                <div class="balanceMax">
                    LIMIT SALDA: <strong>100,00 zł</strong>
                </div>

            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progressBar"
                ></div>

            </div>

        </section>


        <!-- CONTENT -->

        <div class="mainGrid">


            <!-- ORDERS -->

            <section class="card">

                <div class="cardHeader">

                    <h2>
                        🛒 Zamówienia
                    </h2>

                    <span id="ordersInfo">
                        Ładowanie...
                    </span>

                </div>

                <div
                    id="ordersList"
                    class="orders"
                ></div>

            </section>


            <!-- CUSTOM MODELS -->

            <section class="card">

                <div class="cardHeader">

                    <h2>
                        🧩 Własne modele
                    </h2>

                    <span>
                        DO SPRAWDZENIA
                    </span>

                </div>

                <div
                    id="customList"
                    class="customList"
                ></div>

            </section>

        </div>

    </main>

</section>


<div id="toast"></div>


<script>

/* =========================================
   CONFIG
========================================= */

const ADMIN_PASSWORD = "Admin2137!";

const MAX_BALANCE = 100;


/* =========================================
   STATE
========================================= */

let orders = [];
let customOrders = [];
let balance = 0;


/* =========================================
   HELPERS
========================================= */

function money(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".",",") + " zł";

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function formatDate(value){

    if(!value) return "Brak daty";

    const date = new Date(value);

    if(Number.isNaN(date.getTime())){
        return String(value);
    }

    return date.toLocaleString("pl-PL");

}


/* =========================================
   LOGIN
========================================= */

function login(){

    const input =
        document.getElementById("adminPassword");

    const error =
        document.getElementById("loginError");

    const password =
        input.value;

    if(password === ADMIN_PASSWORD){

        sessionStorage.setItem(
            "printerlase3d_admin",
            "true"
        );

        error.textContent = "";

        document
            .getElementById("loginScreen")
            .classList
            .add("hidden");

        document
            .getElementById("adminApp")
            .classList
            .remove("hidden");

        loadData();

        showToast(
            "✅ Zalogowano do panelu."
        );

    }else{

        error.textContent =
            "❌ Nieprawidłowe hasło.";

        input.value = "";

    }

}


function logout(){

    sessionStorage.removeItem(
        "printerlase3d_admin"
    );

    location.reload();

}


document
    .getElementById("adminPassword")
    .addEventListener(
        "keydown",
        event => {

            if(event.key === "Enter"){
                login();
            }

        }
    );


/* =========================================
   LOAD DATA
========================================= */

async function loadData(){

    try{

        const response =
            await fetch("/api/admin/orders");

        if(response.ok){

            const data =
                await response.json();

            orders =
                Array.isArray(data.orders)
                    ? data.orders
                    : Array.isArray(data)
                        ? data
                        : [];

            customOrders =
                Array.isArray(data.customOrders)
                    ? data.customOrders
                    : [];

            calculateBalance();

            renderAll();

            return;

        }

    }catch(error){

        console.log(
            "API niedostępne:",
            error
        );

    }


    /*
       Jeśli API jeszcze nie istnieje,
       panel nadal działa lokalnie.
    */

    orders =
        JSON.parse(
            localStorage.getItem(
                "printerlase3d_orders"
            ) || "[]"
        );

    customOrders =
        JSON.parse(
            localStorage.getItem(
                "printerlase3d_custom_orders"
            ) || "[]"
        );

    calculateBalance();

    renderAll();

}


/* =========================================
   BALANCE
========================================= */

function calculateBalance(){

    /*
       Saldo rośnie o kwotę każdego zamówienia,
       ale nigdy nie przekracza 100 zł.
    */

    const sales =
        orders.reduce(
            (sum,order) =>
                sum + Number(order.total || 0),
            0
        );

    balance =
        Math.min(
            MAX_BALANCE,
            sales
        );

}


function renderBalance(){

    const percentage =
        Math.min(
            100,
            (balance / MAX_BALANCE) * 100
        );

    document
        .getElementById("balanceValue")
        .textContent = money(balance);

    document
        .getElementById("statBalance")
        .textContent = money(balance);

    document
        .getElementById("progressBar")
        .style.width = percentage + "%";

}


/* =========================================
   STATS
========================================= */

function renderStats(){

    const sales =
        orders.reduce(
            (sum,order) =>
                sum + Number(order.total || 0),
            0
        );

    document
        .getElementById("statOrders")
        .textContent =
            orders.length;

    document
        .getElementById("statSales")
        .textContent =
            money(sales);

    document
        .getElementById("statCustom")
        .textContent =
            customOrders.length;

    document
        .getElementById("ordersInfo")
        .textContent =
            orders.length +
            (
                orders.length === 1
                    ? " zamówienie"
                    : " zamówień"
            );

}


/* =========================================
   ORDERS
========================================= */

function renderOrders(){

    const box =
        document.getElementById("ordersList");

    if(!orders.length){

        box.innerHTML = `
            <div class="empty">
                <div class="emptyIcon">📭</div>
                Brak zamówień.
            </div>
        `;

        return;

    }


    box.innerHTML =
        [...orders]
            .reverse()
            .map((order,index) => {

                const id =
                    order.id ||
                    ("ORD-" +
                    String(index + 1)
                        .padStart(4,"0"));

                const status =
                    String(
                        order.status ||
                        "NEW"
                    ).toUpperCase();

                const statusClass =
                    status === "DONE"
                        ? "done"
                        : status === "CANCELLED"
                            ? "cancel"
                            : "";

                const items =
                    Array.isArray(order.items)
                        ? order.items
                        : [];


                return `

                    <article class="order">

                        <div class="orderTop">

                            <div>

                                <div class="orderId">
                                    #${escapeHTML(id)}
                                </div>

                                <div class="orderDate">
                                    ${escapeHTML(
                                        formatDate(
                                            order.createdAt
                                        )
                                    )}
                                </div>

                            </div>

                            <div class="orderPrice">
                                ${money(order.total)}
                            </div>

                        </div>


                        <div class="orderCustomer">
                            ${escapeHTML(
                                order.name ||
                                "Brak imienia"
                            )}
                        </div>

                        <div class="orderEmail">
                            📧 ${escapeHTML(
                                order.email ||
                                "Brak e-maila"
                            )}
                        </div>

                        <div class="orderAddress">
                            📍 ${escapeHTML(
                                order.address ||
                                "Brak adresu"
                            )}
                        </div>


                        <div class="orderItems">

                            ${
                                items.length
                                ?
                                items.map(item => `

                                    <div class="orderItem">

                                        ${escapeHTML(
                                            item.name ||
                                            "Produkt"
                                        )}

                                        ×

                                        ${Number(
                                            item.quantity ||
                                            item.qty ||
                                            1
                                        )}

                                        —
                                        ${money(
                                            Number(
                                                item.price || 0
                                            )
                                        )}

                                    </div>

                                `).join("")
                                :
                                `
                                <div class="orderItem">
                                    Brak szczegółów produktów
                                </div>
                                `
                            }

                        </div>


                        <div class="orderBottom">

                            <div class="orderStatus ${statusClass}">
                                ${escapeHTML(status)}
                            </div>

                            <div class="orderButtons">

                                <button
                                    class="smallBtn"
                                    onclick="markDone('${escapeHTML(id)}')"
                                >
                                    ✓ GOTOWE
                                </button>

                                <button
                                    class="smallBtn"
                                    onclick="deleteOrder('${escapeHTML(id)}')"
                                >
                                    🗑 USUŃ
                                </button>

                            </div>

                        </div>

                    </article>

                `;

            })
            .join("");

}


/* =========================================
   CUSTOM MODELS
========================================= */

function renderCustomOrders(){

    const box =
        document.getElementById("customList");

    if(!customOrders.length){

        box.innerHTML = `
            <div class="empty">
                <div class="emptyIcon">🧩</div>
                Brak własnych modeli.
            </div>
        `;

        return;

    }


    box.innerHTML =
        [...customOrders]
            .reverse()
            .map((item,index) => {

                const id =
                    item.id ||
                    ("CUSTOM-" +
                    String(index + 1)
                        .padStart(4,"0"));

                return `

                    <article class="customOrder">

                        <div class="customTitle">

                            <strong>
                                ${escapeHTML(
                                    item.name ||
                                    "Klient"
                                )}
                            </strong>

                            <span>
                                #${escapeHTML(id)}
                            </span>

                        </div>


                        <div class="customInfo">

                            <span>
                                📧 ${escapeHTML(
                                    item.email ||
                                    "Brak e-maila"
                                )}
                            </span>

                            <span>
                                📞 ${escapeHTML(
                                    item.phone ||
                                    "Brak telefonu"
                                )}
                            </span>

                            <span>
                                🎨 ${escapeHTML(
                                    item.material ||
                                    "PLA"
                                )}
                                /
                                ${escapeHTML(
                                    item.color ||
                                    "Brak koloru"
                                )}
                            </span>

                            <span>
                                🕒 ${escapeHTML(
                                    formatDate(
                                        item.createdAt
                                    )
                                )}
                            </span>

                        </div>


                        <div class="customDescription">

                            ${escapeHTML(
                                item.description ||
                                "Brak opisu."
                            )}

                        </div>


                        ${
                            item.fileName
                            ?
                            `
                            <div class="customFile">
                                📁
                                ${escapeHTML(
                                    item.fileName
                                )}
                            </div>
                            `
                            :
                            ""
                        }


                        <div class="customActions">

                            <button
                                class="approve"
                                onclick="approveCustom('${escapeHTML(id)}')"
                            >
                                ✓ PRZYJĘTE
                            </button>

                            <button
                                class="delete"
                                onclick="deleteCustom('${escapeHTML(id)}')"
                            >
                                🗑 USUŃ
                            </button>

                        </div>

                    </article>

                `;

            })
            .join("");

}


/* =========================================
   RENDER ALL
========================================= */

function renderAll(){

    renderBalance();

    renderStats();

    renderOrders();

    renderCustomOrders();

}


/* =========================================
   ORDER ACTIONS
========================================= */

async function markDone(id){

    const order =
        orders.find(
            item =>
                String(item.id) === String(id)
        );

    if(!order) return;

    order.status = "DONE";

    saveLocal();

    try{

        await fetch(
            "/api/admin/orders/" +
            encodeURIComponent(id),
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    status:"DONE"
                })
            }
        );

    }catch(error){}

    renderAll();

    showToast(
        "✅ Zamówienie oznaczone jako gotowe."
    );

}


async function deleteOrder(id){

    if(!confirm(
        "Na pewno usunąć to zamówienie?"
    )){
        return;
    }

    orders =
        orders.filter(
            order =>
                String(order.id) !== String(id)
        );

    saveLocal();

    try{

        await fetch(
            "/api/admin/orders/" +
            encodeURIComponent(id),
            {
                method:"DELETE"
            }
        );

    }catch(error){}

    calculateBalance();

    renderAll();

    showToast(
        "🗑 Zamówienie usunięte."
    );

}


/* =========================================
   CUSTOM ACTIONS
========================================= */

async function approveCustom(id){

    const item =
        customOrders.find(
            order =>
                String(order.id) === String(id)
        );

    if(!item) return;

    item.status = "APPROVED";

    saveLocal();

    try{

        await fetch(
            "/api/admin/custom/" +
            encodeURIComponent(id),
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    status:"APPROVED"
                })
            }
        );

    }catch(error){}

    renderCustomOrders();

    showToast(
        "✅ Model przyjęty do realizacji."
    );

}


async function deleteCustom(id){

    if(!confirm(
        "Usunąć ten własny model?"
    )){
        return;
    }

    customOrders =
        customOrders.filter(
            item =>
                String(item.id) !== String(id)
        );

    saveLocal();

    try{

        await fetch(
            "/api/admin/custom/" +
            encodeURIComponent(id),
            {
                method:"DELETE"
            }
        );

    }catch(error){}

    renderStats();

    renderCustomOrders();

    showToast(
        "🗑 Model usunięty."
    );

}


/* =========================================
   LOCAL FALLBACK
========================================= */

function saveLocal(){

    localStorage.setItem(
        "printerlase3d_orders",
        JSON.stringify(orders)
    );

    localStorage.setItem(
        "printerlase3d_custom_orders",
        JSON.stringify(customOrders)
    );

}


/* =========================================
   TOAST
========================================= */

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {
                toast.classList.remove("show");
            },
            3000
        );

}


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    () => {

        if(
            sessionStorage.getItem(
                "printerlase3d_admin"
            ) === "true"
        ){

            document
                .getElementById("loginScreen")
                .classList
                .add("hidden");

            document
                .getElementById("adminApp")
                .classList
                .remove("hidden");

            loadData();

        }

    }
);

</script>
