```html
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printerlase3D — Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 0%,#06304a 0,transparent 30%),
        radial-gradient(circle at 90% 0%,#20104a 0,transparent 30%),
        #030712;
    color:#fff;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.top{
    height:70px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(3,7,18,.9);
    border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:21px;
    font-weight:1000;
}

.logo span{
    color:#00c8ff;
}

.back{
    text-decoration:none;
    color:white;
    background:#0b1728;
    border:1px solid rgba(255,255,255,.08);
    padding:10px 15px;
    border-radius:10px;
    font-size:11px;
    font-weight:900;
}

.container{
    width:min(1200px,94%);
    margin:35px auto 80px;
}

/* LOGIN */

.login{
    width:min(420px,94%);
    margin:100px auto;
    padding:30px;
    border-radius:22px;
    background:#071120;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 100px rgba(0,0,0,.4);
}

.login h1{
    margin-bottom:8px;
}

.muted{
    color:#8190a5;
    font-size:11px;
    line-height:1.6;
}

.field{
    margin-top:18px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#8d9caf;
    font-size:10px;
    font-weight:900;
}

.field input,
.field select{
    width:100%;
    padding:13px;
    color:#fff;
    background:#030a14;
    border:1px solid rgba(255,255,255,.09);
    border-radius:10px;
    outline:none;
}

.btn{
    border:0;
    border-radius:10px;
    padding:13px 17px;
    color:white;
    background:linear-gradient(100deg,#008cff,#713cff);
    font-size:10px;
    font-weight:1000;
}

.btn:hover{
    transform:translateY(-1px);
}

.login .btn{
    width:100%;
    margin-top:18px;
}

.error{
    margin-top:12px;
    color:#ff5577;
    font-size:11px;
}

#dashboard{
    display:none;
}

/* HEADER */

.heading{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.heading h1{
    font-size:34px;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    padding:22px;
    border-radius:18px;
    background:linear-gradient(145deg,#081426,#050c18);
    border:1px solid rgba(255,255,255,.08);
}

.card small{
    color:#8190a5;
    font-size:9px;
    font-weight:900;
}

.card strong{
    display:block;
    margin-top:10px;
    font-size:25px;
}

.green{
    color:#42e6a4;
}

.blue{
    color:#00c8ff;
}

.red{
    color:#ff5577;
}

/* ORDERS */

.orders{
    margin-top:25px;
    overflow:hidden;
    border-radius:18px;
    background:#071120;
    border:1px solid rgba(255,255,255,.08);
}

.ordersHeader{
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.order{
    padding:20px;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 2fr;
    gap:15px;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.order:last-child{
    border-bottom:0;
}

.orderId{
    color:#00c8ff;
    font-weight:1000;
    font-size:12px;
}

.info{
    margin-top:5px;
    color:#8190a5;
    font-size:10px;
}

.status{
    display:inline-block;
    padding:7px 10px;
    border-radius:8px;
    background:#142136;
    font-size:8px;
    font-weight:1000;
}

.status.PAID{
    color:#42e6a4;
    background:rgba(66,230,164,.1);
}

.status.NEW{
    color:#5edcff;
    background:rgba(0,200,255,.1);
}

.status.CANCELLED{
    color:#ff6c85;
    background:rgba(255,80,110,.1);
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.smallBtn{
    padding:8px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.09);
    background:#0b182a;
    color:white;
    font-size:8px;
    font-weight:1000;
}

.smallBtn:hover{
    background:#15253d;
}

.printBtn{
    background:linear-gradient(100deg,#0077ff,#713cff);
    border:0;
}

.empty{
    padding:50px;
    text-align:center;
    color:#8190a5;
    font-size:11px;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:100;
    padding:13px 18px;
    border-radius:12px;
    color:white;
    background:#102038;
    border:1px solid rgba(0,200,255,.2);
    transform:translate(-50%,30px);
    opacity:0;
    transition:.25s;
    pointer-events:none;
    font-size:10px;
    font-weight:900;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* PRINT LABEL */

#printArea{
    display:none;
}

.shippingLabel{
    width:100%;
    max-width:800px;
    margin:auto;
    padding:35px;
    color:#000;
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.shippingHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:20px;
    border-bottom:3px solid #000;
}

.shippingLogo{
    font-size:28px;
    font-weight:1000;
}

.shippingLogo span{
    color:#008cff;
}

.shippingType{
    font-size:16px;
    font-weight:900;
}

.labelSection{
    margin-top:25px;
}

.labelTitle{
    font-size:12px;
    font-weight:900;
    margin-bottom:8px;
    text-transform:uppercase;
}

.labelBox{
    border:2px solid #000;
    padding:18px;
    min-height:80px;
    font-size:17px;
    line-height:1.5;
}

.labelRow{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.labelBarcode{
    margin:30px auto 10px;
    width:90%;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:35px;
    letter-spacing:7px;
    font-family:"Courier New",monospace;
    border:2px solid #000;
}

.tracking{
    text-align:center;
    font-size:18px;
    font-weight:1000;
}

.printInfo{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid #aaa;
    font-size:11px;
}

/* RESPONSIVE */

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .order{
        grid-template-columns:1fr;
    }

}

@media(max-width:550px){

    .cards{
        grid-template-columns:1fr;
    }

    .heading{
        align-items:flex-start;
        flex-direction:column;
    }

    .labelRow{
        grid-template-columns:1fr;
    }

}

/* PRINT */

@media print{

    body > *{
        display:none!important;
    }

    #printArea{
        display:block!important;
    }

    @page{
        size:A4;
        margin:10mm;
    }

}

</style>
</head>

<body>

<header class="top">

    <div class="logo">
        Printerlase<span>3D</span> ADMIN
    </div>

    <a href="/" class="back">
        ← SKLEP
    </a>

</header>


<!-- LOGIN -->

<div id="loginScreen" class="login">

    <h1>🔐 Panel Admin</h1>

    <p class="muted">
        Zaloguj się do panelu administratora.
    </p>

    <div class="field">

        <label>
            HASŁO ADMINA
        </label>

        <input
            id="adminPassword"
            type="password"
            placeholder="Hasło..."
            autocomplete="current-password"
        >

    </div>

    <button
        class="btn"
        onclick="login()"
    >
        ZALOGUJ
    </button>

    <div
        id="loginError"
        class="error"
    ></div>

</div>


<!-- DASHBOARD -->

<main id="dashboard">

<div class="container">

    <div class="heading">

        <div>

            <h1>
                📊 Dashboard
            </h1>

            <p class="muted">
                Zarządzaj sklepem Printerlase3D.
            </p>

        </div>

        <button
            class="btn"
            onclick="loadDashboard()"
        >
            ↻ ODŚWIEŻ
        </button>

    </div>


    <!-- STATYSTYKI -->

    <section class="cards">

        <div class="card">

            <small>
                💰 SALDO
            </small>

            <strong
                id="balance"
                class="green"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                📦 ZAMÓWIENIA
            </small>

            <strong id="ordersCount">
                0
            </strong>

        </div>


        <div class="card">

            <small>
                💵 ZAROBIONE
            </small>

            <strong
                id="earned"
                class="blue"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                💸 WYPŁACONO
            </small>

            <strong
                id="withdrawn"
                class="red"
            >
                0,00 zł
            </strong>

        </div>

    </section>


    <!-- ZAMÓWIENIA -->

    <section class="orders">

        <div class="ordersHeader">

            <h2>
                📦 Zamówienia
            </h2>

            <span
                id="lastUpdate"
                class="muted"
            ></span>

        </div>

        <div id="ordersList"></div>

    </section>

</div>

</main>


<div id="toast" class="toast"></div>


<!-- DRUKOWANA ETYKIETA -->

<div id="printArea"></div>


<script>

let adminPassword = "";
let orders = [];


/* =========================
   POMOCNICZE
========================= */

function money(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".", ",") +
        " zł";

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   LOGIN
========================= */

async function login(){

    const password =
        document
        .getElementById("adminPassword")
        .value
        .trim();

    if(!password){

        document
        .getElementById("loginError")
        .textContent =
            "Podaj hasło.";

        return;

    }

    adminPassword = password;

    try{

        const response =
            await fetch(
                "/api/admin/dashboard",
                {
                    headers:{
                        "x-admin-password":
                            adminPassword
                    }
                }
            );

        if(!response.ok){

            throw new Error();

        }

        const data =
            await response.json();

        document
        .getElementById("loginScreen")
        .style.display =
            "none";

        document
        .getElementById("dashboard")
        .style.display =
            "block";

        renderDashboard(data);

    }
    catch{

        adminPassword = "";

        document
        .getElementById("loginError")
        .textContent =
            "❌ Błędne hasło administratora.";

    }

}


/* =========================
   DASHBOARD
========================= */

async function loadDashboard(){

    try{

        const response =
            await fetch(
                "/api/admin/dashboard",
                {
                    headers:{
                        "x-admin-password":
                            adminPassword
                    }
                }
            );

        if(response.status === 401){

            location.reload();

            return;

        }

        if(!response.ok){

            throw new Error();

        }

        const data =
            await response.json();

        renderDashboard(data);

    }
    catch{

        showToast(
            "❌ Nie udało się pobrać danych."
        );

    }

}


function renderDashboard(data){

    orders =
        Array.isArray(data.orders)
            ? data.orders
            : [];

    document
    .getElementById("balance")
    .textContent =
        money(data.balance);

    document
    .getElementById("ordersCount")
    .textContent =
        orders.length;

    document
    .getElementById("earned")
    .textContent =
        money(data.earned);

    document
    .getElementById("withdrawn")
    .textContent =
        money(data.withdrawn);

    document
    .getElementById("lastUpdate")
    .textContent =
        "Aktualizacja: " +
        new Date()
        .toLocaleTimeString("pl-PL");

    renderOrders();

}


/* =========================
   ORDERS
========================= */

function renderOrders(){

    const box =
        document
        .getElementById("ordersList");

    if(!orders.length){

        box.innerHTML = `
            <div class="empty">
                Brak zamówień.
            </div>
        `;

        return;

    }

    box.innerHTML =
        orders
        .slice()
        .reverse()
        .map(order => {

            const status =
                order.status ||
                "NEW";

            return `

                <div class="order">

                    <div>

                        <div class="orderId">
                            ${escapeHTML(order.id)}
                        </div>

                        <div class="info">
                            👤
                            ${escapeHTML(order.name)}
                        </div>

                        <div class="info">
                            ✉️
                            ${escapeHTML(order.email)}
                        </div>

                        ${
                            order.phone
                            ? `
                                <div class="info">
                                    📞
                                    ${escapeHTML(order.phone)}
                                </div>
                            `
                            : ""
                        }

                    </div>


                    <div>

                        <strong>
                            ${money(order.total)}
                        </strong>

                        <div class="info">

                            ${
                                order.createdAt
                                ? new Date(
                                    order.createdAt
                                  ).toLocaleString(
                                    "pl-PL"
                                  )
                                : "—"
                            }

                        </div>

                    </div>


                    <div>

                        <span
                            class="status ${escapeHTML(status)}"
                        >
                            ${escapeHTML(status)}
                        </span>

                    </div>


                    <div class="actions">

                        ${
                            status !== "PAID"
                            ? `
                                <button
                                    class="smallBtn"
                                    onclick="changeStatus(
                                        '${escapeHTML(order.id)}',
                                        'PAID'
                                    )"
                                >
                                    ✓ OPŁACONE
                                </button>
                            `
                            : ""
                        }


                        ${
                            status !== "CANCELLED"
                            ? `
                                <button
                                    class="smallBtn"
                                    onclick="changeStatus(
                                        '${escapeHTML(order.id)}',
                                        'CANCELLED'
                                    )"
                                >
                                    ✕ ANULUJ
                                </button>
                            `
                            : ""
                        }


                        <button
                            class="smallBtn printBtn"
                            onclick="generateLabel(
                                '${escapeHTML(order.id)}'
                            )"
                        >
                            📦 GENERUJ ETYKIETĘ
                        </button>

                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================
   STATUS
========================= */

async function changeStatus(id,status){

    try{

        const response =
            await fetch(
                "/api/admin/order-status",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "x-admin-password":
                            adminPassword
                    },

                    body:JSON.stringify({
                        id,
                        status
                    })

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd"
            );

        }

        showToast(
            status === "PAID"
                ? "✓ Zamówienie opłacone."
                : "✓ Zamówienie anulowane."
        );

        loadDashboard();

    }
    catch(error){

        showToast(
            "❌ " +
            error.message
        );

    }

}


/* =========================
   GENEROWANIE ETYKIETY
========================= */

function generateLabel(id){

    const order =
        orders.find(
            item => item.id === id
        );

    if(!order){

        showToast(
            "❌ Nie znaleziono zamówienia."
        );

        return;

    }


    const address =
        order.address ||
        order.shippingAddress ||
        order.deliveryAddress ||
        "Brak adresu";


    const city =
        order.city ||
        "";


    const postal =
        order.postalCode ||
        order.zip ||
        order.postcode ||
        "";


    const country =
        order.country ||
        "Polska";


    /*
       Prosty numer etykiety.
       Nie jest to numer prawdziwej
       przesyłki przewoźnika.
    */

    const tracking =
        "PL3D-" +
        String(order.id)
        .replace(/[^a-zA-Z0-9]/g,"")
        .slice(-10);


    /*
       Wizualny kod kreskowy.
       Prawdziwy kod przewoźnika
       wymaga API kuriera.
    */

    let barcode = "";

    for(let i = 0; i < tracking.length * 2; i++){

        barcode +=
            i % 2 === 0
                ? "||||"
                : "||";

    }


    document
    .getElementById("printArea")
    .innerHTML = `

        <div class="shippingLabel">

            <div class="shippingHeader">

                <div class="shippingLogo">
                    Printerlase<span>3D</span>
                </div>

                <div class="shippingType">
                    PRZESYŁKA
                </div>

            </div>


            <div class="labelSection">

                <div class="labelTitle">
                    ODBIORCA
                </div>

                <div class="labelBox">

                    <strong>
                        ${escapeHTML(order.name)}
                    </strong>

                    <br>

                    ${escapeHTML(address)}

                    <br>

                    ${escapeHTML(postal)}
                    ${escapeHTML(city)}

                    <br>

                    ${escapeHTML(country)}

                </div>

            </div>


            <div class="labelRow">

                <div class="labelSection">

                    <div class="labelTitle">
                        E-MAIL
                    </div>

                    <div class="labelBox">
                        ${escapeHTML(order.email)}
                    </div>

                </div>


                <div class="labelSection">

                    <div class="labelTitle">
                        TELEFON
                    </div>

                    <div class="labelBox">
                        ${escapeHTML(
                            order.phone ||
                            "Brak"
                        )}
                    </div>

                </div>

            </div>


            <div class="labelSection">

                <div class="labelTitle">
                    NUMER ZAMÓWIENIA
                </div>

                <div class="labelBox">

                    ${escapeHTML(order.id)}

                </div>

            </div>


            <div class="labelBarcode">
                ${barcode}
            </div>


            <div class="tracking">
                ${tracking}
            </div>


            <div class="printInfo">

                Printerlase3D —
                etykieta przygotowana
                ${new Date()
                    .toLocaleString("pl-PL")}

            </div>

        </div>

    `;


    /*
       Otwórz drukowanie
    */

    window.print();

}


/* =========================
   TOAST
========================= */

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () =>
                toast.classList.remove(
                    "show"
                ),
            3000
        );

}


/* =========================
   ENTER
========================= */

document
.getElementById("adminPassword")
.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            login();

        }

    }
);

</script>

</body>
</html>
```
