<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Printerlase3D — Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 10% 0%,
            #004cff22,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            #7b2cff22,
            transparent 30%
        ),
        #030712;

    color:white;
    font-family:Arial,sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

header{
    height:70px;
    padding:0 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:
        1px solid #ffffff12;

    background:#030712dd;
    backdrop-filter:blur(15px);
}

.logo{
    font-size:20px;
    font-weight:900;
}

.logo span{
    color:#00c8ff;
}

.container{
    width:min(1200px,92%);
    margin:35px auto 80px;
}

.login{
    width:min(420px,92%);
    margin:120px auto;
    padding:30px;

    border:
        1px solid #ffffff12;

    border-radius:22px;

    background:#071120;

    box-shadow:
        0 30px 100px #0008;
}

.login h1{
    margin-bottom:10px;
}

.muted{
    color:#8190a5;
    font-size:12px;
    line-height:1.6;
}

.field{
    margin-top:18px;
}

label{
    display:block;
    margin-bottom:7px;

    color:#8d9caf;

    font-size:10px;
    font-weight:900;
}

input,
select{
    width:100%;
    padding:13px;

    color:white;
    background:#030a14;

    border:
        1px solid #ffffff12;

    border-radius:10px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#00c8ff66;
}

.btn{
    border:0;
    border-radius:10px;

    padding:13px 18px;

    color:white;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #713cff
        );

    font-size:10px;
    font-weight:900;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.login .btn{
    width:100%;
    margin-top:20px;
}

.error{
    margin-top:12px;
    color:#ff5577;
    font-size:11px;
}

#dashboard{
    display:none;
}

.topline{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;

    margin-bottom:25px;
}

.topline h1{
    font-size:35px;
}

.cards{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.card{
    padding:22px;

    border:
        1px solid #ffffff10;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #081426,
            #050c18
        );
}

.card small{
    color:#8190a5;
    font-size:9px;
    font-weight:900;
}

.card strong{
    display:block;
    margin-top:10px;
    font-size:25px;
}

.green{
    color:#42e6a4;
}

.blue{
    color:#00c8ff;
}

.red{
    color:#ff5577;
}

.orders,
.withdrawals{
    margin-top:25px;

    overflow:hidden;

    border:
        1px solid #ffffff10;

    border-radius:18px;

    background:#071120;
}

.sectionHead{
    padding:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:
        1px solid #ffffff10;
}

.order,
.withdrawal{
    padding:18px 20px;

    display:grid;

    grid-template-columns:
        1fr 150px 130px 170px;

    gap:15px;

    align-items:center;

    border-bottom:
        1px solid #ffffff0d;
}

.order:last-child,
.withdrawal:last-child{
    border-bottom:0;
}

.order strong,
.withdrawal strong{
    font-size:11px;
}

.order span,
.withdrawal span{
    display:block;

    margin-top:5px;

    color:#8190a5;

    font-size:9px;
}

.status{
    display:inline-block;

    padding:7px 9px;

    border-radius:8px;

    background:#132238;

    color:#9eafc5;

    font-size:8px;

    font-weight:900;
}

.PAID,
.COMPLETED{
    color:#42e6a4;
    background:#42e6a415;
}

.NEW,
.PENDING{
    color:#5edcff;
    background:#00c8ff12;
}

.CANCELLED{
    color:#ff6c85;
    background:#ff557712;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.smallBtn{
    padding:8px 10px;

    color:white;

    background:#0b182a;

    border:
        1px solid #ffffff12;

    border-radius:7px;

    font-size:8px;
    font-weight:900;
}

.smallBtn:hover{
    border-color:#00c8ff55;
}

.empty{
    padding:50px;

    text-align:center;

    color:#8190a5;

    font-size:11px;
}

.withdrawBox{
    margin-top:25px;
    padding:25px;

    border:
        1px solid #42e6a422;

    border-radius:20px;

    background:#071120;
}

.withdrawGrid{
    margin-top:18px;

    display:grid;

    grid-template-columns:
        1fr 1fr auto;

    gap:12px;

    align-items:end;
}

.withdrawGrid .field{
    margin:0;
}

.logout{
    padding:10px 14px;

    border:
        1px solid #ffffff12;

    border-radius:9px;

    background:#091527;

    color:white;

    font-size:10px;
    font-weight:900;
}

.toast{
    position:fixed;

    bottom:25px;
    left:50%;

    padding:13px 18px;

    border-radius:12px;

    background:#102038;

    border:
        1px solid #00c8ff33;

    transform:
        translate(-50%,30px);

    opacity:0;

    transition:.25s;

    pointer-events:none;

    font-size:10px;
    font-weight:900;
}

.toast.show{
    opacity:1;
    transform:
        translate(-50%,0);
}

@media(max-width:850px){

    .cards{
        grid-template-columns:
            repeat(2,1fr);
    }

    .withdrawGrid{
        grid-template-columns:1fr;
    }

    .order,
    .withdrawal{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){

    .cards{
        grid-template-columns:1fr;
    }

    .topline{
        flex-direction:column;
        align-items:start;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Printerlase<span>3D</span> ADMIN
    </div>

    <button
        class="logout"
        onclick="logout()"
    >
        WYLOGUJ
    </button>

</header>


<section id="loginScreen"
class="login">

    <h1>🔐 Panel administratora</h1>

    <p class="muted">
        Dostęp tylko dla administratora.
    </p>

    <div class="field">

        <label>HASŁO</label>

        <input
            id="password"
            type="password"
            placeholder="Wpisz hasło"
            autocomplete="current-password"
        >

    </div>

    <button
        class="btn"
        onclick="login()"
    >
        ZALOGUJ
    </button>

    <div
        id="loginError"
        class="error"
    ></div>

</section>


<main
id="dashboard"
class="container">

    <div class="topline">

        <div>

            <h1>📊 Dashboard</h1>

            <p class="muted">
                Centrum zarządzania Printerlase3D.
            </p>

        </div>

        <button
            class="btn"
            onclick="loadDashboard()"
        >
            ↻ ODŚWIEŻ
        </button>

    </div>


    <section class="cards">

        <div class="card">

            <small>SALDO</small>

            <strong
                id="balance"
                class="green"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>ZAMÓWIENIA</small>

            <strong id="ordersCount">
                0
            </strong>

        </div>


        <div class="card">

            <small>ZAROBIONE</small>

            <strong
                id="earned"
                class="blue"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>WYPŁACONE</small>

            <strong
                id="withdrawn"
                class="red"
            >
                0,00 zł
            </strong>

        </div>

    </section>


    <section class="withdrawBox">

        <h2>💸 Wypłata</h2>

        <p class="muted">
            Tworzy żądanie wypłaty.
        </p>

        <div class="withdrawGrid">

            <div class="field">

                <label>KWOTA</label>

                <input
                    id="withdrawAmount"
                    type="number"
                    min="1"
                    step="0.01"
                    placeholder="25.00"
                >

            </div>


            <div class="field">

                <label>METODA</label>

                <select id="withdrawMethod">

                    <option value="bank">
                        🏦 Konto bankowe
                    </option>

                    <option value="blik">
                        📱 BLIK
                    </option>

                </select>

            </div>


            <button
                class="btn"
                onclick="withdraw()"
            >
                💸 WYPŁAĆ
            </button>

        </div>

    </section>


    <section class="orders">

        <div class="sectionHead">

            <h2>📦 Zamówienia</h2>

            <span
                id="update"
                class="muted"
            ></span>

        </div>

        <div id="ordersList"></div>

    </section>


    <section class="withdrawals">

        <div class="sectionHead">

            <h2>💸 Wypłaty</h2>

        </div>

        <div id="withdrawalsList"></div>

    </section>

</main>


<div
id="toast"
class="toast">
</div>


<script>

function money(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".", ",") +
        " zł";
}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


async function login(){

    const password =
        document
        .getElementById("password")
        .value;

    if(!password){

        showLoginError(
            "Podaj hasło."
        );

        return;
    }

    try{

        const response =
            await fetch(
                "/api/admin/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            password
                        })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błędne hasło."
            );
        }

        document
            .getElementById(
                "loginScreen"
            )
            .style.display = "none";

        document
            .getElementById(
                "dashboard"
            )
            .style.display = "block";

        await loadDashboard();

    }catch(error){

        showLoginError(
            "❌ " +
            error.message
        );
    }
}


async function checkSession(){

    try{

        const response =
            await fetch(
                "/api/admin/me"
            );

        const data =
            await response.json();

        if(data.authenticated){

            document
                .getElementById(
                    "loginScreen"
                )
                .style.display =
                "none";

            document
                .getElementById(
                    "dashboard"
                )
                .style.display =
                "block";

            await loadDashboard();
        }

    }catch(error){

        console.error(error);

    }
}


async function loadDashboard(){

    try{

        const response =
            await fetch(
                "/api/admin/dashboard"
            );

        if(response.status === 401){

            document
                .getElementById(
                    "dashboard"
                )
                .style.display =
                "none";

            document
                .getElementById(
                    "loginScreen"
                )
                .style.display =
                "block";

            return;
        }

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd serwera."
            );
        }

        document
            .getElementById(
                "balance"
            )
            .textContent =
            money(data.balance);

        document
            .getElementById(
                "earned"
            )
            .textContent =
            money(data.earned);

        document
            .getElementById(
                "withdrawn"
            )
            .textContent =
            money(data.withdrawn);

        document
            .getElementById(
                "ordersCount"
            )
            .textContent =
            data.orders.length;

        document
            .getElementById(
                "update"
            )
            .textContent =
            "Aktualizacja: " +
            new Date()
                .toLocaleTimeString(
                    "pl-PL"
                );

        renderOrders(
            data.orders
        );

        renderWithdrawals(
            data.withdrawals
        );

    }catch(error){

        showToast(
            "❌ " +
            error.message
        );
    }
}


function renderOrders(orders){

    const box =
        document.getElementById(
            "ordersList"
        );

    if(!orders.length){

        box.innerHTML =
            `<div class="empty">
                Brak zamówień.
            </div>`;

        return;
    }

    box.innerHTML =
        [...orders]
        .reverse()
        .map(order => {

            const status =
                order.status ||
                "NEW";

            return `
                <div class="order">

                    <div>

                        <strong>
                            ${escapeHTML(
                                order.id
                            )}
                        </strong>

                        <span>
                            👤
                            ${escapeHTML(
                                order.name
                            )}
                        </span>

                        <span>
                            ✉️
                            ${escapeHTML(
                                order.email
                            )}
                        </span>

                    </div>


                    <div>

                        <strong>
                            ${money(
                                order.total
                            )}
                        </strong>

                        <span>
                            ${new Date(
                                order.createdAt
                            ).toLocaleString(
                                "pl-PL"
                            )}
                        </span>

                    </div>


                    <div>

                        <span
                            class="status ${escapeHTML(
                                status
                            )}"
                        >
                            ${escapeHTML(
                                status
                            )}
                        </span>

                    </div>


                    <div class="actions">

                        ${
                            status !== "PAID"
                            ? `
                                <button
                                    class="smallBtn"
                                    onclick="setOrderStatus(
                                        '${escapeHTML(
                                            order.id
                                        )}',
                                        'PAID'
                                    )"
                                >
                                    ✓ OPŁACONE
                                </button>
                            `
                            : ""
                        }


                        ${
                            status !== "CANCELLED"
                            ? `
                                <button
                                    class="smallBtn"
                                    onclick="setOrderStatus(
                                        '${escapeHTML(
                                            order.id
                                        )}',
                                        'CANCELLED'
                                    )"
                                >
                                    ✕ ANULUJ
                                </button>
                            `
                            : ""
                        }

                    </div>

                </div>
            `;

        })
        .join("");
}


function renderWithdrawals(
    withdrawals
){

    const box =
        document.getElementById(
            "withdrawalsList"
        );

    if(!withdrawals.length){

        box.innerHTML =
            `<div class="empty">
                Brak wypłat.
            </div>`;

        return;
    }

    box.innerHTML =
        [...withdrawals]
        .reverse()
        .map(item => {

            return `
                <div class="withdrawal">

                    <div>

                        <strong>
                            ${escapeHTML(
                                item.id
                            )}
                        </strong>

                        <span>
                            ${escapeHTML(
                                item.method
                            )}
                        </span>

                    </div>


                    <div>

                        <strong>
                            ${money(
                                item.amount
                            )}
                        </strong>

                        <span>
                            ${new Date(
                                item.createdAt
                            ).toLocaleString(
                                "pl-PL"
                            )}
                        </span>

                    </div>


                    <div>

                        <span
                            class="status ${escapeHTML(
                                item.status
                            )}"
                        >
                            ${escapeHTML(
                                item.status
                            )}
                        </span>

                    </div>


                    <div class="actions">

                        ${
                            item.status === "PENDING"
                            ? `
                                <button
                                    class="smallBtn"
                                    onclick="setWithdrawalStatus(
                                        '${escapeHTML(
                                            item.id
                                        )}',
                                        'COMPLETED'
                                    )"
                                >
                                    ✓ ZREALIZOWANA
                                </button>

                                <button
                                    class="smallBtn"
                                    onclick="setWithdrawalStatus(
                                        '${escapeHTML(
                                            item.id
                                        )}',
                                        'CANCELLED'
                                    )"
                                >
                                    ✕ ANULUJ
                                </button>
                            `
                            : ""
                        }

                    </div>

                </div>
            `;

        })
        .join("");
}


async function setOrderStatus(
    id,
    status
){

    try{

        const response =
            await fetch(
                "/api/admin/order-status",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id,
                            status
                        })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd."
            );
        }

        showToast(
            "✓ Status zamówienia zmieniony."
        );

        loadDashboard();

    }catch(error){

        showToast(
            "❌ " +
            error.message
        );
    }
}


async function setWithdrawalStatus(
    id,
    status
){

    try{

        const response =
            await fetch(
                "/api/admin/withdraw-status",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id,
                            status
                        })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd."
            );
        }

        showToast(
            "✓ Status wypłaty zmieniony."
        );

        loadDashboard();

    }catch(error){

        showToast(
            "❌ " +
            error.message
        );
    }
}


async function withdraw(){

    const amount =
        Number(
            document
            .getElementById(
                "withdrawAmount"
            )
            .value
        );

    const method =
        document
        .getElementById(
            "withdrawMethod"
        )
        .value;

    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showToast(
            "❌ Podaj prawidłową kwotę."
        );

        return;
    }

    try{

        const response =
            await fetch(
                "/api/admin/withdraw",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            amount,
                            method
                        })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd wypłaty."
            );
        }

        document
            .getElementById(
                "withdrawAmount"
            )
            .value = "";

        showToast(
            "✓ Żądanie wypłaty utworzone."
        );

        loadDashboard();

    }catch(error){

        showToast(
            "❌ " +
            error.message
        );
    }
}


async function logout(){

    try{

        await fetch(
            "/api/admin/logout",
            {
                method:"POST"
            }
        );

    }finally{

        location.reload();

    }
}


function showLoginError(
    text
){

    document
        .getElementById(
            "loginError"
        )
        .textContent = text;
}


function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent = text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () =>
                toast.classList.remove(
                    "show"
                ),
            3000
        );
}


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){
                login();
            }

        }
    );


checkSession();

</script>

</body>
</html>
