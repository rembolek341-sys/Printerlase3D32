```html
<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Printerlase3D — Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(0,200,255,.15),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 0%,
            rgba(115,50,255,.18),
            transparent 30%
        ),

        #030712;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.top{
    position:sticky;
    top:0;
    z-index:10;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px 5%;

    background:
        rgba(3,7,18,.85);

    backdrop-filter:
        blur(20px);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.logo{
    font-size:20px;
    font-weight:900;
}

.logo span{
    color:#00c8ff;
}

.back{
    padding:10px 15px;

    color:white;
    text-decoration:none;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:10px;

    background:#091527;

    font-size:11px;
    font-weight:900;
}

.container{
    width:min(1250px,92%);
    margin:35px auto 80px;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;
}

.heading h1{
    margin:0;

    font-size:34px;
}

.muted{
    color:#8290a5;
    font-size:11px;
    line-height:1.6;
}

.btn{
    padding:12px 17px;

    border:0;
    border-radius:10px;

    color:white;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #713cff
        );

    font-size:10px;
    font-weight:900;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.cards{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.card{
    padding:22px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #081426,
            #050c18
        );
}

.card small{
    color:#8190a5;

    font-size:9px;
    font-weight:900;
}

.card strong{
    display:block;

    margin-top:10px;

    font-size:26px;
}

.green{
    color:#42e6a4;
}

.blue{
    color:#00c8ff;
}

.red{
    color:#ff5577;
}

.yellow{
    color:#ffd34d;
}

.box{
    margin-top:22px;

    padding:25px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:20px;

    background:#071120;
}

.box h2{
    margin:0 0 5px;
    font-size:20px;
}

.withdrawGrid{
    display:grid;

    grid-template-columns:
        1fr 1fr auto;

    gap:12px;

    margin-top:18px;

    align-items:end;
}

.field label{
    display:block;

    margin-bottom:7px;

    color:#9aa8ba;

    font-size:9px;
    font-weight:900;
}

.field input,
.field select{
    width:100%;

    padding:13px;

    outline:none;

    color:white;

    background:#030a14;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:10px;
}

.orders{
    margin-top:25px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:18px;

    background:#071120;
}

.ordersHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.ordersHeader h2{
    margin:0;
    font-size:18px;
}

.order{
    display:grid;

    grid-template-columns:
        1fr 150px 130px 180px;

    gap:15px;

    align-items:center;

    padding:18px 20px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.order:last-child{
    border-bottom:0;
}

.order strong{
    font-size:11px;
}

.order span{
    display:block;

    margin-top:5px;

    color:#8190a5;

    font-size:9px;
}

.status{
    display:inline-block;

    padding:7px 9px;

    border-radius:8px;

    background:#132238;

    color:#9eafc5;

    font-size:8px;
    font-weight:900;
}

.status.PAID{
    color:#42e6a4;
    background:rgba(66,230,164,.1);
}

.status.NEW{
    color:#5edcff;
    background:rgba(0,200,255,.08);
}

.status.CANCELLED{
    color:#ff6c85;
    background:rgba(255,80,110,.08);
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.smallBtn{
    padding:8px 10px;

    color:white;

    background:#0b182a;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:8px;

    font-size:8px;
    font-weight:900;
}

.smallBtn:hover{
    background:#12243b;
}

.empty{
    padding:50px;

    text-align:center;

    color:#8190a5;

    font-size:11px;
}

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    z-index:100;

    padding:13px 18px;

    border-radius:12px;

    color:white;

    background:#102038;

    border:
        1px solid
        rgba(0,200,255,.25);

    transform:
        translate(-50%,30px);

    opacity:0;

    pointer-events:none;

    transition:.25s;

    font-size:10px;
    font-weight:900;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

@media(max-width:900px){

    .cards{
        grid-template-columns:
            repeat(2,1fr);
    }

    .withdrawGrid{
        grid-template-columns:1fr;
    }

    .order{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){

    .cards{
        grid-template-columns:1fr;
    }

    .heading{
        align-items:flex-start;
        flex-direction:column;
        gap:15px;
    }
}

</style>

</head>

<body>

<header class="top">

    <div class="logo">
        Printerlase<span>3D</span> ADMIN
    </div>

    <a
        class="back"
        href="/"
    >
        ← SKLEP
    </a>

</header>


<main class="container">

    <div class="heading">

        <div>

            <h1>
                📊 Panel Admin
            </h1>

            <p class="muted">
                Zarządzaj swoim sklepem Printerlase3D.
            </p>

        </div>

        <button
            class="btn"
            onclick="loadDashboard()"
        >
            ↻ ODŚWIEŻ
        </button>

    </div>


    <section class="cards">

        <div class="card">

            <small>
                💰 DOSTĘPNE SALDO
            </small>

            <strong
                id="balance"
                class="green"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                📦 ZAMÓWIENIA
            </small>

            <strong id="ordersCount">
                0
            </strong>

        </div>


        <div class="card">

            <small>
                💵 ZAROBIONE
            </small>

            <strong
                id="earned"
                class="blue"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                💸 WYPŁACONO
            </small>

            <strong
                id="withdrawn"
                class="red"
            >
                0,00 zł
            </strong>

        </div>

    </section>


    <section class="box">

        <h2>
            💸 Wypłata
        </h2>

        <p class="muted">
            Tworzy żądanie wypłaty w panelu.
        </p>


        <div class="withdrawGrid">

            <div class="field">

                <label>
                    KWOTA
                </label>

                <input
                    id="withdrawAmount"
                    type="number"
                    min="0.01"
                    step="0.01"
                    placeholder="25.00"
                >

            </div>


            <div class="field">

                <label>
                    METODA
                </label>

                <select id="withdrawMethod">

                    <option value="bank">
                        🏦 Konto bankowe
                    </option>

                    <option value="blik">
                        📱 BLIK
                    </option>

                </select>

            </div>


            <button
                class="btn"
                onclick="withdraw()"
            >
                💸 WYPŁAĆ
            </button>

        </div>

    </section>


    <section class="orders">

        <div class="ordersHeader">

            <h2>
                📦 Zamówienia
            </h2>

            <span
                id="lastUpdate"
                class="muted"
            ></span>

        </div>

        <div id="ordersList"></div>

    </section>


    <section class="box">

        <h2>
            💸 Historia wypłat
        </h2>

        <div id="withdrawalsList"></div>

    </section>

</main>


<div
    id="toast"
    class="toast"
></div>


<script>

function money(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".", ",")
        + " zł";
}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


async function loadDashboard(){

    try{

        const response =
            await fetch(
                "/api/admin/dashboard"
            );

        if(!response.ok){

            throw new Error(
                "Serwer zwrócił błąd."
            );

        }

        const data =
            await response.json();

        renderDashboard(data);

    }catch(error){

        showToast(
            "❌ Nie udało się połączyć z serwerem."
        );

        console.error(error);
    }
}


function renderDashboard(data){

    document
        .getElementById("balance")
        .textContent =
        money(data.balance);


    document
        .getElementById("ordersCount")
        .textContent =
        data.orders.length;


    document
        .getElementById("earned")
        .textContent =
        money(data.earned);


    document
        .getElementById("withdrawn")
        .textContent =
        money(data.withdrawn);


    document
        .getElementById("lastUpdate")
        .textContent =
        "Aktualizacja: " +
        new Date()
            .toLocaleTimeString("pl-PL");


    renderOrders(data.orders);

    renderWithdrawals(
        data.withdrawals
    );
}


function renderOrders(orders){

    const box =
        document.getElementById(
            "ordersList"
        );


    if(!orders.length){

        box.innerHTML = `
            <div class="empty">
                📦 Brak zamówień.
            </div>
        `;

        return;
    }


    box.innerHTML =
        [...orders]
        .reverse()
        .map(order => {

            const status =
                order.status || "NEW";


            return `
                <div class="order">

                    <div>

                        <strong>
                            ${escapeHTML(order.id)}
                        </strong>

                        <span>
                            👤
                            ${escapeHTML(order.name)}
                        </span>

                        <span>
                            ✉️
                            ${escapeHTML(order.email)}
                        </span>

                    </div>


                    <div>

                        <strong>
                            ${money(order.total)}
                        </strong>

                        <span>
                            ${
                                order.createdAt
                                ? new Date(
                                    order.createdAt
                                  ).toLocaleString(
                                    "pl-PL"
                                  )
                                : "-"
                            }
                        </span>

                    </div>


                    <div>

                        <span
                            class="status ${escapeHTML(status)}"
                        >
                            ${escapeHTML(status)}
                        </span>

                    </div>


                    <div class="actions">

                        ${
                            status !== "PAID"
                            ? `
                                <button
                                    class="smallBtn"
                                    onclick="setOrderStatus(
                                        '${escapeHTML(order.id)}',
                                        'PAID'
                                    )"
                                >
                                    ✓ OPŁACONE
                                </button>
                            `
                            : ""
                        }


                        ${
                            status !== "CANCELLED"
                            ? `
                                <button
                                    class="smallBtn"
                                    onclick="setOrderStatus(
                                        '${escapeHTML(order.id)}',
                                        'CANCELLED'
                                    )"
                                >
                                    ✕ ANULUJ
                                </button>
                            `
                            : ""
                        }

                    </div>

                </div>
            `;

        })
        .join("");
}


function renderWithdrawals(withdrawals){

    const box =
        document.getElementById(
            "withdrawalsList"
        );


    if(!withdrawals.length){

        box.innerHTML = `
            <div class="empty">
                💸 Brak wypłat.
            </div>
        `;

        return;
    }


    box.innerHTML =
        [...withdrawals]
        .reverse()
        .map(item => {

            return `
                <div class="order">

                    <div>

                        <strong>
                            ${escapeHTML(item.id)}
                        </strong>

                        <span>
                            Metoda:
                            ${escapeHTML(item.method)}
                        </span>

                    </div>


                    <div>

                        <strong>
                            ${money(item.amount)}
                        </strong>

                        <span>
                            ${
                                item.createdAt
                                ? new Date(
                                    item.createdAt
                                  ).toLocaleString(
                                    "pl-PL"
                                  )
                                : "-"
                            }
                        </span>

                    </div>


                    <div>

                        <span class="status">
                            ${escapeHTML(item.status)}
                        </span>

                    </div>

                </div>
            `;

        })
        .join("");
}


async function setOrderStatus(
    id,
    status
){

    try{

        const response =
            await fetch(
                "/api/admin/order-status",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        id,
                        status
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Nie udało się zmienić statusu."
            );
        }


        showToast(
            status === "PAID"
            ? "✓ Zamówienie opłacone."
            : "✓ Zamówienie anulowane."
        );


        loadDashboard();

    }catch(error){

        showToast(
            "❌ " + error.message
        );
    }
}


async function withdraw(){

    const amount =
        Number(
            document
                .getElementById(
                    "withdrawAmount"
                )
                .value
        );


    const method =
        document
            .getElementById(
                "withdrawMethod"
            )
            .value;


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showToast(
            "❌ Podaj prawidłową kwotę."
        );

        return;
    }


    try{

        const response =
            await fetch(
                "/api/admin/withdraw",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        amount,
                        method
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd wypłaty."
            );
        }


        document
            .getElementById(
                "withdrawAmount"
            )
            .value = "";


        showToast(
            "✓ Żądanie wypłaty utworzone."
        );


        loadDashboard();

    }catch(error){

        showToast(
            "❌ " + error.message
        );
    }
}


function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () =>
                toast.classList.remove(
                    "show"
                ),
            3000
        );
}


loadDashboard();

</script>

</body>

</html>
```
