<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Printerlase3D — Admin</title>

<style>

:root{
    --bg:#030712;
    --panel:#071120;
    --panel2:#0b1728;
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#8190a5;
    --blue:#00c8ff;
    --purple:#713cff;
    --green:#42e6a4;
    --red:#ff5577;
    --yellow:#ffd34d;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(0,200,255,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(113,60,255,.14),
            transparent 30%
        ),
        var(--bg);

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.top{
    position:sticky;
    top:0;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 5%;

    background:rgba(3,7,18,.88);
    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);
}

.logo{
    font-size:22px;
    font-weight:1000;
}

.logo span{
    color:var(--blue);
}

.back{
    padding:10px 15px;

    border:1px solid var(--border);
    border-radius:10px;

    color:white;
    background:#091527;

    text-decoration:none;

    font-size:11px;
    font-weight:900;
}

.container{
    width:min(1250px,92%);
    margin:35px auto 100px;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;

    margin-bottom:25px;
}

.heading h1{
    font-size:35px;
}

.muted{
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
}

.btn{
    border:0;
    border-radius:11px;

    padding:13px 17px;

    color:white;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #713cff
        );

    font-size:10px;
    font-weight:1000;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,140,255,.2);
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    padding:22px;

    border:1px solid var(--border);
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #081426,
            #050c18
        );
}

.card small{
    color:var(--muted);

    font-size:9px;
    font-weight:900;
}

.card strong{
    display:block;

    margin-top:10px;

    font-size:25px;
}

.green{
    color:var(--green);
}

.blue{
    color:var(--blue);
}

.red{
    color:var(--red);
}

.yellow{
    color:var(--yellow);
}

.search{
    margin-top:25px;

    display:flex;
    gap:10px;
}

.search input{
    flex:1;

    padding:14px;

    outline:none;

    color:white;
    background:#030a14;

    border:1px solid var(--border);
    border-radius:11px;
}

.orders{
    margin-top:20px;

    overflow:hidden;

    border:1px solid var(--border);
    border-radius:18px;

    background:var(--panel);
}

.ordersHeader{
    padding:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid var(--border);
}

.ordersHeader h2{
    font-size:18px;
}

.order{
    padding:20px;

    display:grid;

    grid-template-columns:
        minmax(220px,1fr)
        150px
        130px
        minmax(250px,300px);

    gap:15px;

    align-items:center;

    border-bottom:1px solid var(--border);
}

.order:last-child{
    border-bottom:0;
}

.order strong{
    font-size:12px;
}

.order span{
    display:block;

    margin-top:6px;

    color:var(--muted);

    font-size:9px;
}

.status{
    display:inline-block;

    padding:7px 10px;

    border-radius:8px;

    background:#132238;

    color:#9eafc5;

    font-size:8px !important;
    font-weight:1000;
}

.status.PAID{
    color:var(--green);
    background:rgba(66,230,164,.1);
}

.status.NEW{
    color:#5edcff;
    background:rgba(0,200,255,.08);
}

.status.READY{
    color:var(--yellow);
    background:rgba(255,211,77,.1);
}

.status.SHIPPED{
    color:#c89cff;
    background:rgba(113,60,255,.1);
}

.status.CANCELLED{
    color:var(--red);
    background:rgba(255,80,110,.08);
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.smallBtn{
    padding:8px 10px;

    border:1px solid var(--border);
    border-radius:8px;

    color:white;
    background:#0b182a;

    font-size:8px;
    font-weight:900;

    transition:.15s;
}

.smallBtn:hover{
    background:#14253c;
    transform:translateY(-1px);
}

.labelBtn{
    color:#000;
    background:var(--yellow);
}

.deleteBtn{
    color:white;
    background:#3a1020;
}

.empty{
    padding:60px;

    text-align:center;

    color:var(--muted);

    font-size:12px;
}

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    z-index:100;

    padding:13px 18px;

    border-radius:12px;

    color:white;
    background:#102038;

    border:1px solid rgba(0,200,255,.2);

    transform:translate(-50%,30px);

    opacity:0;

    transition:.25s;

    pointer-events:none;

    font-size:10px;
    font-weight:900;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.withdraw{
    margin-top:25px;

    padding:25px;

    border:1px solid rgba(66,230,164,.15);
    border-radius:20px;

    background:
        radial-gradient(
            circle at 100% 0,
            rgba(66,230,164,.1),
            transparent 35%
        ),
        var(--panel);
}

.withdraw h2{
    font-size:20px;
}

.withdrawGrid{
    margin-top:18px;

    display:grid;

    grid-template-columns:
        1fr
        1fr
        auto;

    gap:12px;

    align-items:end;
}

.field label{
    display:block;

    margin-bottom:7px;

    color:#9aa8ba;

    font-size:9px;
    font-weight:900;
}

.field input,
.field select{
    width:100%;

    padding:13px;

    outline:none;

    color:white;
    background:#030a14;

    border:1px solid var(--border);
    border-radius:10px;
}

@media(max-width:950px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .order{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr;
    }

    .heading{
        align-items:start;
        flex-direction:column;
    }

    .withdrawGrid{
        grid-template-columns:1fr;
    }

    .order{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header class="top">

    <div class="logo">
        Printerlase<span>3D</span> ADMIN
    </div>

    <a class="back" href="/">
        ← SKLEP
    </a>

</header>


<main class="container">

    <div class="heading">

        <div>

            <h1>
                📊 Dashboard
            </h1>

            <p class="muted">
                Panel zarządzania Printerlase3D.
            </p>

        </div>

        <button
            class="btn"
            onclick="loadDashboard()"
        >
            ↻ ODŚWIEŻ
        </button>

    </div>


    <section class="cards">

        <div class="card">

            <small>
                💰 SALDO
            </small>

            <strong
                id="balance"
                class="green"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                📦 ZAMÓWIENIA
            </small>

            <strong id="ordersCount">
                0
            </strong>

        </div>


        <div class="card">

            <small>
                💵 ZAROBIONE
            </small>

            <strong
                id="earned"
                class="blue"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                💸 WYPŁACONO
            </small>

            <strong
                id="withdrawn"
                class="red"
            >
                0,00 zł
            </strong>

        </div>

    </section>


    <div class="search">

        <input
            id="search"
            type="search"
            placeholder="🔎 Szukaj po numerze, imieniu, e-mailu..."
            oninput="renderFilteredOrders()"
        >

        <button
            class="btn"
            onclick="clearSearch()"
        >
            WYCZYŚĆ
        </button>

    </div>


    <section class="orders">

        <div class="ordersHeader">

            <h2>
                📦 Zamówienia
            </h2>

            <span
                id="lastUpdate"
                class="muted"
            ></span>

        </div>

        <div id="ordersList"></div>

    </section>


    <section class="withdraw">

        <h2>
            💸 Wypłata
        </h2>

        <p class="muted">
            Tworzy żądanie wypłaty. Prawdziwy przelew wymaga
            podłączenia operatora płatności.
        </p>

        <div class="withdrawGrid">

            <div class="field">

                <label>
                    KWOTA
                </label>

                <input
                    id="withdrawAmount"
                    type="number"
                    min="1"
                    step="0.01"
                    placeholder="25.00"
                >

            </div>


            <div class="field">

                <label>
                    METODA
                </label>

                <select id="withdrawMethod">

                    <option value="bank">
                        🏦 Konto bankowe
                    </option>

                    <option value="blik">
                        📱 BLIK
                    </option>

                </select>

            </div>


            <button
                class="btn"
                onclick="withdraw()"
            >
                💸 WYPŁAĆ
            </button>

        </div>

    </section>

</main>


<div
    id="toast"
    class="toast"
></div>


<script>

let orders = [];


/* =========================
   FORMATOWANIE
========================= */

function money(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".", ",") + " zł";
}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function getAddress(order){

    const address =
        order.shipping ||
        order.address ||
        {};

    return {

        name:
            address.name ||
            order.name ||
            "",

        street:
            address.street ||
            address.address ||
            order.street ||
            order.addressLine1 ||
            "",

        postalCode:
            address.postalCode ||
            order.postalCode ||
            order.zip ||
            "",

        city:
            address.city ||
            order.city ||
            "",

        country:
            address.country ||
            order.country ||
            "Polska",

        phone:
            address.phone ||
            order.phone ||
            ""

    };

}


/* =========================
   DASHBOARD
========================= */

async function loadDashboard(){

    try{

        const response =
            await fetch("/api/admin/dashboard");

        if(!response.ok){
            throw new Error(
                "Serwer zwrócił błąd."
            );
        }

        const data =
            await response.json();

        orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];

        document
            .getElementById("balance")
            .textContent =
            money(data.balance);

        document
            .getElementById("ordersCount")
            .textContent =
            orders.length;

        document
            .getElementById("earned")
            .textContent =
            money(data.earned);

        document
            .getElementById("withdrawn")
            .textContent =
            money(data.withdrawn);

        document
            .getElementById("lastUpdate")
            .textContent =
            "Aktualizacja: " +
            new Date()
                .toLocaleTimeString("pl-PL");

        renderFilteredOrders();

    }catch(error){

        showToast(
            "❌ Nie udało się pobrać danych."
        );

        console.error(error);
    }

}


/* =========================
   SZUKANIE
========================= */

function clearSearch(){

    document
        .getElementById("search")
        .value = "";

    renderFilteredOrders();

}


function renderFilteredOrders(){

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filtered =
        orders.filter(order => {

            const text =
                JSON.stringify(order)
                    .toLowerCase();

            return text.includes(query);

        });

    renderOrders(filtered);

}


/* =========================
   ZAMÓWIENIA
========================= */

function renderOrders(list){

    const box =
        document.getElementById("ordersList");

    if(!list.length){

        box.innerHTML = `
            <div class="empty">
                📭 Brak zamówień.
            </div>
        `;

        return;
    }

    box.innerHTML =
        list.map(order => {

            const status =
                order.status || "NEW";

            const address =
                getAddress(order);

            return `

<div class="order">

    <div>

        <strong>
            ${escapeHTML(order.id)}
        </strong>

        <span>
            👤 ${escapeHTML(address.name)}
        </span>

        <span>
            ✉️ ${escapeHTML(order.email || "")}
        </span>

        <span>
            📞 ${escapeHTML(address.phone)}
        </span>

        <span>
            🏠 ${escapeHTML(address.street)}
            ${address.postalCode
                ? " • " +
                  escapeHTML(address.postalCode)
                : ""}
            ${address.city
                ? " " +
                  escapeHTML(address.city)
                : ""}
        </span>

    </div>


    <div>

        <strong>
            ${money(order.total)}
        </strong>

        <span>
            ${
                order.createdAt
                    ? new Date(order.createdAt)
                        .toLocaleString("pl-PL")
                    : ""
            }
        </span>

    </div>


    <div>

        <span class="status ${escapeHTML(status)}">
            ${escapeHTML(status)}
        </span>

    </div>


    <div class="actions">

        ${
            status !== "PAID"
            ? `
            <button
                class="smallBtn"
                onclick="setStatus('${escapeHTML(order.id)}','PAID')"
            >
                ✓ OPŁACONE
            </button>
            `
            : ""
        }


        ${
            status !== "READY"
            ? `
            <button
                class="smallBtn"
                onclick="setStatus('${escapeHTML(order.id)}','READY')"
            >
                📦 GOTOWE
            </button>
            `
            : ""
        }


        ${
            status !== "SHIPPED"
            ? `
            <button
                class="smallBtn"
                onclick="setStatus('${escapeHTML(order.id)}','SHIPPED')"
            >
                🚚 WYSŁANE
            </button>
            `
            : ""
        }


        <button
            class="smallBtn labelBtn"
            onclick="generateLabel('${escapeHTML(order.id)}')"
        >
            🏷️ ETYKIETA
        </button>


        ${
            status !== "CANCELLED"
            ? `
            <button
                class="smallBtn"
                onclick="setStatus('${escapeHTML(order.id)}','CANCELLED')"
            >
                ✕ ANULUJ
            </button>
            `
            : ""
        }


        <button
            class="smallBtn deleteBtn"
            onclick="deleteOrder('${escapeHTML(order.id)}')"
        >
            🗑️ USUŃ
        </button>

    </div>

</div>

            `;

        }).join("");

}


/* =========================
   STATUS
========================= */

async function setStatus(id,status){

    try{

        const response =
            await fetch(
                "/api/admin/order-status",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        id,
                        status
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Nie udało się zmienić statusu."
            );

        }

        showToast(
            "✓ Status zmieniony na " +
            status
        );

        loadDashboard();

    }catch(error){

        showToast(
            "❌ " + error.message
        );

    }

}


/* =========================
   ETYKIETA
========================= */

function generateLabel(id){

    const url =
        "/admin/label/" +
        encodeURIComponent(id);

    window.open(
        url,
        "_blank",
        "noopener"
    );

}


/* =========================
   USUWANIE
========================= */

async function deleteOrder(id){

    if(
        !confirm(
            "Na pewno usunąć zamówienie " +
            id +
            "?"
        )
    ){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/admin/order/" +
                encodeURIComponent(id),
                {
                    method:"DELETE"
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Nie udało się usunąć."
            );

        }

        showToast(
            "✓ Zamówienie usunięte."
        );

        loadDashboard();

    }catch(error){

        showToast(
            "❌ " + error.message
        );

    }

}


/* =========================
   WYPIŁATA
========================= */

async function withdraw(){

    const amount =
        Number(
            document
            .getElementById("withdrawAmount")
            .value
        );

    const method =
        document
        .getElementById("withdrawMethod")
        .value;

    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showToast(
            "❌ Podaj prawidłową kwotę."
        );

        return;
    }

    try{

        const response =
            await fetch(
                "/api/admin/withdraw",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        amount,
                        method
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd wypłaty."
            );

        }

        document
            .getElementById("withdrawAmount")
            .value = "";

        showToast(
            "✓ Żądanie wypłaty utworzone."
        );

        loadDashboard();

    }catch(error){

        showToast(
            "❌ " + error.message
        );

    }

}


/* =========================
   TOAST
========================= */

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () =>
                toast.classList.remove("show"),
            3000
        );

}


/* =========================
   START
========================= */

loadDashboard();

setInterval(
    loadDashboard,
    30000
);

</script>

</body>
</html>
