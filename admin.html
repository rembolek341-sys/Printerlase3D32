```html
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printerlase3D — Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 10% 0%,#07334d,transparent 30%),
        radial-gradient(circle at 90% 0%,#24114d,transparent 30%),
        #030712;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.top{
    height:70px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#050b15;
    border-bottom:1px solid #18263a;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#00c8ff;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#0c1829;
    border:1px solid #20314a;
    padding:10px 15px;
    border-radius:10px;
    font-size:11px;
    font-weight:900;
}

/* LOGIN */

.login{
    width:min(420px,94%);
    margin:100px auto;
    padding:30px;
    background:#071120;
    border:1px solid #17263b;
    border-radius:20px;
}

.login h1{
    margin-bottom:8px;
}

.muted{
    color:#8492a7;
    font-size:11px;
    line-height:1.5;
}

.field{
    margin-top:20px;
}

.field label{
    display:block;
    margin-bottom:8px;
    color:#8492a7;
    font-size:10px;
    font-weight:900;
}

.field input{
    width:100%;
    padding:13px;
    color:#fff;
    background:#030812;
    border:1px solid #20304a;
    border-radius:10px;
    outline:none;
}

.btn{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    color:#fff;
    background:linear-gradient(100deg,#008cff,#713cff);
    font-size:10px;
    font-weight:900;
}

.login .btn{
    width:100%;
    margin-top:18px;
}

.error{
    color:#ff5577;
    margin-top:12px;
    font-size:11px;
}

#dashboard{
    display:none;
}

.container{
    width:min(1200px,94%);
    margin:35px auto 80px;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:25px;
}

.heading h1{
    font-size:34px;
}

/* STATYSTYKI */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    padding:22px;
    background:#071120;
    border:1px solid #17263b;
    border-radius:18px;
}

.card small{
    color:#8492a7;
    font-size:9px;
    font-weight:900;
}

.card strong{
    display:block;
    margin-top:10px;
    font-size:25px;
}

.green{
    color:#42e6a4;
}

.blue{
    color:#00c8ff;
}

.red{
    color:#ff5577;
}

/* ZAMÓWIENIA */

.orders{
    margin-top:25px;
    background:#071120;
    border:1px solid #17263b;
    border-radius:18px;
    overflow:hidden;
}

.ordersHeader{
    padding:20px;
    border-bottom:1px solid #17263b;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.order{
    padding:20px;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 2fr;
    gap:15px;
    align-items:center;
    border-bottom:1px solid #17263b;
}

.order:last-child{
    border-bottom:0;
}

.orderId{
    color:#00c8ff;
    font-size:12px;
    font-weight:900;
}

.info{
    margin-top:5px;
    color:#8492a7;
    font-size:10px;
}

.status{
    display:inline-block;
    padding:7px 10px;
    border-radius:8px;
    font-size:8px;
    font-weight:900;
    background:#17263b;
}

.status.PAID{
    color:#42e6a4;
}

.status.NEW{
    color:#00c8ff;
}

.status.CANCELLED{
    color:#ff5577;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.smallBtn{
    padding:8px 11px;
    color:#fff;
    background:#0d1b2e;
    border:1px solid #20304a;
    border-radius:8px;
    font-size:8px;
    font-weight:900;
}

.smallBtn:hover{
    background:#162942;
}

.labelBtn{
    background:linear-gradient(100deg,#008cff,#713cff);
    border:0;
}

.empty{
    padding:50px;
    color:#8492a7;
    text-align:center;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    padding:13px 18px;
    background:#102038;
    border:1px solid #29405e;
    border-radius:12px;
    transform:translate(-50%,30px);
    opacity:0;
    transition:.2s;
    z-index:1000;
    font-size:10px;
    font-weight:900;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   ETYKIETA
========================= */

#labelScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    overflow:auto;
    padding:30px 15px;
    background:rgba(0,0,0,.92);
}

.labelWindow{
    width:min(850px,100%);
    margin:auto;
}

.labelTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.labelTop h2{
    font-size:22px;
}

.closeLabel{
    border:0;
    background:#ff3158;
    color:white;
    padding:10px 15px;
    border-radius:9px;
    font-size:10px;
    font-weight:900;
}

/* WŁAŚCIWA ETYKIETA */

.label{
    background:#fff;
    color:#000;
    padding:35px;
    border-radius:4px;
    box-shadow:0 20px 100px #000;
}

.labelHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:20px;
    border-bottom:3px solid #000;
}

.labelLogo{
    font-size:28px;
    font-weight:1000;
}

.labelLogo span{
    color:#008cff;
}

.labelType{
    font-size:18px;
    font-weight:1000;
}

.labelSection{
    margin-top:25px;
}

.labelTitle{
    margin-bottom:8px;
    font-size:11px;
    font-weight:1000;
    text-transform:uppercase;
}

.labelBox{
    padding:17px;
    border:2px solid #000;
    font-size:17px;
    line-height:1.5;
}

.labelGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.tracking{
    margin-top:30px;
    text-align:center;
}

.barcode{
    width:90%;
    height:75px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:2px solid #000;
    font-family:"Courier New",monospace;
    font-size:32px;
    letter-spacing:5px;
    white-space:nowrap;
}

.trackingNumber{
    font-size:19px;
    font-weight:1000;
}

.labelFooter{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid #aaa;
    font-size:10px;
    color:#333;
}

/* MOBILE */

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .order{
        grid-template-columns:1fr;
    }

}

@media(max-width:550px){

    .cards{
        grid-template-columns:1fr;
    }

    .heading{
        align-items:flex-start;
        flex-direction:column;
    }

    .labelGrid{
        grid-template-columns:1fr;
    }

    .label{
        padding:20px;
    }

    .barcode{
        width:100%;
    }
}

</style>
</head>

<body>

<header class="top">

    <div class="logo">
        Printerlase<span>3D</span> ADMIN
    </div>

    <a href="/" class="back">
        ← SKLEP
    </a>

</header>


<!-- LOGIN -->

<div id="loginScreen" class="login">

    <h1>🔐 Panel Admin</h1>

    <p class="muted">
        Zaloguj się do panelu Printerlase3D.
    </p>

    <div class="field">

        <label>
            HASŁO
        </label>

        <input
            id="adminPassword"
            type="password"
            placeholder="Hasło administratora"
        >

    </div>

    <button
        class="btn"
        onclick="login()"
    >
        ZALOGUJ
    </button>

    <div
        id="loginError"
        class="error"
    ></div>

</div>


<!-- DASHBOARD -->

<main id="dashboard">

<div class="container">

    <div class="heading">

        <div>

            <h1>
                📊 Dashboard
            </h1>

            <p class="muted">
                Panel administratora Printerlase3D.
            </p>

        </div>

        <button
            class="btn"
            onclick="loadDashboard()"
        >
            ↻ ODŚWIEŻ
        </button>

    </div>


    <section class="cards">

        <div class="card">

            <small>
                💰 SALDO
            </small>

            <strong
                id="balance"
                class="green"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                📦 ZAMÓWIENIA
            </small>

            <strong id="ordersCount">
                0
            </strong>

        </div>


        <div class="card">

            <small>
                💵 ZAROBIONE
            </small>

            <strong
                id="earned"
                class="blue"
            >
                0,00 zł
            </strong>

        </div>


        <div class="card">

            <small>
                💸 WYPŁACONO
            </small>

            <strong
                id="withdrawn"
                class="red"
            >
                0,00 zł
            </strong>

        </div>

    </section>


    <section class="orders">

        <div class="ordersHeader">

            <h2>
                📦 Zamówienia
            </h2>

            <span
                id="lastUpdate"
                class="muted"
            ></span>

        </div>

        <div id="ordersList"></div>

    </section>

</div>

</main>


<!-- EKRAN ETYKIETY -->

<div id="labelScreen">

    <div class="labelWindow">

        <div class="labelTop">

            <h2>
                📦 Etykieta przesyłki
            </h2>

            <button
                class="closeLabel"
                onclick="closeLabel()"
            >
                ✕ ZAMKNIJ
            </button>

        </div>

        <div id="labelContent"></div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

let adminPassword = "";
let orders = [];


/* =========================
   POMOCNICZE
========================= */

function money(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".", ",") +
        " zł";

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   LOGIN
========================= */

async function login(){

    const password =
        document
        .getElementById("adminPassword")
        .value
        .trim();

    if(!password){

        document
        .getElementById("loginError")
        .textContent =
            "Podaj hasło.";

        return;

    }

    adminPassword = password;

    try{

        const response =
            await fetch(
                "/api/admin/dashboard",
                {
                    headers:{
                        "x-admin-password":
                            adminPassword
                    }
                }
            );

        if(!response.ok){

            throw new Error();

        }

        const data =
            await response.json();

        document
        .getElementById("loginScreen")
        .style.display =
            "none";

        document
        .getElementById("dashboard")
        .style.display =
            "block";

        renderDashboard(data);

    }
    catch{

        adminPassword = "";

        document
        .getElementById("loginError")
        .textContent =
            "❌ Błędne hasło administratora.";

    }

}


/* =========================
   DANE
========================= */

async function loadDashboard(){

    try{

        const response =
            await fetch(
                "/api/admin/dashboard",
                {
                    headers:{
                        "x-admin-password":
                            adminPassword
                    }
                }
            );

        if(response.status === 401){

            location.reload();

            return;

        }

        if(!response.ok){

            throw new Error();

        }

        const data =
            await response.json();

        renderDashboard(data);

    }
    catch{

        showToast(
            "❌ Błąd pobierania danych."
        );

    }

}


function renderDashboard(data){

    orders =
        Array.isArray(data.orders)
            ? data.orders
            : [];

    document
    .getElementById("balance")
    .textContent =
        money(data.balance);

    document
    .getElementById("ordersCount")
    .textContent =
        orders.length;

    document
    .getElementById("earned")
    .textContent =
        money(data.earned);

    document
    .getElementById("withdrawn")
    .textContent =
        money(data.withdrawn);

    document
    .getElementById("lastUpdate")
    .textContent =
        "Aktualizacja: " +
        new Date()
        .toLocaleTimeString("pl-PL");

    renderOrders();

}


/* =========================
   ZAMÓWIENIA
========================= */

function renderOrders(){

    const box =
        document
        .getElementById("ordersList");

    if(!orders.length){

        box.innerHTML = `
            <div class="empty">
                Brak zamówień.
            </div>
        `;

        return;

    }

    box.innerHTML =
        orders
        .slice()
        .reverse()
        .map(order => {

            const status =
                order.status ||
                "NEW";

            return `

                <div class="order">

                    <div>

                        <div class="orderId">
                            ${escapeHTML(order.id)}
                        </div>

                        <div class="info">
                            👤
                            ${escapeHTML(order.name)}
                        </div>

                        <div class="info">
                            ✉️
                            ${escapeHTML(order.email)}
                        </div>

                        ${
                            order.phone
                            ? `
                                <div class="info">
                                    📞
                                    ${escapeHTML(order.phone)}
                                </div>
                            `
                            : ""
                        }

                    </div>


                    <div>

                        <strong>
                            ${money(order.total)}
                        </strong>

                        <div class="info">

                            ${
                                order.createdAt
                                ? new Date(
                                    order.createdAt
                                  ).toLocaleString("pl-PL")
                                : "—"
                            }

                        </div>

                    </div>


                    <div>

                        <span
                            class="status ${escapeHTML(status)}"
                        >
                            ${escapeHTML(status)}
                        </span>

                    </div>


                    <div class="actions">

                        <button
                            class="smallBtn"
                            onclick="changeStatus(
                                '${escapeHTML(order.id)}',
                                'PAID'
                            )"
                        >
                            ✓ OPŁACONE
                        </button>


                        <button
                            class="smallBtn"
                            onclick="changeStatus(
                                '${escapeHTML(order.id)}',
                                'CANCELLED'
                            )"
                        >
                            ✕ ANULUJ
                        </button>


                        <button
                            class="smallBtn labelBtn"
                            onclick="showLabel(
                                '${escapeHTML(order.id)}'
                            )"
                        >
                            📦 ETYKIETA
                        </button>

                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================
   STATUS
========================= */

async function changeStatus(id,status){

    try{

        const response =
            await fetch(
                "/api/admin/order-status",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "x-admin-password":
                            adminPassword
                    },

                    body:JSON.stringify({
                        id,
                        status
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Błąd"
            );

        }

        showToast(
            status === "PAID"
                ? "✓ Zamówienie opłacone."
                : "✓ Zamówienie anulowane."
        );

        loadDashboard();

    }
    catch(error){

        showToast(
            "❌ " +
            error.message
        );

    }

}


/* =========================
   POKAŻ ETYKIETĘ
========================= */

function showLabel(id){

    const order =
        orders.find(
            item => item.id === id
        );

    if(!order){

        showToast(
            "❌ Nie znaleziono zamówienia."
        );

        return;

    }


    const address =
        order.address ||
        order.shippingAddress ||
        order.deliveryAddress ||
        "Brak adresu";


    const city =
        order.city ||
        "";


    const postal =
        order.postalCode ||
        order.zip ||
        order.postcode ||
        "";


    const country =
        order.country ||
        "Polska";


    /*
       Wewnętrzny numer etykiety.
       Nie jest numerem prawdziwego
       przewoźnika.
    */

    const tracking =
        "PL3D-" +
        String(order.id)
        .replace(/[^a-zA-Z0-9]/g,"")
        .slice(-10);


    /*
       Wizualny kod kreskowy
    */

    let barcode = "";

    for(let i=0;i<50;i++){

        barcode +=
            i % 2 === 0
                ? "||||"
                : "||";

    }


    document
    .getElementById("labelContent")
    .innerHTML = `

        <div class="label">

            <div class="labelHeader">

                <div class="labelLogo">
                    Printerlase<span>3D</span>
                </div>

                <div class="labelType">
                    PACZKA
                </div>

            </div>


            <div class="labelSection">

                <div class="labelTitle">
                    ODBIORCA
                </div>

                <div class="labelBox">

                    <strong>
                        ${escapeHTML(order.name)}
                    </strong>

                    <br>

                    ${escapeHTML(address)}

                    <br>

                    ${escapeHTML(postal)}
                    ${escapeHTML(city)}

                    <br>

                    ${escapeHTML(country)}

                </div>

            </div>


            <div class="labelGrid">

                <div class="labelSection">

                    <div class="labelTitle">
                        TELEFON
                    </div>

                    <div class="labelBox">
                        ${escapeHTML(
                            order.phone ||
                            "Brak"
                        )}
                    </div>

                </div>


                <div class="labelSection">

                    <div class="labelTitle">
                        E-MAIL
                    </div>

                    <div class="labelBox">
                        ${escapeHTML(order.email)}
                    </div>

                </div>

            </div>


            <div class="labelSection">

                <div class="labelTitle">
                    NUMER ZAMÓWIENIA
                </div>

                <div class="labelBox">

                    ${escapeHTML(order.id)}

                </div>

            </div>


            <div class="tracking">

                <div class="barcode">
                    ${barcode}
                </div>

                <div class="trackingNumber">
                    ${tracking}
                </div>

            </div>


            <div class="labelFooter">

                Printerlase3D •
                Etykieta przygotowana
                ${new Date()
                    .toLocaleString("pl-PL")}

            </div>

        </div>

    `;


    document
    .getElementById("labelScreen")
    .style.display =
        "block";

}


/* =========================
   ZAMKNIJ ETYKIETĘ
========================= */

function closeLabel(){

    document
    .getElementById("labelScreen")
    .style.display =
        "none";

}


/* =========================
   TOAST
========================= */

function showToast(text){

    const toast =
        document
        .getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =========================
   ENTER
========================= */

document
.getElementById("adminPassword")
.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            login();

        }

    }
);


/* ESC = ZAMKNIJ ETYKIETĘ */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            closeLabel();

        }

    }
);

</script>

</body>
</html>
```
