<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printerlase3D — Panel Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:white;
    background:#030712;
}

.top{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(5,10,20,.95);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:20px;
    font-weight:900;
}

.logo span{
    color:#29d8ff;
}

.back{
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
    background:#111c2e;
}

.container{
    width:min(1100px,90%);
    margin:50px auto;
}

h1{
    font-size:40px;
}

.subtitle{
    color:#718096;
    margin-top:8px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:30px;
}

.card{
    padding:25px;
    border-radius:18px;
    background:#071120;
    border:1px solid rgba(255,255,255,.08);
}

.card .icon{
    font-size:30px;
}

.card h3{
    margin-top:15px;
    font-size:13px;
    color:#8fa0b5;
}

.number{
    margin-top:8px;
    font-size:32px;
    font-weight:900;
}

.panel{
    margin-top:25px;
    padding:25px;
    border-radius:18px;
    background:#071120;
    border:1px solid rgba(255,255,255,.08);
}

.panel h2{
    margin-bottom:20px;
}

.order{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.order:last-child{
    border-bottom:0;
}

.status{
    padding:7px 10px;
    border-radius:8px;
    background:rgba(0,200,140,.12);
    color:#4ff0b0;
    font-size:11px;
    font-weight:900;
}

.button{
    border:0;
    padding:10px 14px;
    border-radius:9px;
    color:white;
    background:linear-gradient(100deg,#008cff,#783cff);
    cursor:pointer;
    font-weight:900;
}

.empty{
    padding:30px;
    text-align:center;
    color:#718096;
}

@media(max-width:700px){
    .cards{
        grid-template-columns:1fr;
    }

    .order{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header class="top">

    <div class="logo">
        Printerlase<span>3D</span>
    </div>

    <a href="./index.html" class="back">
        ← Sklep
    </a>

</header>

<main class="container">

    <h1>
        🔐 Panel Admin
    </h1>

    <p class="subtitle">
        Zarządzanie sklepem Printerlase3D
    </p>


    <section class="cards">

        <div class="card">

            <div class="icon">📦</div>

            <h3>
                ZAMÓWIENIA
            </h3>

            <div
                class="number"
                id="orders"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="icon">💰</div>

            <h3>
                SPRZEDAŻ
            </h3>

            <div
                class="number"
                id="sales"
            >
                0 zł
            </div>

        </div>


        <div class="card">

            <div class="icon">🛒</div>

            <h3>
                PRODUKTY
            </h3>

            <div
                class="number"
            >
                6
            </div>

        </div>

    </section>


    <section class="panel">

        <h2>
            📋 Zamówienia
        </h2>

        <div id="ordersList">

            <div class="empty">
                Brak zamówień.
            </div>

        </div>

    </section>


    <section class="panel">

        <h2>
            ⚙️ Sklep
        </h2>

        <button
            class="button"
            onclick="clearOrders()"
        >
            🗑️ Wyczyść zamówienia
        </button>

    </section>

</main>


<script>

function loadOrders(){

    let orders = [];

    try{

        orders =
            JSON.parse(
                localStorage.getItem(
                    "printerlase_orders"
                )
            ) || [];

    }catch(e){

        orders=[];

    }


    document.getElementById(
        "orders"
    ).textContent =
        orders.length;


    let sales=0;


    orders.forEach(order=>{

        sales +=
            Number(
                order.total || 0
            );

    });


    document.getElementById(
        "sales"
    ).textContent =
        sales.toFixed(2)
        .replace(".",",")
        + " zł";


    const list =
        document.getElementById(
            "ordersList"
        );


    if(!orders.length){

        list.innerHTML=`

            <div class="empty">
                📦 Brak zamówień.
            </div>

        `;

        return;

    }


    list.innerHTML="";


    orders.forEach(
        (order,index)=>{

            const date =
                order.date ||
                "Brak daty";


            list.innerHTML += `

                <div class="order">

                    <div>

                        <strong>
                            Zamówienie #${index+1}
                        </strong>

                        <br>

                        <small>
                            ${date}
                        </small>

                        <br>

                        <small>
                            ${order.name || "Klient"}
                        </small>

                    </div>


                    <div>

                        <strong>
                            ${Number(
                                order.total || 0
                            ).toFixed(2)
                            .replace(".",",")} zł
                        </strong>

                    </div>


                    <div class="status">
                        NOWE
                    </div>

                </div>

            `;

        }
    );

}


function clearOrders(){

    if(
        !confirm(
            "Na pewno usunąć wszystkie zamówienia?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        "printerlase_orders"
    );


    loadOrders();

}


loadOrders();

</script>

</body>
</html>
