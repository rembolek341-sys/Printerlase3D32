<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Admin — Printerlase3D</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 10%,#008cff25,transparent 35%),
        radial-gradient(circle at 90% 90%,#7c3cff25,transparent 35%),
        #030712;
    color:white;
    font-family:Arial, sans-serif;
}

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    padding:35px;
    border-radius:25px;
    background:#081525eF;
    border:1px solid #ffffff12;
    box-shadow:0 30px 100px #0008;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:1000;
    margin-bottom:8px;
}

.logo span{
    background:linear-gradient(90deg,#00d9ff,#7650ff);
    -webkit-background-clip:text;
    color:transparent;
}

.login-sub{
    text-align:center;
    color:#718096;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid #ffffff12;
    background:#030a14;
    color:white;
    outline:none;
}

input:focus{
    border-color:#00bfff;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(100deg,#008cff,#754cff);
    color:white;
    font-weight:900;
    cursor:pointer;
}

.error{
    color:#ff6575;
    text-align:center;
    margin-top:15px;
    display:none;
}

.admin{
    display:none;
}

header{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    background:#030712dd;
    border-bottom:1px solid #ffffff0d;
    backdrop-filter:blur(20px);
    position:sticky;
    top:0;
    z-index:10;
}

header h1{
    font-size:20px;
    margin:0;
}

header span{
    color:#35d8ff;
}

.logout{
    width:auto;
    padding:10px 16px;
    background:#ffffff0b;
    border:1px solid #ffffff12;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:40px 20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.top h2{
    margin:0;
    font-size:32px;
}

.refresh{
    width:auto;
    padding:12px 18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    padding:22px;
    border-radius:18px;
    background:#081525;
    border:1px solid #ffffff0d;
}

.stat-title{
    color:#718096;
    font-size:12px;
    margin-bottom:10px;
}

.stat-value{
    font-size:27px;
    font-weight:1000;
}

.orders{
    display:grid;
    gap:18px;
}

.order{
    padding:25px;
    border-radius:20px;
    background:#081525;
    border:1px solid #ffffff0d;
}

.order-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.order-number{
    color:#35d8ff;
    font-weight:1000;
}

.date{
    color:#68778c;
    font-size:12px;
}

.order-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.info{
    padding:15px;
    border-radius:13px;
    background:#030a14;
}

.info-title{
    color:#66758a;
    font-size:11px;
    margin-bottom:6px;
}

.info-value{
    font-weight:bold;
    word-break:break-word;
}

.items{
    margin-top:18px;
    border-top:1px solid #ffffff0b;
    padding-top:15px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    color:#b9c3d0;
}

.order-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid #ffffff0b;
}

.total{
    font-size:22px;
    font-weight:1000;
}

.status{
    padding:9px 13px;
    border-radius:10px;
    background:#00cfff12;
    border:1px solid #00cfff30;
    color:#35d8ff;
    font-size:12px;
    font-weight:bold;
}

.status-select{
    width:auto;
    margin:0;
    padding:9px;
}

.empty{
    text-align:center;
    padding:70px 20px;
    color:#718096;
    background:#081525;
    border-radius:20px;
}

.delete{
    width:auto;
    padding:9px 13px;
    background:#ff405018;
    border:1px solid #ff405033;
    color:#ff7280;
}

.actions{
    display:flex;
    gap:10px;
    align-items:center;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .order-grid{
        grid-template-columns:1fr;
    }

    .order-head{
        flex-direction:column;
        align-items:flex-start;
    }

    .order-bottom{
        flex-direction:column;
        gap:15px;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<!-- LOGOWANIE -->

<div class="login" id="login">

    <div class="login-box">

        <div class="logo">
            Printerlase<span>3D</span>
        </div>

        <div class="login-sub">
            Panel administratora
        </div>

        <input
            id="adminPassword"
            type="password"
            placeholder="Hasło administratora"
            onkeydown="if(event.key==='Enter') loginAdmin()"
        >

        <button onclick="loginAdmin()">
            🔐 Zaloguj
        </button>

        <div class="error" id="error">
            Nieprawidłowe hasło.
        </div>

    </div>

</div>


<!-- PANEL -->

<div class="admin" id="admin">

<header>

    <h1>
        Printerlase<span>3D</span> — Admin
    </h1>

    <button class="logout" onclick="logout()">
        Wyloguj
    </button>

</header>


<div class="container">

    <div class="top">

        <div>
            <h2>Zamówienia</h2>
            <p style="color:#718096;">
                Panel zarządzania zamówieniami
            </p>
        </div>

        <button
            class="refresh"
            onclick="loadOrders()"
        >
            🔄 Odśwież
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-title">ZAMÓWIENIA</div>
            <div class="stat-value" id="ordersCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">SPRZEDAŻ</div>
            <div class="stat-value" id="sales">0 zł</div>
        </div>

        <div class="stat">
            <div class="stat-title">DZISIAJ</div>
            <div class="stat-value" id="today">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">PRODUKTÓW</div>
            <div class="stat-value" id="products">0</div>
        </div>

    </div>


    <div class="orders" id="orders"></div>

</div>

</div>


<script>

/*
==================================================
 HASŁO ADMINA
==================================================

 ZMIEŃ SOBIE HASŁO TUTAJ.
*/

const ADMIN_PASSWORD = "Admin2137";


/*
==================================================
 LOGOWANIE
==================================================
*/

function loginAdmin(){

    const password =
        document.getElementById("adminPassword").value;

    if(password === ADMIN_PASSWORD){

        sessionStorage.setItem(
            "printerlase_admin",
            "true"
        );

        document.getElementById("login").style.display =
            "none";

        document.getElementById("admin").style.display =
            "block";

        loadOrders();

    }else{

        document.getElementById("error").style.display =
            "block";

    }

}


function logout(){

    sessionStorage.removeItem(
        "printerlase_admin"
    );

    location.reload();

}


/*
==================================================
 SPRAWDZENIE LOGOWANIA
==================================================
*/

if(
    sessionStorage.getItem(
        "printerlase_admin"
    ) === "true"
){

    document.getElementById("login").style.display =
        "none";

    document.getElementById("admin").style.display =
        "block";

    loadOrders();

}


/*
==================================================
 ZAMÓWIENIA
==================================================
*/

function getOrders(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "printerlase_orders"
            )
        ) || [];

    }catch{

        return [];

    }

}


/*
==================================================
 ŁADOWANIE
==================================================
*/

function loadOrders(){

    const orders = getOrders();

    const container =
        document.getElementById("orders");

    let sales = 0;
    let products = 0;

    const todayDate =
        new Date().toISOString().slice(0,10);

    let today = 0;


    orders.forEach(order => {

        sales += Number(order.total || 0);

        if(
            order.date &&
            order.date.slice(0,10) === todayDate
        ){

            today++;

        }

        if(order.products){

            order.products.forEach(product => {

                products += Number(
                    product.quantity || 1
                );

            });

        }

    });


    document.getElementById("ordersCount")
        .textContent = orders.length;

    document.getElementById("sales")
        .textContent =
        sales.toFixed(2).replace(".",",") + " zł";

    document.getElementById("today")
        .textContent = today;

    document.getElementById("products")
        .textContent = products;


    if(orders.length === 0){

        container.innerHTML = `
            <div class="empty">
                📦<br><br>
                Nie ma jeszcze żadnych zamówień.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    orders.slice().reverse().forEach(
        (order,index) => {

            const customer =
                order.customer || {};

            const products =
                order.products || [];

            const date =
                order.date
                ? new Date(order.date)
                    .toLocaleString("pl-PL")
                : "Brak daty";


            let itemsHTML = "";


            products.forEach(product => {

                const quantity =
                    Number(
                        product.quantity || 1
                    );

                const price =
                    Number(
                        product.price || 0
                    );


                itemsHTML += `

                    <div class="item">

                        <span>
                            ${escapeHTML(
                                product.name ||
                                "Produkt"
                            )}
                            × ${quantity}
                        </span>

                        <b>
                            ${(price * quantity)
                                .toFixed(2)
                                .replace(".",",")}
                            zł
                        </b>

                    </div>

                `;

            });


            const realIndex =
                orders.length - 1 - index;


            container.innerHTML += `

                <div class="order">

                    <div class="order-head">

                        <div>

                            <div class="order-number">
                                ${escapeHTML(
                                    order.number ||
                                    "BRAK NUMERU"
                                )}
                            </div>

                            <div class="date">
                                ${date}
                            </div>

                        </div>

                        <div class="actions">

                            <select
                                class="status-select"
                                onchange="changeStatus(
                                    ${realIndex},
                                    this.value
                                )"
                            >

                                <option
                                    ${order.status === "Nowe"
                                    ? "selected":""}
                                >
                                    Nowe
                                </option>

                                <option
                                    ${order.status === "W realizacji"
                                    ? "selected":""}
                                >
                                    W realizacji
                                </option>

                                <option
                                    ${order.status === "Wysłane"
                                    ? "selected":""}
                                >
                                    Wysłane
                                </option>

                                <option
                                    ${order.status === "Zakończone"
                                    ? "selected":""}
                                >
                                    Zakończone
                                </option>

                            </select>

                            <button
                                class="delete"
                                onclick="deleteOrder(${realIndex})"
                            >
                                🗑️
                            </button>

                        </div>

                    </div>


                    <div class="order-grid">

                        <div class="info">

                            <div class="info-title">
                                KLIENT
                            </div>

                            <div class="info-value">
                                ${escapeHTML(
                                    customer.name ||
                                    "Brak"
                                )}
                            </div>

                        </div>


                        <div class="info">

                            <div class="info-title">
                                E-MAIL
                            </div>

                            <div class="info-value">
                                ${escapeHTML(
                                    customer.email ||
                                    "Brak"
                                )}
                            </div>

                        </div>


                        <div class="info">

                            <div class="info-title">
                                TELEFON
                            </div>

                            <div class="info-value">
                                ${escapeHTML(
                                    customer.phone ||
                                    "Brak"
                                )}
                            </div>

                        </div>


                        <div class="info">

                            <div class="info-title">
                                ADRES
                            </div>

                            <div class="info-value">
                                ${escapeHTML(
                                    customer.address ||
                                    "Brak"
                                )}
                            </div>

                        </div>


                        <div class="info">

                            <div class="info-title">
                                PŁATNOŚĆ
                            </div>

                            <div class="info-value">
                                ${escapeHTML(
                                    order.payment ||
                                    "Brak"
                                )}
                            </div>

                        </div>


                        <div class="info">

                            <div class="info-title">
                                DOSTAWA
                            </div>

                            <div class="info-value">
                                ${escapeHTML(
                                    order.delivery ||
                                    "Brak"
                                )}
                            </div>

                        </div>

                    </div>


                    <div class="items">

                        ${itemsHTML || `
                            <div class="item">
                                Brak produktów
                            </div>
                        `}

                    </div>


                    <div class="order-bottom">

                        <div class="status">
                            ${escapeHTML(
                                order.status ||
                                "Nowe"
                            )}
                        </div>

                        <div class="total">
                            ${Number(
                                order.total || 0
                            )
                            .toFixed(2)
                            .replace(".",",")}
                            zł
                        </div>

                    </div>

                </div>

            `;

        }
    );

}


/*
==================================================
 STATUS ZAMÓWIENIA
==================================================
*/

function changeStatus(index,status){

    const orders = getOrders();

    if(!orders[index]) return;

    orders[index].status = status;

    localStorage.setItem(
        "printerlase_orders",
        JSON.stringify(orders)
    );

    loadOrders();

}


/*
==================================================
 USUWANIE
==================================================
*/

function deleteOrder(index){

    if(
        !confirm(
            "Na pewno usunąć to zamówienie?"
        )
    ){

        return;

    }


    const orders = getOrders();

    orders.splice(index,1);

    localStorage.setItem(
        "printerlase_orders",
        JSON.stringify(orders)
    );

    loadOrders();

}


/*
==================================================
 BEZPIECZNY TEKST
==================================================
*/

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
