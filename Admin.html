<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin — Printerlase3D</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    color:#fff;

    background:#020611;

    overflow-x:hidden;
}

body:before{
    content:"";

    position:fixed;

    inset:0;

    z-index:-2;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,180,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(110,50,255,.14),
            transparent 30%
        );
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#020611;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(
        #00d9ff,
        #673cff
    );

    border-radius:20px;
}


/* =========================
   LOGIN
========================= */

.loginScreen{
    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(2,6,17,.96);

    backdrop-filter:blur(20px);
}

.loginBox{
    width:min(430px,100%);

    padding:32px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #0a1729,
            #050c18
        );

    border:1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);

    text-align:center;

    animation:loginIn .5s ease;
}

@keyframes loginIn{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

.loginLogo{
    width:65px;
    height:65px;

    margin:0 auto;

    display:grid;

    place-items:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #087dff,
            #743cff
        );

    font-size:28px;

    font-weight:1000;

    box-shadow:
        0 0 40px
        rgba(0,180,255,.2);
}

.loginBox h1{
    margin-top:20px;

    font-size:25px;
}

.loginBox p{
    margin-top:8px;

    color:#718096;

    font-size:10px;

    line-height:1.5;
}

.loginBox input{
    width:100%;

    margin-top:22px;

    padding:14px;

    outline:none;

    border-radius:10px;

    color:#fff;

    background:#040b16;

    border:1px solid
        rgba(255,255,255,.08);

    font-size:11px;
}

.loginButton{
    width:100%;

    margin-top:12px;

    padding:14px;

    border:0;

    border-radius:10px;

    color:#fff;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #703cff
        );

    cursor:pointer;

    font-size:10px;

    font-weight:1000;
}

.loginError{
    min-height:15px;

    margin-top:10px;

    color:#ff5d75;

    font-size:9px;

    font-weight:900;
}


/* =========================
   ADMIN
========================= */

#adminApp{
    display:none;
}

.topbar{
    position:sticky;

    top:0;

    z-index:100;

    min-height:75px;

    padding:12px 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    background:
        rgba(2,7,17,.82);

    backdrop-filter:blur(18px);

    border-bottom:1px solid
        rgba(255,255,255,.07);
}

.brand{
    display:flex;

    align-items:center;

    gap:10px;

    font-weight:1000;
}

.brandIcon{
    width:40px;
    height:40px;

    display:grid;

    place-items:center;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #087dff,
            #703cff
        );
}

.brand span{
    color:#2bdcff;
}

.topActions{
    display:flex;

    gap:8px;
}

.topButton{
    padding:10px 13px;

    border-radius:9px;

    color:#fff;

    background:#0a1729;

    border:1px solid
        rgba(255,255,255,.07);

    text-decoration:none;

    cursor:pointer;

    font-size:9px;

    font-weight:1000;
}

.logout{
    background:
        rgba(255,60,90,.08);

    color:#ff7184;
}


/* =========================
   MAIN
========================= */

.container{
    width:min(1200px,92%);

    margin:45px auto 100px;
}

.pageTitle{
    display:flex;

    justify-content:space-between;

    align-items:end;

    gap:20px;
}

.pageTitle h1{
    font-size:34px;

    letter-spacing:-1px;
}

.pageTitle p{
    margin-top:7px;

    color:#718096;

    font-size:10px;
}


/* =========================
   STATS
========================= */

.stats{
    margin-top:25px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;
}

.stat{
    padding:20px;

    border-radius:16px;

    background:#071120;

    border:1px solid
        rgba(255,255,255,.07);
}

.statIcon{
    font-size:22px;
}

.statValue{
    margin-top:12px;

    font-size:24px;

    font-weight:1000;
}

.statLabel{
    margin-top:5px;

    color:#718096;

    font-size:9px;

    font-weight:900;
}


/* =========================
   TOOLBAR
========================= */

.toolbar{
    margin-top:30px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    flex-wrap:wrap;
}

.search{
    flex:1;

    min-width:220px;

    padding:13px;

    outline:none;

    border-radius:10px;

    color:#fff;

    background:#071120;

    border:1px solid
        rgba(255,255,255,.07);
}

.filter{
    padding:13px;

    border-radius:10px;

    color:#fff;

    background:#071120;

    border:1px solid
        rgba(255,255,255,.07);
}


/* =========================
   ORDERS
========================= */

.orders{
    margin-top:18px;

    display:grid;

    gap:13px;
}

.order{
    padding:20px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #081426,
            #050d1a
        );

    border:1px solid
        rgba(255,255,255,.07);

    transition:.2s;
}

.order:hover{
    border-color:
        rgba(0,200,255,.22);

    transform:
        translateY(-2px);
}

.orderTop{
    display:flex;

    justify-content:space-between;

    align-items:start;

    gap:15px;
}

.orderId{
    color:#31ddff;

    font-size:12px;

    font-weight:1000;
}

.orderDate{
    margin-top:5px;

    color:#66758a;

    font-size:8px;
}

.status{
    padding:7px 9px;

    border-radius:8px;

    font-size:8px;

    font-weight:1000;
}

.status.nowe{
    color:#40dfff;

    background:
        rgba(0,200,255,.08);
}

.status.realizowane{
    color:#ffd35c;

    background:
        rgba(255,200,60,.08);
}

.status.zrealizowane{
    color:#4fe6aa;

    background:
        rgba(70,220,160,.08);
}

.status.anulowane{
    color:#ff637a;

    background:
        rgba(255,60,90,.08);
}

.orderGrid{
    margin-top:18px;

    display:grid;

    grid-template-columns:
        1.2fr 1fr 1fr .8fr;

    gap:15px;
}

.infoBox{
    padding:12px;

    border-radius:10px;

    background:
        rgba(255,255,255,.025);
}

.infoTitle{
    color:#66758a;

    font-size:8px;

    font-weight:900;
}

.infoValue{
    margin-top:6px;

    font-size:10px;

    font-weight:900;

    word-break:break-word;
}

.productsList{
    margin-top:15px;

    padding-top:14px;

    border-top:1px solid
        rgba(255,255,255,.06);
}

.productsList strong{
    font-size:9px;
}

.productRow{
    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:8px;

    color:#8997aa;

    font-size:9px;
}

.orderBottom{
    margin-top:16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    flex-wrap:wrap;
}

.orderTotal{
    font-size:19px;

    font-weight:1000;
}

.orderButtons{
    display:flex;

    gap:7px;

    flex-wrap:wrap;
}

.actionButton{
    padding:9px 11px;

    border:0;

    border-radius:8px;

    color:#fff;

    background:#102039;

    cursor:pointer;

    font-size:8px;

    font-weight:1000;
}

.actionButton.green{
    background:
        rgba(50,210,150,.1);

    color:#4fe6aa;
}

.actionButton.yellow{
    background:
        rgba(255,190,50,.1);

    color:#ffd35c;
}

.actionButton.red{
    background:
        rgba(255,60,90,.1);

    color:#ff7184;
}


/* =========================
   EMPTY
========================= */

.empty{
    padding:70px 20px;

    text-align:center;

    border-radius:17px;

    background:#071120;

    border:1px solid
        rgba(255,255,255,.06);

    color:#718096;

    font-size:11px;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;

    bottom:25px;

    z-index:2000;

    padding:13px 18px;

    border-radius:11px;

    color:#fff;

    background:#0c1b2e;

    border:1px solid
        rgba(0,200,255,.2);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.4);

    transform:
        translate(-50%,30px);

    opacity:0;

    pointer-events:none;

    transition:.25s;

    font-size:9px;

    font-weight:900;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .orderGrid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:550px){

    .brandText{
        display:none;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .orderGrid{
        grid-template-columns:1fr;
    }

    .pageTitle h1{
        font-size:27px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section
    id="loginScreen"
    class="loginScreen"
>

    <div class="loginBox">

        <div class="loginLogo">
            P
        </div>

        <h1>
            Panel Admin
        </h1>

        <p>
            Printerlase3D
        </p>


        <input
            id="adminEmail"
            type="email"
            placeholder="E-mail administratora"
            autocomplete="username"
        >


        <input
            id="adminPassword"
            type="password"
            placeholder="Hasło"
            autocomplete="current-password"
        >


        <button
            class="loginButton"
            onclick="login()"
        >
            🔐 Zaloguj do panelu
        </button>


        <div
            id="loginError"
            class="loginError"
        ></div>

    </div>

</section>


<!-- =====================================================
     ADMIN APP
===================================================== -->

<div id="adminApp">


    <!-- TOPBAR -->

    <header class="topbar">

        <div class="brand">

            <div class="brandIcon">
                P
            </div>

            <div class="brandText">

                Printerlase<span>3D</span>

                <small>
                    • ADMIN
                </small>

            </div>

        </div>


        <div class="topActions">

            <a
                href="index.html"
                class="topButton"
            >
                🏠 Sklep
            </a>


            <button
                class="topButton"
                onclick="refreshOrders()"
            >
                🔄 Odśwież
            </button>


            <button
                class="topButton logout"
                onclick="logout()"
            >
                Wyloguj
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container">


        <div class="pageTitle">

            <div>

                <h1>
                    Panel administracyjny
                </h1>

                <p>
                    Zarządzanie zamówieniami Printerlase3D
                </p>

            </div>

        </div>


        <!-- STATS -->

        <section class="stats">


            <div class="stat">

                <div class="statIcon">
                    📦
                </div>

                <div
                    id="ordersCount"
                    class="statValue"
                >
                    0
                </div>

                <div class="statLabel">
                    Wszystkie zamówienia
                </div>

            </div>


            <div class="stat">

                <div class="statIcon">
                    🆕
                </div>

                <div
                    id="newCount"
                    class="statValue"
                >
                    0
                </div>

                <div class="statLabel">
                    Nowe
                </div>

            </div>


            <div class="stat">

                <div class="statIcon">
                    💰
                </div>

                <div
                    id="revenue"
                    class="statValue"
                >
                    0,00 zł
                </div>

                <div class="statLabel">
                    Łączna wartość
                </div>

            </div>


            <div class="stat">

                <div class="statIcon">
                    🚚
                </div>

                <div
                    id="freeShippingCount"
                    class="statValue"
                >
                    0
                </div>

                <div class="statLabel">
                    Darmowa dostawa
                </div>

            </div>


        </section>


        <!-- TOOLBAR -->

        <section class="toolbar">

            <input
                id="search"
                class="search"
                type="search"
                placeholder="🔎 Szukaj po ID, kliencie lub e-mailu..."
                oninput="renderOrders()"
            >


            <select
                id="statusFilter"
                class="filter"
                onchange="renderOrders()"
            >

                <option value="ALL">
                    Wszystkie
                </option>

                <option value="NOWE">
                    Nowe
                </option>

                <option value="REALIZOWANE">
                    Realizowane
                </option>

                <option value="ZREALIZOWANE">
                    Zrealizowane
                </option>

                <option value="ANULOWANE">
                    Anulowane
                </option>

            </select>

        </section>


        <!-- ORDERS -->

        <section
            id="orders"
            class="orders"
        ></section>


    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/* =====================================================
   KONFIGURACJA ADMINA
===================================================== */

const ADMIN_EMAILS = [

    "rembolek341@gmail.com",

    "kaniar2013@gmail.com"

];


/*
    To hasło jest tylko lokalnym zabezpieczeniem
    demonstracyjnego panelu.

    Zmień je tutaj.
*/

const ADMIN_PASSWORD =
    "Printerlase3D2026";


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const email =
        document
        .getElementById(
            "adminEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById(
            "adminPassword"
        )
        .value;


    const error =
        document
        .getElementById(
            "loginError"
        );


    if(
        !ADMIN_EMAILS.includes(
            email
        )
    ){

        error.textContent =
            "❌ Ten e-mail nie ma dostępu.";

        return;

    }


    if(
        password !==
        ADMIN_PASSWORD
    ){

        error.textContent =
            "❌ Nieprawidłowe hasło.";

        return;

    }


    sessionStorage.setItem(
        "printerlase_admin",
        "true"
    );


    document
        .getElementById(
            "loginScreen"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "adminApp"
        )
        .style.display =
        "block";


    renderOrders();

}


/* =====================================================
   AUTO LOGIN
===================================================== */

function checkLogin(){

    const logged =
        sessionStorage.getItem(
            "printerlase_admin"
        );


    if(
        logged === "true"
    ){

        document
            .getElementById(
                "loginScreen"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "adminApp"
            )
            .style.display =
            "block";


        renderOrders();

    }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    sessionStorage.removeItem(
        "printerlase_admin"
    );


    location.reload();

}


/* =====================================================
   GET ORDERS
===================================================== */

function getOrders(){

    return JSON.parse(
        localStorage.getItem(
            "printerlase_orders"
        )
    ) || [];

}


/* =====================================================
   SAVE ORDERS
===================================================== */

function saveOrders(
    orders
){

    localStorage.setItem(
        "printerlase_orders",
        JSON.stringify(
            orders
        )
    );

}


/* =====================================================
   MONEY
===================================================== */

function money(
    value
){

    return Number(
        value || 0
    )
    .toFixed(2)
    .replace(
        ".",
        ","
    )
    + " zł";

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(
    status
){

    return String(
        status
    )
    .toLowerCase()
    .normalize(
        "NFD"
    )
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderOrders(){

    const orders =
        getOrders();


    const search =
        document
        .getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const filter =
        document
        .getElementById(
            "statusFilter"
        )
        .value;


    const filtered =
        orders.filter(
            order => {

                const searchable = (

                    String(
                        order.id || ""
                    )
                    + " " +

                    String(
                        order.name || ""
                    )
                    + " " +

                    String(
                        order.email || ""
                    )
                    + " " +

                    String(
                        order.shippingMethod || ""
                    )

                )
                .toLowerCase();


                const matchesSearch =
                    !search ||
                    searchable.includes(
                        search
                    );


                const matchesStatus =
                    filter === "ALL" ||
                    order.status ===
                    filter;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        )
        .reverse();


    updateStats(
        orders
    );


    const box =
        document.getElementById(
            "orders"
        );


    if(
        filtered.length === 0
    ){

        box.innerHTML = `

            <div class="empty">

                📦

                <br><br>

                Brak zamówień spełniających kryteria.

            </div>

        `;

        return;

    }


    box.innerHTML =
        filtered
        .map(
            order => renderOrder(
                order
            )
        )
        .join("");

}


/* =====================================================
   ORDER HTML
===================================================== */

function renderOrder(
    order
){

    const products =
        order.products || [];


    return `

        <article class="order">

            <div class="orderTop">

                <div>

                    <div class="orderId">

                        ${escapeHTML(
                            order.id
                        )}

                    </div>

                    <div class="orderDate">

                        ${escapeHTML(
                            order.date || ""
                        )}

                    </div>

                </div>


                <div
                    class="status ${statusClass(
                        order.status
                    )}"
                >

                    ${escapeHTML(
                        order.status || "NOWE"
                    )}

                </div>

            </div>


            <div class="orderGrid">


                <div class="infoBox">

                    <div class="infoTitle">
                        KLIENT
                    </div>

                    <div class="infoValue">

                        ${escapeHTML(
                            order.name || "-"
                        )}

                    </div>

                </div>


                <div class="infoBox">

                    <div class="infoTitle">
                        E-MAIL
                    </div>

                    <div class="infoValue">

                        ${escapeHTML(
                            order.email || "-"
                        )}

                    </div>

                </div>


                <div class="infoBox">

                    <div class="infoTitle">
                        DOSTAWA
                    </div>

                    <div class="infoValue">

                        📦
                        ${escapeHTML(
                            order.shippingMethod || "-"
                        )}

                    </div>

                </div>


                <div class="infoBox">

                    <div class="infoTitle">
                        DOSTAWA
                    </div>

                    <div class="infoValue">

                        ${
                            Number(
                                order.shipping
                            ) === 0

                            ? "🟢 GRATIS"

                            : money(
                                order.shipping
                            )
                        }

                    </div>

                </div>


            </div>


            <div class="productsList">

                <strong>
                    PRODUKTY
                </strong>


                ${
                    products
                    .map(
                        product => `

                            <div
                                class="productRow"
                            >

                                <span>

                                    ${escapeHTML(
                                        product.name
                                    )}

                                </span>

                                <span>

                                    ${money(
                                        product.price
                                    )}

                                </span>

                            </div>

                        `
                    )
                    .join("")
                }

            </div>


            <div class="orderBottom">

                <div>

                    <div class="orderTotal">

                        ${money(
                            order.total
                        )}

                    </div>

                </div>


                <div class="orderButtons">


                    <button
                        class="actionButton yellow"
                        onclick="changeStatus(
                            '${escapeJS(order.id)}',
                            'REALIZOWANE'
                        )"
                    >
                        🔧 Realizowane
                    </button>


                    <button
                        class="actionButton green"
                        onclick="changeStatus(
                            '${escapeJS(order.id)}',
                            'ZREALIZOWANE'
                        )"
                    >
                        ✓ Zrealizowane
                    </button>


                    <button
                        class="actionButton red"
                        onclick="changeStatus(
                            '${escapeJS(order.id)}',
                            'ANULOWANE'
                        )"
                    >
                        ✕ Anuluj
                    </button>


                    <button
                        class="actionButton"
                        onclick="deleteOrder(
                            '${escapeJS(order.id)}'
                        )"
                    >
                        🗑 Usuń
                    </button>


                </div>

            </div>

        </article>

    `;

}


/* =====================================================
   CHANGE STATUS
===================================================== */

function changeStatus(
    id,
    status
){

    const orders =
        getOrders();


    const order =
        orders.find(
            item =>
                item.id === id
        );


    if(!order){

        return;

    }


    order.status =
        status;


    saveOrders(
        orders
    );


    renderOrders();


    showToast(
        "✓ Status zmieniony na: "
        + status
    );

}


/* =====================================================
   DELETE
===================================================== */

function deleteOrder(
    id
){

    const confirmDelete =
        confirm(
            "Czy na pewno chcesz usunąć to zamówienie?"
        );


    if(
        !confirmDelete
    ){

        return;

    }


    let orders =
        getOrders();


    orders =
        orders.filter(
            order =>
                order.id !== id
        );


    saveOrders(
        orders
    );


    renderOrders();


    showToast(
        "🗑 Zamówienie usunięte"
    );

}


/* =====================================================
   STATS
===================================================== */

function updateStats(
    orders
){

    const total =
        orders.length;


    const newOrders =
        orders.filter(
            order =>
                order.status ===
                "NOWE"
        ).length;


    const revenue =
        orders.reduce(
            (
                sum,
                order
            ) => {

                if(
                    order.status ===
                    "ANULOWANE"
                ){

                    return sum;

                }

                return (
                    sum +
                    Number(
                        order.total || 0
                    )
                );

            },
            0
        );


    const freeShipping =
        orders.filter(
            order =>
                Number(
                    order.shipping
                ) === 0
        ).length;


    document
        .getElementById(
            "ordersCount"
        )
        .textContent =
        total;


    document
        .getElementById(
            "newCount"
        )
        .textContent =
        newOrders;


    document
        .getElementById(
            "revenue"
        )
        .textContent =
        money(
            revenue
        );


    document
        .getElementById(
            "freeShippingCount"
        )
        .textContent =
        freeShipping;

}


/* =====================================================
   REFRESH
===================================================== */

function refreshOrders(){

    renderOrders();

    showToast(
        "✓ Panel odświeżony"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJS(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(
    text
){

    const toast =
        document
        .getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}
