<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Admin — Printerlase3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 10% 10%,rgba(0,180,255,.18),transparent 30%),
        radial-gradient(circle at 90% 80%,rgba(110,50,255,.18),transparent 30%),
        #020611;
}

/* HEADER */

header{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    background:rgba(2,7,18,.88);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-size:18px;
    font-weight:900;
}

.logoBox{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:12px;
    font-size:20px;
    background:linear-gradient(
        135deg,
        #00dfff,
        #087dff,
        #813cff
    );
    box-shadow:0 0 30px rgba(0,160,255,.3);
}

.logo span{
    color:#36d9ff;
}

.headerButtons{
    display:flex;
    gap:10px;
}

.headerBtn{
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    color:white;
    padding:10px 15px;
    border-radius:10px;
    text-decoration:none;
    cursor:pointer;
    font-weight:700;
    font-size:12px;
}

.headerBtn:hover{
    background:rgba(255,255,255,.1);
}

.logout{
    border-color:rgba(255,70,90,.25);
    color:#ff8794;
}

/* MAIN */

.container{
    width:min(1400px,92%);
    margin:auto;
    padding:45px 0;
}

.pageTitle{
    margin-bottom:35px;
}

.pageTitle small{
    color:#35d8ff;
    font-size:10px;
    letter-spacing:3px;
    font-weight:900;
}

.pageTitle h1{
    margin-top:10px;
    font-size:44px;
}

.pageTitle p{
    margin-top:10px;
    color:#728096;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    padding:24px;
    border-radius:19px;
    background:rgba(7,17,32,.9);
    border:1px solid rgba(255,255,255,.07);
}

.statIcon{
    font-size:25px;
}

.statTitle{
    margin-top:14px;
    color:#718096;
    font-size:10px;
    font-weight:800;
}

.statValue{
    margin-top:7px;
    font-size:28px;
    font-weight:1000;
}

/* PANELS */

.panel{
    margin-bottom:22px;
    padding:25px;
    border-radius:20px;
    background:rgba(7,17,32,.9);
    border:1px solid rgba(255,255,255,.07);
}

.panelHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.panel h2{
    font-size:19px;
}

/* ORDERS */

.empty{
    padding:55px 20px;
    text-align:center;
    color:#6f7d91;
}

.emptyIcon{
    font-size:50px;
    margin-bottom:15px;
}

.order{
    margin-bottom:15px;
    padding:20px;
    border-radius:16px;
    background:#020a15;
    border:1px solid rgba(255,255,255,.06);
}

.order:last-child{
    margin-bottom:0;
}

.orderTop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:20px;
}

.orderNumber{
    color:#35d8ff;
    font-size:14px;
    font-weight:1000;
}

.orderDate{
    color:#627086;
    font-size:10px;
    margin-top:5px;
}

.status{
    padding:7px 10px;
    border-radius:8px;
    color:#42e6a4;
    background:rgba(66,230,164,.08);
    border:1px solid rgba(66,230,164,.15);
    font-size:9px;
    font-weight:900;
}

.orderInfo{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:15px;
}

.infoTitle{
    color:#647288;
    font-size:9px;
    font-weight:800;
    margin-bottom:6px;
}

.infoValue{
    font-size:13px;
    font-weight:700;
    word-break:break-word;
}

/* PRODUCTS */

.products{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,.06);
}

.product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    color:#9ba8b9;
    font-size:12px;
}

.productPrice{
    color:white;
    font-weight:700;
}

.total{
    margin-top:18px;
    text-align:right;
    font-size:21px;
    font-weight:1000;
}

/* TOOLS */

.tools{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.toolBtn{
    padding:12px 16px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    color:white;
    cursor:pointer;
    font-weight:700;
    font-size:11px;
}

.toolBtn:hover{
    background:rgba(255,255,255,.09);
}

.deleteBtn{
    color:#ff8492;
    border-color:rgba(255,60,80,.2);
    background:rgba(255,60,80,.06);
}

/* LOGIN BLOCK */

.lockScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    text-align:center;
}

.lockBox{
    width:min(450px,100%);
    padding:40px;
    border-radius:25px;
    background:#07111f;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 100px rgba(0,0,0,.45);
}

.lockIcon{
    font-size:65px;
    margin-bottom:20px;
}

.lockBox h1{
    font-size:28px;
}

.lockBox p{
    margin:13px 0 25px;
    color:#718096;
    line-height:1.5;
}

.loginButton{
    display:inline-block;
    padding:13px 20px;
    border-radius:11px;
    text-decoration:none;
    color:white;
    font-weight:800;
    font-size:12px;
    background:linear-gradient(
        100deg,
        #008cff,
        #783cff
    );
}

/* RESPONSIVE */

@media(max-width:1000px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .orderInfo{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .logo{
        font-size:14px;
    }

    .headerBtn{
        padding:8px 10px;
    }

    .container{
        width:94%;
        padding-top:30px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .orderInfo{
        grid-template-columns:1fr;
    }

    .pageTitle h1{
        font-size:32px;
    }

    .orderTop{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<script>

/* =========================================
   USTAWIENIA ADMINA
========================================= */

const ADMIN_EMAIL =
    "rembolek341@gmail.com";


/* =========================================
   SPRAWDZENIE ZALOGOWANEGO UŻYTKOWNIKA
========================================= */

function getCurrentUser(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "printerlase_current_user"
            )
        );

    }catch(error){

        return null;

    }

}


const currentUser =
    getCurrentUser();


/* =========================================
   BLOKADA PANELU
========================================= */

if(
    !currentUser ||
    !currentUser.email ||
    currentUser.email.toLowerCase()
        !== ADMIN_EMAIL.toLowerCase()
){

    document.body.innerHTML = `

        <div class="lockScreen">

            <div class="lockBox">

                <div class="lockIcon">
                    🔒
                </div>

                <h1>
                    Brak dostępu
                </h1>

                <p>
                    Ten panel jest przeznaczony
                    wyłącznie dla administratora.
                </p>

                <a
                    href="konto.html"
                    class="loginButton"
                >
                    Zaloguj się
                </a>

            </div>

        </div>

    `;

}else{

    loadAdminPanel();

}


/* =========================================
   ZAMÓWIENIA
========================================= */

function getOrders(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    "printerlase_orders"
                )
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


/* =========================================
   ŁADOWANIE PANELU
========================================= */

function loadAdminPanel(){

    const orders =
        getOrders();


    let totalSales = 0;

    let totalProducts = 0;

    const customers =
        new Set();


    orders.forEach(order=>{

        totalSales +=
            Number(
                order.total || 0
            );


        if(
            order.customer &&
            order.customer.email
        ){

            customers.add(
                order.customer.email
            );

        }


        if(
            Array.isArray(
                order.products
            )
        ){

            order.products.forEach(
                product=>{

                    totalProducts +=
                        Number(
                            product.quantity ||
                            product.qty ||
                            1
                        );

                }
            );

        }

    });


    document.getElementById(
        "ordersCount"
    ).textContent =
        orders.length;


    document.getElementById(
        "sales"
    ).textContent =
        money(totalSales);


    document.getElementById(
        "customers"
    ).textContent =
        customers.size;


    document.getElementById(
        "products"
    ).textContent =
        totalProducts;


    renderOrders(orders);

}


/* =========================================
   WYŚWIETLANIE ZAMÓWIEŃ
========================================= */

function renderOrders(orders){

    const box =
        document.getElementById(
            "orders"
        );


    if(orders.length === 0){

        box.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    📦
                </div>

                Nie ma jeszcze żadnych
                zamówień.

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    const sorted =
        [...orders].reverse();


    sorted.forEach(
        (order,index)=>{

            const customer =
                order.customer || {};


            const products =
                Array.isArray(
                    order.products
                )
                ? order.products
                : [];


            let productHTML = "";


            products.forEach(
                product=>{

                    const quantity =
                        Number(
                            product.quantity ||
                            product.qty ||
                            1
                        );


                    const price =
                        Number(
                            product.price || 0
                        );


                    productHTML += `

                        <div class="product">

                            <span>
                                ${escapeHTML(
                                    product.name ||
                                    "Produkt"
                                )}

                                × ${quantity}
                            </span>

                            <span
                                class="productPrice"
                            >
                                ${money(
                                    price * quantity
                                )}
                            </span>

                        </div>

                    `;

                }
            );


            const orderNumber =
                order.number ||
                "ZAMÓWIENIE-" +
                String(
                    orders.length - index
                ).padStart(4,"0");


            let date =
                "Brak daty";


            if(order.date){

                const parsed =
                    new Date(order.date);

                if(
                    !isNaN(
                        parsed.getTime()
                    )
                ){

                    date =
                        parsed.toLocaleString(
                            "pl-PL"
                        );

                }

            }


            box.innerHTML += `

                <div class="order">

                    <div class="orderTop">

                        <div>

                            <div class="orderNumber">

                                ${escapeHTML(
                                    orderNumber
                                )}

                            </div>

                            <div class="orderDate">

                                ${date}

                            </div>

                        </div>


                        <div class="status">

                            NOWE

                        </div>

                    </div>


                    <div class="orderInfo">

                        <div>

                            <div class="infoTitle">
                                KLIENT
                            </div>

                            <div class="infoValue">

                                ${escapeHTML(
                                    customer.name ||
                                    "-"
                                )}

                            </div>

                        </div>


                        <div>

                            <div class="infoTitle">
                                E-MAIL
                            </div>

                            <div class="infoValue">

                                ${escapeHTML(
                                    customer.email ||
                                    "-"
                                )}

                            </div>

                        </div>


                        <div>

                            <div class="infoTitle">
                                TELEFON
                            </div>

                            <div class="infoValue">

                                ${escapeHTML(
                                    customer.phone ||
                                    "-"
                                )}

                            </div>

                        </div>


                        <div>

                            <div class="infoTitle">
                                DOSTAWA
                            </div>

                            <div class="infoValue">

                                ${escapeHTML(
                                    order.delivery ||
                                    order.shipping ||
                                    "-"
                                )}

                            </div>

                        </div>

                    </div>


                    <div class="products">

                        ${productHTML}

                    </div>


                    <div class="total">

                        Razem:

                        ${money(
                            order.total || 0
                        )}

                    </div>

                </div>

            `;

        }
    );

}


/* =========================================
   FORMATOWANIE CENY
========================================= */

function money(value){

    return Number(value || 0)
        .toFixed(2)
        .replace(".",",")
        + " zł";

}


/* =========================================
   BEZPIECZNE WYŚWIETLANIE TEKSTU
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   WYLOGOWANIE
========================================= */

function logout(){

    localStorage.removeItem(
        "printerlase_current_user"
    );

    localStorage.removeItem(
        "printerlase_admin_email"
    );

    window.location.href =
        "konto.html";

}


/* =========================================
   USUWANIE ZAMÓWIEŃ
========================================= */

function clearOrders(){

    const answer =
        confirm(
            "Czy na pewno chcesz usunąć wszystkie zamówienia?"
        );


    if(!answer){

        return;

    }


    localStorage.removeItem(
        "printerlase_orders"
    );


    loadAdminPanel();

}


/* =========================================
   ODŚWIEŻANIE
========================================= */

setInterval(()=>{

    if(
        document.getElementById(
            "orders"
        )
    ){

        loadAdminPanel();

    }

},5000);

</script>


<!-- =====================================
     GŁÓWNY PANEL
===================================== -->

<header>

    <div class="logo">

        <div class="logoBox">
            P
        </div>

        Printerlase<span>3D</span>

    </div>


    <div class="headerButtons">

        <a
            href="index.html"
            class="headerBtn"
        >
            ← Sklep
        </a>


        <button
            class="headerBtn logout"
            onclick="logout()"
        >
            Wyloguj
        </button>

    </div>

</header>


<main class="container">


    <!-- TYTUŁ -->

    <div class="pageTitle">

        <small>
            PANEL ADMINISTRATORA
        </small>

        <h1>
            Witaj, Admin 👋
        </h1>

        <p>
            Zarządzaj zamówieniami
            Printerlase3D.
        </p>

    </div>


    <!-- STATYSTYKI -->

    <section class="stats">


        <div class="stat">

            <div class="statIcon">
                📦
            </div>

            <div class="statTitle">
                ZAMÓWIENIA
            </div>

            <div
                class="statValue"
                id="ordersCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="statIcon">
                💰
            </div>

            <div class="statTitle">
                SPRZEDAŻ
            </div>

            <div
                class="statValue"
                id="sales"
            >
                0,00 zł
            </div>

        </div>


        <div class="stat">

            <div class="statIcon">
                👥
            </div>

            <div class="statTitle">
                KLIENCI
            </div>

            <div
                class="statValue"
                id="customers"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="statIcon">
                🛒
            </div>

            <div class="statTitle">
                SPRZEDANE PRODUKTY
            </div>

            <div
                class="statValue"
                id="products"
            >
                0
            </div>

        </div>


    </section>


    <!-- ZAMÓWIENIA -->

    <section class="panel">

        <div class="panelHeader">

            <h2>
                📦 Zamówienia
            </h2>

            <button
                class="toolBtn"
                onclick="loadAdminPanel()"
            >
                ↻ Odśwież
            </button>

        </div>


        <div id="orders">

        </div>

    </section>


    <!-- NARZĘDZIA -->

    <section class="panel">

        <div class="panelHeader">

            <h2>
                ⚙️ Narzędzia
            </h2>

        </div>


        <div class="tools">

            <a
                href="index.html"
                class="toolBtn"
                style="text-decoration:none;"
            >
                🏠 Strona główna
            </a>


            <button
                class="toolBtn"
                onclick="loadAdminPanel()"
            >
                🔄 Odśwież dane
            </button>


            <button
                class="toolBtn deleteBtn"
                onclick="clearOrders()"
            >
                🗑️ Usuń zamówienia
            </button>

        </div>

    </section>


</main>

</body>
</html>
